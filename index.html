<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f4; --text:#1b1f27; --muted:#5b6472; --border:#d5d9e0;
  --accent:#2457d6; --accent-ink:#ffffff; --accent-soft:#e3ebff;
  --ok-bg:#dff5e6; --ok-border:#2e9d57; --ok-ink:#12522c;
  --bad-bg:#fde3e3; --bad-border:#d34545; --bad-ink:#7a1b1b;
  --warn-bg:#fff3d6; --warn-border:#d99a1a; --warn-ink:#6a4700;
  --ctx-bg:#eef3fb; --ctx-border:#b9c8e6;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#101319; --surface:#181c24; --surface-2:#222833; --text:#e6e9ef; --muted:#9aa4b4; --border:#2e3644;
    --accent:#7aa2ff; --accent-ink:#0d1220; --accent-soft:#1f2b49;
    --ok-bg:#12331f; --ok-border:#3fbf74; --ok-ink:#a8ebc3;
    --bad-bg:#3a1819; --bad-border:#ef6a6a; --bad-ink:#ffc2c2;
    --warn-bg:#35290e; --warn-border:#e0a82e; --warn-ink:#ffe2a3;
    --ctx-bg:#1a2233; --ctx-border:#33425f;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#101319; --surface:#181c24; --surface-2:#222833; --text:#e6e9ef; --muted:#9aa4b4; --border:#2e3644;
  --accent:#7aa2ff; --accent-ink:#0d1220; --accent-soft:#1f2b49;
  --ok-bg:#12331f; --ok-border:#3fbf74; --ok-ink:#a8ebc3;
  --bad-bg:#3a1819; --bad-border:#ef6a6a; --bad-ink:#ffc2c2;
  --warn-bg:#35290e; --warn-border:#e0a82e; --warn-ink:#ffe2a3;
  --ctx-bg:#1a2233; --ctx-border:#33425f;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:1.25rem;margin:4px 56px 2px 0;line-height:1.25}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
#themeBtn{position:fixed;top:10px;right:10px;z-index:50;width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:1.2rem;cursor:pointer;box-shadow:var(--shadow)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;margin-bottom:12px}
.modes button{border:0;background:transparent;color:var(--muted);padding:10px 8px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}
.tabs button{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:7px 12px;border-radius:999px;font:inherit;font-size:.88rem;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tabs .cnt{opacity:.75;font-size:.8em;margin-left:4px}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--border);margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stats{font-size:.9rem;color:var(--muted);flex:1 1 auto}
.stats b{color:var(--text)}
.redo{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:7px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.redo:hover{border-color:var(--accent)}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 14px 12px;margin-bottom:14px;box-shadow:var(--shadow)}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.qnum{font-weight:700}
.chip{font-size:.74rem;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:2px 9px;border-radius:999px}
.chip.alt{background:var(--surface-2);color:var(--muted)}
.ctx{background:var(--ctx-bg);border:1px solid var(--ctx-border);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:.93rem}
.ctx b{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.stem{margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;transition:background .12s,border-color .12s,opacity .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:0 0 auto;font-weight:700;min-width:1.4em;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok-ink)}
.opt.ok .l{color:var(--ok-ink)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-border);color:var(--bad-ink)}
.opt.bad .l{color:var(--bad-ink)}
.opt.dim{opacity:.45}
.fb{margin-top:10px;font-weight:600;font-size:.93rem}
.fb.ok{color:var(--ok-ink)} .fb.bad{color:var(--bad-ink)}
.note{margin-top:10px;background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:.9rem}
.note b{display:block;margin-bottom:2px}
.result{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:16px;text-align:center;margin:8px 0 20px}
.result .big{font-size:1.6rem;font-weight:800}
.empty{color:var(--muted);text-align:center;padding:30px 0}
@media (max-width:480px){ .wrap{padding:12px 10px 70px} .card{padding:12px 11px} h1{font-size:1.12rem} }
</style>

<script id="payload" type="application/json">{"data": [{"id": "p02-7", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 7, "ctx": null, "stem": "Paciente de 32 anos chega ao ambulatório de neurologia com quadro de paralisia facial à esquerda. Ao examinar o paciente, observa-se dificuldade para levantar a sobrancelha esquerda, dificuldade para fechar o olho esquerdo, desvio de rima labial para direita e apagamento do sulco nasolabial à esquerda. Conclui-se tratar de:", "opts": ["Lesão central do VII nervo à esquerda.", "Lesão periférica do VII nervo à esquerda.", "Lesão central do VII nervo à direita.", "Lesão periférica do VII nervo à direita."], "correct": 1, "fixed": false, "note": null}, {"id": "p02-8", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 8, "ctx": null, "stem": "Paciente de 78 anos, com quadro de bradicinesia, tremor de repouso à esquerda e sinal da roda denteada à esquerda. Trata-se de provável:", "opts": ["Síndrome cerebelar.", "Síndrome extrapiramidal do tipo hipercinética.", "Síndrome de segundo neurônio motor.", "Síndrome extrapiramidal do tipo hipocinética."], "correct": 3, "fixed": false, "note": null}, {"id": "p02-9", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 9, "ctx": null, "stem": "Ao avaliar um paciente encontrado em via pública desacordado, você observa abertura ocular apenas com estímulo doloroso, emissão de sons incompreensíveis e resposta motora com localização de estímulo doloroso, sem obedecer comandos. Assinale a pontuação na Escala de Coma de Glasgow do referido paciente:", "opts": ["6", "7", "8", "9"], "correct": 3, "fixed": false, "note": null}, {"id": "p02-10", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 10, "ctx": null, "stem": "As provas de Mingazzini e Barré são provas que avaliam:", "opts": ["Sensibilidade tátil.", "Tônus muscular.", "Força muscular.", "Trofismo."], "correct": 2, "fixed": false, "note": null}, {"id": "p02-11", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 11, "ctx": null, "stem": "Assinale a alternativa que corresponde aos achados semiológicos encontrados na surdez condutiva:", "opts": ["Teste de Rinne positivo e Teste de Weber com lateralização para ouvido de melhor audição.", "Teste de Rinne negativo e Teste de Weber com lateralização para ouvido de pior audição.", "Teste de Rinne positivo e Teste de Weber com lateralização para ouvido de pior audição.", "Teste de Rinne negativo e Teste de Weber com lateralização para ouvido de melhor audição."], "correct": 1, "fixed": false, "note": null}, {"id": "p02-12", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 12, "ctx": null, "stem": "Paciente é atendido na emergência neurológica com quadro de cefaleia de forte intensidade, vômitos, febre e inapetência há cerca de 3 dias. Ao examinar o paciente, evidencia-se rigidez de nuca. Quais outros achados podem ser encontrados na síndrome neurológica informada?", "opts": ["Sinal de Babinski, clônus e sincinesia.", "Sinal da cortina de Vernet, reflexo do vômito abolido e disfonia.", "Fasciculações, hipotonia e arreflexia.", "Sinais de Kernig, Brudzinski e Lasègue positivos."], "correct": 3, "fixed": false, "note": null}, {"id": "p02-13", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 13, "ctx": null, "stem": "Ao avaliar a força motora de um paciente com suspeita de Guillain-Barré, observa-se incapacidade de vencer a gravidade com os membros inferiores na manobra de Mingazzini, mas possibilidade de realizar movimentos de lateralização com membros apoiados. Conclui-se que a força motora dos membros inferiores, de acordo com a escala MRC (Medical Research Council), é:", "opts": ["Grau 2.", "Grau 3.", "Grau 4.", "Grau 5."], "correct": 0, "fixed": false, "note": null}, {"id": "p02-14", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 14, "ctx": null, "stem": "São achados da síndrome cerebelar:", "opts": ["Hipotonia, fasciculações e arreflexia.", "Hipotonia, reflexo pendular e disdiadococinesia.", "Hipertonia, Babinski e hiperreflexia.", "Hipertonia, bradicinesia e tremor de repouso."], "correct": 1, "fixed": false, "note": null}, {"id": "p02-15", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 15, "ctx": null, "stem": "Paciente é atendido com queixa de dormência em face. Ao exame, apresenta desvio de mandíbula para direita, abolição do reflexo córneo-palpebral à direita e hipoestesia tátil em ramos oftálmico, maxilar e mandibular à direita. De acordo com os achados, trata-se de provável lesão do:", "opts": ["VII nervo à direita.", "VII nervo à esquerda.", "V nervo à esquerda.", "V nervo à direita."], "correct": 3, "fixed": false, "note": null}, {"id": "p02-16", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 16, "ctx": null, "stem": "São achados da lesão do nervo oculomotor (III) à esquerda:", "opts": ["Ptose palpebral à esquerda, estrabismo convergente e pupila esquerda midriática.", "Ptose palpebral à esquerda, estrabismo divergente e pupila esquerda midriática.", "Ptose palpebral à direita, estrabismo convergente e pupila direita midriática.", "Ptose palpebral à direita, estrabismo divergente e pupila direita midriática."], "correct": 1, "fixed": false, "note": null}, {"id": "p04-1", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 1, "ctx": null, "stem": "Em relação aos nervos cranianos, analise as seguintes alternativas: I- O segundo nervo craniano é o olfatório, puramente sensitivo. Ele é responsável pelo olfato. II- O terceiro nervo craniano é o oculomotor, puramente motor. Ele inerva os músculos reto superior, reto inferior, reto medial e oblíquo superior. III- O quinto nervo craniano é o trigêmeo. Sua porção sensitiva é responsável pela sensibilidade da face e sua porção motora inerva os músculos da mastigação. IV- O sétimo nervo craniano é o facial. Ele é responsável pela gustação dos 2/3 anteriores da língua e pela mímica facial.", "opts": ["I, II, III e IV", "II, III e IV", "III e IV", "IV"], "correct": 2, "fixed": false, "note": null}, {"id": "p04-2", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 2, "ctx": null, "stem": "Na inspeção de paciente com lesão do sexto nervo craniano à esquerda (abducente), espera-se encontrar:", "opts": ["Ptose à esquerda", "Estrabismo divergente", "Midríase à esquerda", "Estrabismo convergente"], "correct": 3, "fixed": false, "note": null}, {"id": "p04-3", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 3, "ctx": null, "stem": "Durante avaliação de um paciente, observa-se desvio de mandíbula para esquerda, hipoestesia tátil e dolorosa à esquerda e reflexo córneo-palpebral abolido à esquerda. Trata-se de provável lesão do:", "opts": ["III nervo à esquerda", "IV nervo à esquerda", "V nervo à esquerda", "VII nervo à esquerda"], "correct": 2, "fixed": false, "note": null}, {"id": "p04-4", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 4, "ctx": null, "stem": "Paciente apresenta reflexos pendulares, marcha ebriosa, disdiadococinesia e dismetria. Trata-se de provável:", "opts": ["Síndrome do primeiro neurônio motor", "Síndrome do segundo neurônio motor", "Síndrome extra-piramidal hipocinética", "Síndrome cerebelar"], "correct": 3, "fixed": false, "note": null}, {"id": "p04-5", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 5, "ctx": null, "stem": "Paciente não consegue realizar movimentos alternados rápidos e não acerta o alvo ao tocar o nariz. Isso corresponde a:", "opts": ["Ataxia e anosmia", "Dismetria e hipoestesia", "Disdiadococinesia e dismetria", "Hipertonia e atrofia"], "correct": 2, "fixed": false, "note": null}, {"id": "p04-6", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 6, "ctx": null, "stem": "Paciente vence a gravidade, porém não consegue vencer a resistência imposta pelo examinador. Segundo a escala MRC, força muscular:", "opts": ["Grau I", "Grau II", "Grau III", "Grau IV"], "correct": 2, "fixed": false, "note": null}, {"id": "p04-7", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 7, "ctx": null, "stem": "Reflexos profundos aumentados, hipertonia elástica, clônus e Babinski são achados de:", "opts": ["Síndrome do primeiro neurônio motor", "Síndrome do segundo neurônio motor", "Síndrome extra-piramidal", "Síndrome cerebelar"], "correct": 0, "fixed": false, "note": null}, {"id": "p04-8", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 8, "ctx": null, "stem": "Paciente em decúbito dorsal apresenta flexão dos joelhos à flexão passiva do pescoço. Este sinal é:", "opts": ["Brudzinski", "Kerning", "Lasègue", "Babinski"], "correct": 0, "fixed": false, "note": null}, {"id": "p04-9", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 9, "ctx": null, "stem": "Assinale a manobra que avalia irritação meníngea:", "opts": ["Mingazzini", "Kerning", "Prova dos braços estendidos", "Manobra de Barré"], "correct": 1, "fixed": false, "note": null}, {"id": "p04-10", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 10, "ctx": null, "stem": "Homem encontrado desacordado: não abre olhos, não verbaliza e localiza dor. A pontuação de Glasgow é:", "opts": ["6", "7", "8", "9"], "correct": 1, "fixed": false, "note": null}, {"id": "p06-1", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 1, "ctx": null, "stem": "São provas para avaliar a coordenação motora:", "opts": ["Diadococinesia, prova índice-nariz e Romberg.", "Lasègue, Kernig e prova índice-nariz.", "Barré, Mingazzini e manobra dos braços estendidos.", "Avaliação da marcha, Babinski e Lasègue."], "correct": 0, "fixed": false, "note": null}, {"id": "p06-2", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 2, "ctx": null, "stem": "Sobre o nível de consciência na semiologia neurológica, assinale a alternativa CORRETA:", "opts": ["A consciência corporal refere-se primariamente à capacidade de auto- supervisionar a execução de um ato motor.", "O nível de consciência é definido como o grau de alerta, que pode variar de vigília a coma, sendo a Escala de Coma de Glasgow uma ferramenta padronizada para sua avaliação.", "A avaliação do nível de consciência é realizada exclusivamente pela pesquisa dos reflexos relacionados às estruturas do tronco encefálico, como o reflexo vestíbulo-oculo-cefálico.", "O conteúdo da consciência refere-se apenas à motricidade ocular extrínseca e aos reflexos pupilares."], "correct": 1, "fixed": false, "note": null}, {"id": "p06-3", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 3, "ctx": null, "stem": "Um paciente chega ao pronto-socorro após um acidente. Na avaliação inicial, o médico verifica que o paciente abre os olhos apenas quando é chamado pelo nome em voz alta. Quando questionado, emite apenas sons incompreensíveis. Ao aplicar um estímulo doloroso no leito ungueal, o paciente realiza um movimento de retirada (flexão normal) do membro. Com base na Escala de Coma de Glasgow, qual é a pontuação total deste paciente?", "opts": ["7 pontos.", "9 pontos.", "11 pontos.", "13 pontos."], "correct": 1, "fixed": false, "note": null}, {"id": "p06-4", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 4, "ctx": null, "stem": "A avaliação clínica do nervo óptico (NC II) inclui a pesquisa de todos os aspectos a seguir, EXCETO:", "opts": ["Campimetria visual.", "Reflexo córneo-palpebral.", "Acuidade visual.", "Distinção de cores."], "correct": 1, "fixed": false, "note": null}, {"id": "p06-5", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 5, "ctx": null, "stem": "Ao realizar o exame neurológico de um paciente com suspeita de lesão do nervo acessório (NC XI) do lado direito, o médico procede à avaliação da força dos músculos inervados por este nervo. Assinale a alternativa que descreve um potencial e esperado achado na avaliação da motricidade do pescoço neste cenário.", "opts": ["Dificuldade para girar a cabeça para o lado direito contra resistência, devido à fraqueza do músculo esternocleidomastóideo esquerdo.", "Dificuldade para elevar o ombro esquerdo contra resistência, devido à fraqueza do músculo trapézio esquerdo.", "Dificuldade para girar a cabeça para o lado esquerdo contra resistência, devido à fraqueza do músculo esternocleidomastóideo direito.", "Atrofia visível do músculo trapézio esquerdo e desvio da cabeça para o lado esquerdo em repouso."], "correct": 3, "fixed": false, "note": "O gabarito oficial é D, mas a descrição não se sustenta: numa lesão do NC XI à direita, o músculo atingido é o trapézio/esternocleidomastóideo direito (atrofia do trapézio direito; dificuldade de girar a cabeça para a esquerda — alternativa C). Mantive o gabarito oficial."}, {"id": "p06-6", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 6, "ctx": null, "stem": "Durante a avaliação no ambulatório de neurologia, o médico assistente solicita ao paciente que bata palma toda vez que escutar a letra \"A\", soletrando em seguida uma sequência de letras diversas, contendo a letra \"A\" dentre outras letras repetidas vezes. Qual domínio cognitivo é o principal foco de avaliação com este teste?", "opts": ["Memória.", "Orientação temporal.", "Atenção.", "Fluência verbal."], "correct": 2, "fixed": false, "note": null}, {"id": "p06-7", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 7, "ctx": null, "stem": "Durante avaliação de paciente com suspeita de AVC, observa-se força grau 3 em membro superior direito. De acordo com a MRC (escala de avaliação de força muscular), o paciente em questão:", "opts": ["Consegue vencer a gravidade e fazer força contra a resistência do examinador.", "Consegue vencer a gravidade, mas não consegue fazer força contra a resistência do examinador.", "Não consegue vencer a gravidade e nem fazer força contra a resistência do examinador, mas consegue fazer movimento de lateralização do membro.", "Tem apenas contração muscular visível."], "correct": 1, "fixed": false, "note": null}, {"id": "p06-8", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 8, "ctx": null, "stem": "A hipotonia, atrofia muscular e hiperreflexia são achados da:", "opts": ["Síndrome de primeiro neurônio motor.", "Síndrome de segundo neurônio motor.", "Síndrome extra-piramidal.", "Síndrome meníngea."], "correct": 1, "fixed": false, "note": "O enunciado cita 'hiperreflexia', mas na síndrome do 2º neurônio motor os reflexos estão diminuídos (hiporreflexia); hiperreflexia é do 1º neurônio. O gabarito oficial (B) é coerente com hipotonia + atrofia — provável erro de redação do enunciado."}, {"id": "p06-9", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 9, "ctx": null, "stem": "São achados de uma síndrome parkinsoniana:", "opts": ["Hipertonia, hiperreflexia e sinal de Babinski.", "Hipotonia, hiperreflexia e sinal da roda denteada.", "Hipertonia, bradicinesia e tremor de repouso.", "Hipotonia, hiperreflexia e fasciculações."], "correct": 2, "fixed": false, "note": null}, {"id": "p06-10", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 10, "ctx": null, "stem": "As fasciculações, vistas na síndrome de segundo neurônio motor, consistem em:", "opts": ["Movimento em espelho do membro parético.", "Redução do tônus muscular nos membros inferiores.", "Aumento do tônus muscular visto nos membros superiores.", "Contrações musculares visíveis e involuntárias de um grupo muscular."], "correct": 3, "fixed": false, "note": null}, {"id": "p12-8", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 8, "ctx": null, "stem": "Ao avaliar um paciente com sequela de AVC isquêmico, você nota que o mesmo apresenta um déficit motor à direita. Ele não consegue vencer a gravidade com o membro superior direito (MSD), mas consegue fazer movimentos de lateralização. Já com o membro inferior direito (MID), ele consegue vencer a gravidade, porém, não consegue fazer força contra a resistência do examinador. De acordo com a graduação de força (MRC-Medical Research Council), ele apresenta:", "opts": ["Grau I no MSD e grau II no MID", "Grau II no MSD e grau III no MID", "Grau III no MSD e grau IV no MID", "Grau IV no MSD e grau V no MID"], "correct": 1, "fixed": false, "note": null}, {"id": "p12-9", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 9, "ctx": null, "stem": "“Durante a marcha, o paciente mantém o olhar fixo no chão, levanta abruptamente o membro inferior e ao ser recolocado, os calcanhares tocam o solo pesadamente.” A descrição feita é referente a qual marcha patológica?", "opts": ["Ceifante", "Escarvante", "Tabética", "Parkinsoniana"], "correct": 2, "fixed": false, "note": null}, {"id": "p12-10", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 10, "ctx": null, "stem": "O exame da motricidade engloba a avaliação do tônus muscular, no qual pode ser descrito como a resistência sentida quando uma parte do corpo é movida passivamente. Assinale a alternativa que contempla as síndromes neurológicas que aumentam o tônus muscular:", "opts": ["Síndrome do segundo neurônio motor e síndrome cerebelar", "Síndrome cerebelar e síndrome meníngea", "Síndrome extrapiramidal (hipocinética) e síndrome do primeiro neurônio motor", "Síndrome extrapiramidal e síndrome do segundo neurônio motor"], "correct": 2, "fixed": false, "note": null}, {"id": "p12-11", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 11, "ctx": null, "stem": "A manobra de Barré avalia:", "opts": ["Sensibilidade", "Coordenação motora", "Força motora", "Tônus muscular"], "correct": 2, "fixed": false, "note": null}, {"id": "p12-12", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 12, "ctx": null, "stem": "Os reflexos profundos estão reduzidos ou abolidos em qual síndrome neurológica?", "opts": ["Síndrome do primeiro neurônio motor", "Síndrome do segundo neurônio motor", "Síndrome meníngea", "Síndrome extrapiramida"], "correct": 1, "fixed": false, "note": null}, {"id": "p12-13", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 13, "ctx": null, "stem": "São consideradas etapas do exame clínico do nervo óptico, EXCETO:", "opts": ["Campimetria visual por confrontação", "Teste de acuidade visual por tabela de Snellen", "Pesquisa do reflexo córneo-palpebral.", "Teste de discriminação de cores."], "correct": 2, "fixed": false, "note": null}, {"id": "p12-14", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 14, "ctx": null, "stem": "A pesquisa do reflexo pupilar (fotomotor) é uma importante etapa do exame físico neurológico. Se, durante sua execução, observa-se o seguinte conjunto de respostas: - Olho esquerdo: reflexo fotomotor direto ausente / reflexo fotomotor indireto (consensual) normal. - Olho direito: reflexo fotomotor direto normal / reflexo fotomotor indireto (consensual) ausente. A disfunção, responsável pelas alterações observadas mais provavelmente encontra-se na:", "opts": ["Eferência do reflexo, no lado esquerdo.", "Aferência do reflexo, no lado esquerdo.", "Eferência do reflexo, no lado direito.", "Aferência do reflexo, no lado direito."], "correct": 1, "fixed": false, "note": null}, {"id": "p12-15", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 15, "ctx": null, "stem": "Durante a avaliação da mobilidade da língua, testa-se a função do nervo:", "opts": ["Glossofaríngeo.", "Acessório.", "Vago.", "Hipoglosso."], "correct": 3, "fixed": false, "note": null}, {"id": "p12-16", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 16, "ctx": null, "stem": "Durante a avaliação da escala de coma de Glasgow foram obtidos os seguintes padrões de resposta: - Abertura ocular: Espontânea. - Resposta verbal: Sem resposta (ausente). - Resposta motora: Localiza a dor. A pontuação registrada pela escala de coma de Glasgow é de:", "opts": ["8", "9", "10", "11"], "correct": 2, "fixed": false, "note": null}, {"id": "p12-17", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 17, "ctx": null, "stem": "Quanto às alterações relacionadas à linguagem, a disfunção do aparelho articulador (lábios, língua ou palato) decorrente de lesão neurológica denomina-se:", "opts": ["Dislalia.", "Disgrafia.", "Disartria.", "Disfonia."], "correct": 2, "fixed": false, "note": null}, {"id": "p13-1", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 1, "ctx": null, "stem": "São consideradas manobras que avaliam a força muscular, exceto:", "opts": ["Brudzinski", "Barré", "Manobra dos braços estendidos", "Mingazzini"], "correct": 0, "fixed": false, "note": null}, {"id": "p13-2", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 2, "ctx": null, "stem": "A avaliação da marcha é parte importante do exame neurológico, pois através dela podemos detectar achados característicos de doenças neurológicas. A cerca desse assunto, complete a seguinte afirmação: \"A marcha pode ocorrer em pacientes com alteração da propriocepção. Nela, o paciente olha fixamente para o chão, os pés são levantados abruptamente e explosivamente tocados no chão.\"", "opts": ["Escarvante", "Tabética", "Ceifante", "Dribosa"], "correct": 1, "fixed": false, "note": null}, {"id": "p13-3", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 3, "ctx": null, "stem": "Ao avaliar um paciente vítima de acidente vascular cerebral (AVC), o médico observa que ele apresenta perda de força em membro superior e inferior esquerdos. Durante avaliação do membro inferior esquerdo, paciente consegue vencer a gravidade com a perna direita, porém, não consegue fazer força contra a resistência imposta pelo examinador. Durante avaliação do membro superior esquerdo, paciente não consegue vencer a gravidade, porém, consegue realizar movimentos de lateralização com o membro apoiado. De acordo com a escala de força do MRC (Medical Research Council), a força muscular no membro inferior e superior esquerdos são, respectivamente:", "opts": ["5 e 4", "2 e 1", "3 e 2", "4 e 3"], "correct": 2, "fixed": false, "note": "Pequena falha no enunciado: diz 'perna direita' ao descrever o membro inferior esquerdo; o contexto é o lado esquerdo."}, {"id": "p13-4", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 4, "ctx": null, "stem": "Paciente comparece ao ambulatório com queixa de vertigem, vômitos e dificuldade para deambular. Durante avaliação, nota-se presença de disdiadococinesia à direita, prova index nariz com dismetria à direita e reflexo pendular à direita. Diante dos achados semiológicos, trata-se de provável:", "opts": ["Síndrome do segundo neurônio motor", "Síndrome extra piramidal", "Síndrome do primeiro neurônio motor", "Síndrome cerebelar"], "correct": 3, "fixed": false, "note": null}, {"id": "p13-5", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 5, "ctx": null, "stem": "São achados da síndrome piramidal (1º neurônio motor), exceto:", "opts": ["Sinal de Babinski", "Clônus", "Fasciculações", "Hipertonia elástica (sinal do canivete)"], "correct": 2, "fixed": false, "note": null}, {"id": "p13-6", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 6, "ctx": null, "stem": "Sobre a avaliação do nível de consciência através da Escala de Coma de Glasgow, julgue os itens a seguir: I. Inclui a avaliação da abertura ocular, resposta verbal e resposta motora a diferentes estímulos como o ambiente, estímulo de comando verbal e estímulo doloroso. II. Na situação de ausência completa de resposta verbal a pontuação final será menor ou igual a 11 pontos. Assinale a alternativa CORRETA:", "opts": ["Nenhum dos itens está correto.", "Apenas o item I está correto.", "Apenas o item II está correto.", "Ambos os itens estão corretos."], "correct": 3, "fixed": true, "note": null}, {"id": "p13-7", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 7, "ctx": null, "stem": "Sobre a avaliação clínica cognitiva relacionada às agnosias, julgue os itens a seguir: I - Entende-se por agnosia a capacidade de auto-supervisionar a execução de um ato motor. II - A incapacidade de reconhecer objeto pelo tato, sem o auxílio de outra modalidade sensorial (visão, audição, etc.) denomina-se agrafestesia. Assinale a alternativa CORRETA:", "opts": ["Nenhum dos itens está correto.", "Apenas o item I está correto.", "Apenas o item II está correto.", "Ambos os itens estão corretos."], "correct": 0, "fixed": true, "note": null}, {"id": "p13-8", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 8, "ctx": null, "stem": "Sobre o Mini Exame do Estado Mental (Mini-mental / MEEM), julgue os itens a seguir: I - Constitui um conjunto de testes que avalia objetivamente sinais relativos ao comprometimento cognitivo diverso, dentre eles: memória, orientação, atenção, cálculo e linguagem. II - Inclui, na avaliação de memória, a apresentação de três palavras, que devem ser inicialmente repetidas pelo paciente, e posteriormente (após no mínimo 2 minutos) evocadas e ditas ao examinador. Assinale a alternativa CORRETA:", "opts": ["Nenhum dos itens está correto.", "Apenas o item I está correto.", "Apenas o item II está correto.", "Ambos os itens estão corretos."], "correct": 3, "fixed": true, "note": null}, {"id": "p13-9", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 9, "ctx": null, "stem": "A incapacidade de reconhecer visualmente rostos familiares, sem o auxílio de outra modalidade sensorial (tato, audição, etc.), denomina-se:", "opts": ["Prosopagnosia", "Simultagnosia", "Fonagnosia", "Astereognosia"], "correct": 0, "fixed": false, "note": null}, {"id": "p13-10", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 10, "ctx": null, "stem": "Durante a avaliação clínica de um paciente idoso, admitido em Unidade de Terapia Intensiva em decorrência de Infecção do Trato Urinário, o médico assistente solicitou ao paciente que \"batesse palma toda vez que escutasse a letra A!\" Em seguida, soletrou \"S-A-V-E-A-H-A-A-R- T\". Recebeu corretamente a resposta de aplauso do paciente em momento oportuno. Assinale a alternativa que relaciona o principal domínio cognitivo avaliado por meio do teste aplicado:", "opts": ["Memória", "Orientação temporal", "Atenção", "Fluência verbal"], "correct": 2, "fixed": false, "note": null}, {"id": "p14-11", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 11, "ctx": null, "stem": "Sobre a avaliação de acuidade visual através do teste de Snellen, componente do exame clínico neurológico do NCII (n. óptico), julgue as alternativas a seguir e assinale a assertiva CORRETA:", "opts": ["A aplicação é realizada posicionando-se o paciente a 20 metros da tabela, solicitando-se que leia as letras apresentadas, a partir da primeira linha, em sequência, da esquerda para direita.", "Deve-se sempre avaliar a acuidade visual unilateralmente e individualizar a apresentação do resultado (direita e esquerda).", "A acuidade visual representada como 20/10 denota acuidade visual subnormal.", "Quando alterada acompanha simultaneamente a experimentação de diplopia pelo paciente."], "correct": 1, "fixed": false, "note": null}, {"id": "p14-12", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 12, "ctx": null, "stem": "Sobre a avaliação pupilar relativa ao exame neurológico, considere a descrição a seguir: \"Pupilas anisocóricas, diâmetro da pupila direita maior que da pupila esquerda. Reflexo fotomotor direto: normal à esquerda e ausente à direita. Reflexo fotomotor consensual: normal à esquerda e ausente à direita.\" Assinale a alternativa que apresenta uma topografia do sistema nervoso cuja disfunção possibilita a observação das alterações descritas:", "opts": ["Nervo óptico ou forame óptico à direita.", "Quiasma óptico.", "Gânglio ciliar ou fibras eferentes secundárias do nervo oculomotor direito (NC III).", "Núcleo pré-tectal ou colículo superior à direita."], "correct": 2, "fixed": false, "note": null}, {"id": "p14-13", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 13, "ctx": null, "stem": "Sobre a avaliação da motricidade ocular extrínseca, na presença de disfunção isolada do nervo abducente (NC VI) à esquerda, o sintoma de diplopia experimentado pelo paciente torna-se mais evidente quando o seguimento do alvo (olhar conjugado) ocorre no sentido:", "opts": ["Horizontal para esquerda.", "Horizontal para direita.", "Vertical para baixo.", "Vertical para cima."], "correct": 0, "fixed": false, "note": null}, {"id": "p14-14", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 14, "ctx": null, "stem": "São considerados reflexos relacionados ao exame clínico do nervo trigêmeo (NC V), EXCETO:", "opts": ["Reflexo mandibular.", "Reflexo córneo-palpebral.", "Reflexo de espirro.", "Reflexo de vômito."], "correct": 3, "fixed": false, "note": null}, {"id": "p14-15", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 15, "ctx": null, "stem": "Sobre o exame clínico do nervo facial (NC VII), suas correlações anatômicas e fisiopatológicas, assinale a assertiva CORRETA:", "opts": ["A presença de fraqueza ou paralisia dos músculos de toda a hemiface sugere a possibilidade de uma lesão do córtex do giro pré-central unilateralmente ou de suas projeções através da substância branca até a cápsula interna. A etiologia mais provável é um acidente vascular cerebral.", "A presença de fraqueza ou paralisia dos músculos da metade da face com manutenção do movimento da porção superior da face (sobrancelha e testa) bilateralmente sugere a possibilidade de uma lesão do nervo facial após sua origem aparente no sulco bulbo pontino.", "Inclui a avaliação do reflexo córneo-palpebral, relacionando-se à eferência da alça reflexa.", "Inclui a avaliação da força do músculo masseter."], "correct": 2, "fixed": false, "note": null}, {"id": "p14-16", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 16, "ctx": null, "stem": "Paciente 22 anos, previamente hígida, é atendida no pronto socorro com queixa de cefaleia de forte intensidade, vômitos, febre aferida (39ºC) e inapetência há cerca de 4 dias. Quais sinais semiológicos poderiam ajudar a chegar no diagnóstico sindrômico?", "opts": ["Sinal de Babinski, clônus e sinal do canivete.", "Sinal de Brudzinski, Kernig e Lasègue.", "Sinal da roda denteada, bradicinesia e instabilidade postural.", "Disdiadococinesia, dismetria na prova index nariz e reflexo pendular."], "correct": 1, "fixed": false, "note": null}, {"id": "p14-17", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 17, "ctx": null, "stem": "São provas que avaliam a coordenação motora:", "opts": ["Diadococinesia e Romberg", "Brudzinski e Kernig", "Lasègue e Lhermitte", "Barré e Mingazzini"], "correct": 0, "fixed": false, "note": null}, {"id": "p14-18", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 18, "ctx": null, "stem": "Marcha decorrente da fraqueza dos músculos dorsiflexores do pé, fazendo com que o paciente levante a perna além do habitual e arraste a ponta dos pés no chão:", "opts": ["Tabética", "Ebriosa", "Escarvante", "Ceifante"], "correct": 2, "fixed": false, "note": null}, {"id": "p14-19", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 19, "ctx": null, "stem": "São achados da síndrome do segundo neurônio motor:", "opts": ["Hiporreflexia, atrofia, hipotonia", "Hiperreflexia, hipertrofia e hipertonia", "Normorreflexia, atrofia e hipertonia", "Reflexo pendular, hipertrofia e hipotonia"], "correct": 0, "fixed": false, "note": null}, {"id": "p14-20", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 20, "ctx": null, "stem": "A avaliação do tônus muscular é de grande importância no exame neurológico. A hipertonia plástica, com o sinal clássico da \"roda denteada\", ou seja, resistência à movimentação passiva de forma contínua é vista em qual síndrome neurológica?", "opts": ["Extra piramidal", "Meningea", "Cerebelar", "Piramidal"], "correct": 0, "fixed": false, "note": null}, {"id": "p01-11", "topic": "Abdome", "prova": "T32 · 1ª VA", "sort": [32, 1], "n": 11, "ctx": null, "stem": "Paciente de 25 anos apresenta dor abdominal iniciada em região periumbilical, migrando para fossa ilíaca direita, associada a náuseas, vômitos e febre. Ao exame físico: dor localizada em fossa ilíaca direita, defesa muscular e sinal de descompressão brusca positivo. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo obstrutivo", "Abdome agudo perfurativo.", "Abdome agudo inflamatório.", "Abdome agudo isquêmico."], "correct": 2, "fixed": false, "note": null}, {"id": "p01-12", "topic": "Abdome", "prova": "T32 · 1ª VA", "sort": [32, 1], "n": 12, "ctx": null, "stem": "Paciente de 58 anos, com antecedente de cirurgia abdominal prévia, apresenta dor abdominal em cólica, distensão abdominal, vômitos fecais e parada de eliminação de fezes e flatos. Ao exame: abdome distendido, timpanismo difuso e ruídos hidroaéreos metálicos. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo inflamatório.", "Abdome agudo perfurativo.", "Abdome agudo obstrutivo.", "Abdome agudo hemorrágico."], "correct": 2, "fixed": false, "note": null}, {"id": "p01-13", "topic": "Abdome", "prova": "T32 · 1ª VA", "sort": [32, 1], "n": 13, "ctx": null, "stem": "Paciente de 72 anos, portador de fibrilação atrial crônica e hipertensão arterial, apresenta dor abdominal súbita, de forte intensidade (10/10), iniciada há cerca de 6 horas, difusa e contínua. Refere náuseas, sem vômitos e ausência de evacuação desde o início do quadro. Ao exame físico: paciente em estado geral regular, ansioso, PA 90x60 mmHg, FC 118 bpm, ritmo irregular, FR 24 irpm. O abdome encontra-se discretamente distendido, com dor difusa à palpação, porém sem defesa muscular ou sinais de irritação peritoneal. Ruídos hidroaéreos diminuídos. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo inflamatório", "Abdome agudo isquêmico.", "Abdome agudo obstrutivo.", "Abdome agudo perfurativo"], "correct": 1, "fixed": false, "note": null}, {"id": "p01-14", "topic": "Abdome", "prova": "T32 · 1ª VA", "sort": [32, 1], "n": 14, "ctx": null, "stem": "Mulher de 29 anos, previamente higida, com atraso menstrual de 6 semanas, apresenta dor abdominal súbita em hipogástrio, de forte intensidade, associada a rigidez, lipotimia e sensação de desmaio. Refere sangramento vaginal discreto. Ao exame físico: paciente pálida, sudorética, confusa, PA 70x40 mmHg, FC 130 bpm, FR 28 irpm. Abdome discretamente distendido, doloroso à palpação profunda em hipogástrio, sem sinais claros de rigidez peritoneal. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo inflamatório.", "Abdome agudo perfurativo.", "Abdome agudo hemorrágico.", "Abdome agudo obstrutivo"], "correct": 2, "fixed": false, "note": null}, {"id": "p01-15", "topic": "Abdome", "prova": "T32 · 1ª VA", "sort": [32, 1], "n": 15, "ctx": null, "stem": "Paciente de 50 anos, com histórico de uso crônico de anti-inflamatórios não esteroides, apresenta dor abdominal súbita, intensa, inicialmente em epígastro, evoluindo rapidamente para dor difusa. Refere náuseas e parada de eliminação de fezes e flatos. Ao exame físico: paciente em posição antálgica, sudorético, PA 90x60 mmHg, FC 118 bpm. Abdome em tábua, com dor difusa à palpação, descompressão brusca positiva e ausência de ruídos hidroaéreos. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo inflamatório.", "Abdome agudo isquêmico.", "Abdome agudo obstrutivo.", "Abdome agudo perfurativo"], "correct": 3, "fixed": false, "note": null}, {"id": "p02-1", "topic": "Abdome", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 1, "ctx": null, "stem": "Mulher de 46 anos, obesa, refere dor em hipocôndrio direito iniciada há 24 horas, contínua, irradiada para região escapular direita, associada a náuseas, vômitos e febre. Relata piora após ingestão de alimentos gordurosos. Ao exame físico: paciente febril, dor à palpação em hipocôndrio direito, defesa localizada e sinal de Murphy positivo. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo hemorrágico.", "Abdome agudo inflamatório.", "Abdome agudo obstrutivo.", "Abdome agudo perfurativo."], "correct": 1, "fixed": false, "note": null}, {"id": "p02-2", "topic": "Abdome", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 2, "ctx": null, "stem": "Paciente de 68 anos, com antecedente de doença diverticular dos cólons, apresenta dor abdominal súbita e intensa em fossa ilíaca esquerda, evoluindo rapidamente para dor difusa. Refere febre, náuseas e piora progressiva do estado geral. Ao exame físico: paciente taquicárdico, sudorético, com abdome rígido, em tábua, dor difusa à palpação e descompressão brusca positiva. Ruídos hidroaéreos abolidos. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo perfurativo.", "Abdome agudo hemorrágico.", "Abdome agudo inflamatório.", "Abdome agudo obstrutivo."], "correct": 0, "fixed": false, "note": null}, {"id": "p03-1", "topic": "Abdome", "prova": "T31 · 1ª VA", "sort": [31, 1], "n": 1, "ctx": null, "stem": "Homem de 28 anos, previamente hígido, procura o pronto atendimento relatando dor abdominal iniciada há 24 horas, inicialmente em região periumbilical, que evoluiu e localizou-se na fossa ilíaca direita, tornando-se contínua e mais intensa. Refere náuseas e um episódio de vômito, além de perda do apetite. Ao exame físico, apresenta-se em bom estado geral, discretamente febril (37,8°C), com pressão arterial de 120x80 mmHg, frequência cardíaca de 96 bpm e frequência respiratória de 20 irpm. O abdome está plano, com dor localizada em fossa ilíaca direita, presença de defesa muscular e sinal de Blumberg positivo. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo inflamatório", "Abdome agudo perfurativo", "Abdome agudo obstrutivo", "Abdome agudo isquêmico"], "correct": 0, "fixed": false, "note": null}, {"id": "p03-2", "topic": "Abdome", "prova": "T31 · 1ª VA", "sort": [31, 1], "n": 2, "ctx": null, "stem": "Homem de 56 anos, com antecedente de duas cirurgias abdominais prévias (apendicectomia e colecistectomia), procura atendimento com dor abdominal tipo cólica há 48 horas, acompanhada de distensão abdominal progressiva, náuseas e múltiplos episódios de vômitos com conteúdo alimentar, evoluindo para aspecto fecaloide. Refere ausência de evacuações e eliminação de flatos há dois dias. Ao exame, apresenta-se desidratado (3+/4+), taquicárdico (FC 112 bpm), PA 100x70 mmHg, afebril. O abdome encontra-se distendido, com timpanismo difuso à percussão e ruídos hidroaéreos aumentados, metálicos. Não há sinais de irritação peritoneal. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo obstrutivo", "Abdome agudo isquêmico", "Abdome agudo perfurativo", "Abdome agudo inflamatório"], "correct": 0, "fixed": false, "note": null}, {"id": "p03-3", "topic": "Abdome", "prova": "T31 · 1ª VA", "sort": [31, 1], "n": 3, "ctx": null, "stem": "Homem de 72 anos, portador de fibrilação atrial crônica, hipertensão arterial e tabagismo de longa data, procura o pronto atendimento com quadro de dor abdominal intensa, de início súbito, há cerca de 6 horas. Refere que a dor começou difusamente, sem localização específica, de forte intensidade (10/10), e não apresenta relação com alimentação. Relata náuseas, mas sem vômitos ou evacuação desde o início do quadro. Ao exame físico, o paciente encontra-se em mal estado geral, ansioso, pálido e sudorético. Pressão arterial 90x60 mmHg, frequência cardíaca 124 bpm (irregular), frequência respiratória 26 irpm, temperatura 37,2°C. O abdome é discretamente distendido, com dor difusa à palpação superficial e profunda, mas sem sinais de defesa ou irritação peritoneal evidentes. Os ruídos hidroaéreos estão diminuídos. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo isquêmico", "Abdome agudo perfurativo", "Abdome agudo inflamatório", "Abdome agudo obstrutivo"], "correct": 0, "fixed": false, "note": null}, {"id": "p03-4", "topic": "Abdome", "prova": "T31 · 1ª VA", "sort": [31, 1], "n": 4, "ctx": null, "stem": "Mulher de 27 anos, previamente saudável, procura o pronto atendimento por dor abdominal intensa e súbita, iniciada há cerca de 2 horas, localizada em hipogástrio e acompanhada de tontura e sensação de desmaio. Refere atraso menstrual de 6 semanas e nega uso de métodos contraceptivos. Ao exame, apresenta-se em mal estado geral, pálida, sudorética, confusa, com PA 70x40 mmHg, FC 132 bpm, FR 28 irpm e temperatura 36,8°C. O abdome encontra-se discretamente distendido, doloroso à palpação profunda em hipogástrio, sem sinais de irritação peritoneal. Toque vaginal revela fundo de saco posterior abaulado e doloroso. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo hemorrágico", "Abdome agudo perfurativo", "Abdome agudo inflamatório", "Abdome agudo obstrutivo"], "correct": 0, "fixed": false, "note": null}, {"id": "p03-5", "topic": "Abdome", "prova": "T31 · 1ª VA", "sort": [31, 1], "n": 5, "ctx": null, "stem": "Homem de 48 anos, com histórico de gastrite crônica e uso recorrente de anti- inflamatórios não esteroides para dores articulares, procura o pronto atendimento com dor abdominal súbita e intensa há cerca de 3 horas. Refere que a dor iniciou em epigástrio, irradiando-se rapidamente para todo o abdome, de caráter contínuo e lancinante. Relata náuseas, ausência de evacuação e impossibilidade de se alimentar. Ao exame físico, encontra-se em mal estado geral, sudorético e ansioso. PA 90x60 mmHg, FC 118 bpm, FR 28 irpm, temperatura 37,5°C. O abdome está tenso, com dor difusa à palpação superficial e profunda, timpanismo generalizado à percussão e sinais de irritação peritoneal evidentes, com descompressão brusca dolorosa positiva em todos os quadrantes. Os ruídos hidroaéreos estão ausentes. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo perfurativo", "Abdome agudo isquêmico", "Abdome agudo inflamatório", "Abdome agudo hemorrágico"], "correct": 0, "fixed": false, "note": null}, {"id": "p04-15", "topic": "Abdome", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 15, "ctx": null, "stem": "Homem de 45 anos, etilista, apresenta dor abdominal em epigástrio, após ingestão alcoólica. Abdome pouco distendido, dor em epigástrio, ruídos hidroaéreos diminuídos, e observa-se o sinal de Jobert positivo. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo obstrutivo", "Abdome agudo inflamatório", "Abdome agudo perfurativo", "Abdome agudo hemorrágico"], "correct": 2, "fixed": false, "note": null}, {"id": "p04-16", "topic": "Abdome", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 16, "ctx": null, "stem": "Mulher de 63 anos com hérnia inguinal encarcerada, distensão abdominal, vômitos biliosos e ausência de eliminação de flatos. Abdome distendido e timpanismo difuso. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo inflamatório", "Abdome agudo obstrutivo", "Abdome agudo isquêmico", "Abdome agudo perfurativo"], "correct": 1, "fixed": false, "note": null}, {"id": "p05-6", "topic": "Abdome", "prova": "T30 · 1ª VA", "sort": [30, 1], "n": 6, "ctx": null, "stem": "Paciente (19 anos), sexo feminino, chega ao pronto socorro relatando que após discutir com o seu namorado apresentou desmaio. Foi trazida pela equipe do SAMU que, ao passar o paciente para a equipe médica da Santa Casa, descreve que a vítima foi encontrada inconsciente, com sinais de hipotensão (PA=70/40mmHg), taquicardia, pulso fino e filiforme, sinal de Proust positivo.", "opts": ["Abdome agudo perfurativo/úlcera perfurada.", "Abdome agudo obstrutivo/bridas.", "Abdome agudo hemorrágico/colecistite aguda.", "Abdome agudo hemorrágico/gravidez tubária rota."], "correct": 3, "fixed": false, "note": null}, {"id": "p05-7", "topic": "Abdome", "prova": "T30 · 1ª VA", "sort": [30, 1], "n": 7, "ctx": null, "stem": "Paciente de 10 anos, sexo masculino, leucoderma, procurou atendimento acompanhado de sua mãe apresentando como queixas principais: \"dor na barriga e vômitos\". Ao ser admitido no hospital universitário, apresentava quadro de dor que havia iniciado há três dias na região peri-umbilical, e no momento irradiava em direção à fossa ilíaca direita. Essa dor apresentava-se de forma contínua com característica de cólicas, com alívio em posição de cócoras e piora com movimentação e tosse.", "opts": ["Abdome agudo perfurativo/sinal de Oubler.", "Abdome agudo obstrutivo/sinal de Kussmaul.", "Abdome agudo inflamatório/sinal de Dumply.", "Abdome agudo inflamatório/sinal de Venanetér."], "correct": 2, "fixed": false, "note": null}, {"id": "p05-8", "topic": "Abdome", "prova": "T30 · 1ª VA", "sort": [30, 1], "n": 8, "ctx": null, "stem": "Paciente do sexo masculino, 47 anos, tabagista (3 maços/dia), refere que há 12h iniciou com quadro de dor na barriga, localizada na boca do estômago, e posteriormente caminhou para todo o abdome, tornando-se contínua, sem fatores atenuantes, e que piora com a alimentação e a deambulação, acompanhada de vômitos amarelados, sudorese e mal-estar geral. Abdome com sinais de irritação peritoneal difusa com timpanismo difuso. HP: Artrose em coluna e faz uso rotineiro de medicações anti-inflamatórias, relata ainda gastrite. Os aparelhos cardiovasculares e respiratórios já foram examinados e estão normais.", "opts": ["Abdome agudo perfurativo/sinal de Obert/pancreatite aguda.", "Abdome agudo perfurativo/sinal de Obert/úlcera perfurada.", "Abdome agudo inflamatório/sinal de Dumply/colecistite aguda.", "Abdome agudo inflamatório/sinal de Venanetér/apendicite aguda."], "correct": 1, "fixed": false, "note": null}, {"id": "p05-9", "topic": "Abdome", "prova": "T30 · 1ª VA", "sort": [30, 1], "n": 9, "ctx": null, "stem": "Ao exame físico abdominal, auscultaram-se ruídos metálicos. Este sinal relaciona-se geralmente à:", "opts": ["Aumento da peristalse intestinal por uma diarreia.", "Diminuição da peristalse por apendicite.", "Sinais de rdia, taquipneia, hipotensão arterial e confusão mental. Palidez cutânea mucosa e abdome doloroso à palpação profunda, sinal de Jobert negativo, ausência de ruídos hidroaéreos auscultáveis. Qual a hipótese diagnóstica mais provável?", "opts": ["Abdome agudo perfurativo", "Abdome agudo obstrutivo", "Abdome agudo isquêmico", "Abdome agudo hemorrágico"], "correct": 3, "fixed": false, "note": null}, {"id": "p01-3", "topic": "Demência", "prova": "T32 · 1ª VA", "sort": [32, 1], "n": 3, "ctx": null, "stem": "Você é o médico da ESF em cidade do interior e foi chamado para realizar uma consulta domiciliar de um idoso de 78 anos de idade, com história de queda da própria altura há 3 dias. Ao chegar à casa do paciente, a filha informa que ele vem apresentando quedas frequentes, devido à tontura tipo desequilíbrio, tendo percebido que o mesmo estava \"mais lento do que o normal\" e com dificuldade para caminhar há aproximadamente 8 meses após o início de uma síndrome demencial. Refere também que o pai está muito agitado durante o sono, com gritos e pesadelos, apresentando sombras diurnas, além de estar mais desatento, apático, deprimido e com alucinações visuais, as quais não melhoraram após introdução da quetiapina há 3 meses. Qual o diagnóstico mais provável?", "opts": ["Demência por corpos de Lewy.", "Demência de Alzheimer.", "Demência vascular.", "Demência na doença de Parkinson."], "correct": 0, "fixed": false, "note": null}, {"id": "p03-13", "topic": "Demência", "prova": "T31 · 1ª VA", "sort": [31, 1], "n": 13, "ctx": null, "stem": "Paciente de 60 anos apresenta déficit da memória e alteração da atenção e concentração, comprovados por testes cognitivos de rastreio. A característica que está presente no transtorno cognitivo leve e que diferencia essa condição de um quadro de demência é a:", "opts": ["ausência de resposta ao uso de anticolinesterásicos.", "presença de incapacidade na escala de avaliação das atividades básicas de vida diária.", "presença de atrofia do hipocampo na ressonância magnética.", "manutenção da capacidade de o indivíduo desempenhar suas atividades instrumentais de vida diária."], "correct": 3, "fixed": false, "note": null}, {"id": "p03-14", "topic": "Demência", "prova": "T31 · 1ª VA", "sort": [31, 1], "n": 14, "ctx": null, "stem": "Paciente de 88 anos, portador de insuficiência cardíaca, apresentou quadro de alteração da memória, orientação, afasia de Broca e alteração da função executiva associada à hemiplegia à direita, após quadro de acidente vascular cerebral isquêmico (AVCi) há um ano, mas recuperando parte da sua funcionalidade após reabilitação motora. Apresentou novo quadro de AVCi há 2 meses, evoluindo com dependência para atividades básicas e instrumentais de vida diária e piora cognitiva significativa em múltiplas funções.", "opts": ["Demência com Corpos de Lewy", "Demência Vascular", "Demência de Alzheimer", "Demência Fronto-Temporal"], "correct": 1, "fixed": false, "note": null}, {"id": "p05-11", "topic": "Demência", "prova": "T30 · 1ª VA", "sort": [30, 1], "n": 11, "ctx": null, "stem": "Enfermeira aposentada, de 81 anos, queixa-se de deficiência de memória, dificuldades para fazer compras e manusear dinheiro. Obteve as seguintes pontuações nas escalas de avaliação funcional e cognitiva: Questionário de Lawton para Atividades Instrumentais da Vida Diária (AIVD): 9 pontos, Índice de Katz para as Atividades Básicas da Vida Diária (ABVD): 6 pontos (independente). Mini-exame do Estado Mental (MEEM): 16 pontos.", "opts": ["Síndrome demencial.", "Doença de Alzheimer.", "Comprometimento cognitivo leve.", "Envelhecimento cerebral normal."], "correct": 0, "fixed": false, "note": null}, {"id": "p05-12", "topic": "Demência", "prova": "T30 · 1ª VA", "sort": [30, 1], "n": 12, "ctx": null, "stem": "Paciente do sexo masculino, de 69 anos, oito anos de escolaridade, foi levado à consulta pela filha, que relatou ser o pai uma pessoa tímida e reservada, porém há oito meses estava evoluindo com muita apatia, alternando períodos de agressividade, alterações do juízo crítico como falar alto, dizer inconveniências, andar nu pela casa e comer em demasia. Obteve 24 pontos no MEEM. Nega doenças prévias e uso regular de medicamentos. Exame físico sem achados anormais. Foram solicitados exames bioquímicos e ressonância magnética do crânio, sendo que os primeiros vieram sem alterações e no segundo foi encontrado atrofia frontal bilateral significativa.", "opts": ["Demência vascular.", "Doença de Alzheimer.", "Demência por corpos de Lewy.", "Demência frontotemporal."], "correct": 3, "fixed": false, "note": null}, {"id": "p07-18", "topic": "Demência", "prova": "T25 · 1ª VA", "sort": [25, 1], "n": 18, "ctx": "Cornélia, 83 anos, sexo feminino, escolaridade de 8 anos, viúva, cozinheira aposentada, residente de uma instituição de longa permanência há 1 ano. Neste período na instituição, observou-se que a residente apresentava esquecimentos para fatos recentes e cotidianos, discurso repetitivo e desorientação no tempo e alguns episódios de desorientação espacial. Fazia confusão com as medicações, não conseguia mais preparar refeições e apresentava negligência com o autocuidado (descuido com higiene). A equipe de enfermagem noturna sempre reclamava da mesma apresentar perambulação noturna e atrapalhar o sono de outros residentes por apresentar alucinações visuais de antepassados. Não apresenta alteração ao exame físico.", "stem": "Podemos afirmar que:", "opts": ["Cornélia apresenta limitação para atividades instrumentais de vida diária.", "A escala para avaliar funcionalidade relacionada ao autocuidado é a escala de Lawton.", "A perambulação noturna e alucinações visuais são sintomas de delirium.", "A escala de depressão geriátrica (GDS) é fundamental para a conclusão diagnóstica."], "correct": 0, "fixed": false, "note": null}, {"id": "p07-19", "topic": "Demência", "prova": "T25 · 1ª VA", "sort": [25, 1], "n": 19, "ctx": "Cornélia, 83 anos, sexo feminino, escolaridade de 8 anos, viúva, cozinheira aposentada, residente de uma instituição de longa permanência há 1 ano. Neste período na instituição, observou-se que a residente apresentava esquecimentos para fatos recentes e cotidianos, discurso repetitivo e desorientação no tempo e alguns episódios de desorientação espacial. Fazia confusão com as medicações, não conseguia mais preparar refeições e apresentava negligência com o autocuidado (descuido com higiene). A equipe de enfermagem noturna sempre reclamava da mesma apresentar perambulação noturna e atrapalhar o sono de outros residentes por apresentar alucinações visuais de antepassados. Não apresenta alteração ao exame físico.", "stem": "Alguns testes foram aplicados a Cornélia: MEEM: 8/30; Fluência verbal 5 animais; Teste o desenho do relógio: 1/5. Alguns exames laboratoriais (hemograma, glicemia, b12, eletrólitos, vdrl, função renal, função hepática e função tireoidiana) e RNM crânio realizados foram normais. Diante do quadro clínico, dos resultados dos testes e dos exames realizados, podemos levantar como principal hipótese diagnóstica para Cornélia:", "opts": ["Demência de Alzheimer.", "Demência por corpos de Lewy.", "Demência vascular.", "Demência fronto-temporal."], "correct": 0, "fixed": false, "note": null}, {"id": "p08-3", "topic": "Demência", "prova": "T26 · 1ª VA", "sort": [26, 1], "n": 3, "ctx": "Genésio, engenheiro por profissão, aposentou-se aos 65 anos de idade. À época, já apresentava algumas atitudes que fugiam de seu comportamento habitual: jocosidades inapropriadas, hipersexualismo, agressividade frequente, gasto excessivo de dinheiro e alteração da linguagem com perseverações de frases e ideias. Nos últimos dois anos, evoluiu com progressiva dificuldade para falar, com redução da produção verbal e dificuldade para realização de tarefas diárias, tais como: esquecimento de torneiras abertas e chama de fogão acesa, perda da habilidade de lidar com as próprias finanças e dificuldade para fazer compras adequadas. Foi ao geriatra, que fez uma série de testes e pediu alguns exames. No miniexame do Estado Mental (MEEM). ele obteve 13 de 30 pontos. Os exames laboratoriais foram normais e a imagem cerebral demonstrou atrofia dos lobos frontais e das porções anteriores dos lobos temporais. Foram iniciados tratamentos medicamentoso e não medicamentoso. Passados alguns meses. o paciente apresentou um quadro de confusão mental, inversão do ciclo sono-vigília, agressividade, incontinência urinária, não reconhecimento de familiares e alucinações visuais. Foi levado ao pronto-socorro. Administraram diazepan endovenoso e realizaram uma série de exames. Ele recebeu alta para casa com receita de diazepan e um antibiótico.", "stem": "Considerando esse caso clínico e os conhecimentos médicos correlatos, marque a assertiva verdadeira:", "opts": ["O diagnóstico clínico mais provável para a síndrome demencial do paciente é demência por corpos de Lewy.", "A melhor droga para retardar a progressão do quadro demencial do paciente é um (anticolinesterásico).", "No início do quadro, o geriatra realizou alguns testes. A avaliação da capacidade de cuidar das finanças faz parte da escala de Katz.", "Na avaliação do MEEM é possível inferir que o paciente apresenta declínio cognitivo."], "correct": 3, "fixed": false, "note": null}, {"id": "p09-16", "topic": "Demência", "prova": "T27 · 1ª VA", "sort": [27, 1], "n": 16, "ctx": "C.B.O., sexo masculino, 83 anos, foi levado ao neurologista pela filha devido a quadro de esquecimento progressivo com prejuízo para cuidar das finanças e fazendo confusão com medicação. Refere que ele evoluiu com hemiparesia a direita após AVC isquêmico há 3 meses. Além disso, ele vem apresentando agitação psicomotora, insônia e alucinação. O neurologista fez avaliação cognitiva, funcional comportamental do paciente por meio de escala e solicitou alguns exames para avaliação na hipótese de síndrome demencial. O paciente retornou com os exames solicitados, sendo feito o diagnóstico apropriado. Ao longo do acompanhamento, o paciente passou a fazer uso das seguintes medicações: Donepezila 10mg/noite, Citalopran 20 mg/ dia, Risperidona 2mg/ noite e Memantina 10mg 2x ao dia.", "stem": "Sobre as escalas para avaliação cognitiva, funcional e comportamental, podemos afirmar:", "opts": ["As dependências funcionais relacionadas a prejuízo para cuidar das finanças e confusão com medicação podem ser avaliadas pela escala de Lawton.", "O Mini exame do estado mental faz diagnóstico de síndrome demencial.", "Os distúrbios de comportamento são melhor avaliados pelo método de avaliação confusional (CAM).", "A escala de Katz relaciona-se às atividades instrumentais de vida diária."], "correct": 0, "fixed": false, "note": null}, {"id": "p09-17", "topic": "Demência", "prova": "T27 · 1ª VA", "sort": [27, 1], "n": 17, "ctx": "C.B.O., sexo masculino, 83 anos, foi levado ao neurologista pela filha devido a quadro de esquecimento progressivo com prejuízo para cuidar das finanças e fazendo confusão com medicação. Refere que ele evoluiu com hemiparesia a direita após AVC isquêmico há 3 meses. Além disso, ele vem apresentando agitação psicomotora, insônia e alucinação. O neurologista fez avaliação cognitiva, funcional comportamental do paciente por meio de escala e solicitou alguns exames para avaliação na hipótese de síndrome demencial. O paciente retornou com os exames solicitados, sendo feito o diagnóstico apropriado. Ao longo do acompanhamento, o paciente passou a fazer uso das seguintes medicações: Donepezila 10mg/noite, Citalopran 20 mg/ dia, Risperidona 2mg/ noite e Memantina 10mg 2x ao dia.", "stem": "Sobre os exames solicitados como rastreio diagnóstico de síndrome demencial, podemos afirmar que são fundamentais:", "opts": ["Dosagen de beta amilóide no liquor, TC de crânio.", "Dosagem de VDRL, RNM crânio.", "Dosagem de vitamina B1, eletroencefalograma.", "Dosagem de anti HIV, spect cerebral."], "correct": 1, "fixed": false, "note": null}, {"id": "p09-18", "topic": "Demência", "prova": uada. O que deixou a filha mais preocupada foi que a mãe, quando, ao tentar fazer café, ficou com o pó de café em uma mão, a panela na outra e não sabia o que fazer. Quando perguntada, diz que os sintomas começaram mais sutis, e que vêm evoluindo nos últimos seis meses. A paciente não apresenta antecedentes patológicos relevantes, não utiliza medicação de uso contínuo e não apresenta alterações no exame físico.", "stem": "Pensando no tratamento farmacológico de Dona Maria, a melhor opção medicamentosa para retardar a progressão de sua doença é:", "opts": ["Donepezila", "Gingko biloba", "Melatonina", "Nenhuma das opções"], "correct": 3, "fixed": true, "note": null}, {"id": "p14-3", "topic": "Demência", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 3, "ctx": null, "stem": "Celeno, sexo masculino, 83 anos, tem diagnóstico de Demência de Alzheimer há 5 anos, já cursando com incontinência urinária há 1 ano e uso contínuo de fraldas geriátricas. Há um mês foi levado ao médico devido a piora da agitação psicomotora, insônia e alucinação. Retorna com o cuidador a consulta médica. O cuidador relata que o comportamento do paciente melhorou, entretanto houve piora em algumas situações: lentidão de marcha, duas quedas no período, disfagia para líquidos, tremor de repouso em membros superiores assimetricamente e obstipação. As medicações em uso são: Donepezila 10mg/noite, Citalopram 20 mg/dia, Risperidona 2mg/ noite e Memantina 10mg 2x ao dia. Considerando que no envelhecimento, mudanças na quantidade e ativação de receptores podem ocorrer, justificando maior risco de iatrogenia com psicofármacos. Qual droga deve ter sua indicação reavaliada devido aos efeitos colaterais apresentados pelo paciente?", "opts": ["Donepezila.", "Citalopram.", "Risperidona.", "Memantina."], "correct": 2, "fixed": false, "note": null}, {"id": "p05-14", "topic": "Depressão", "prova": "T30 · 1ª VA", "sort": [30, 1], "n": 14, "ctx": null, "stem": "Os transtornos depressivos apresentam significativa prevalência entre indivíduos idosos da comunidade. Quando os estudos de prevalência se referem a idosos hospitalizados ou institucionalizados, os resultados são ainda maiores, alcançando, aproximadamente, 22%. Nos estudos que avaliam sintomas depressivos clinicamente significantes, sem levar em consideração os critérios diagnósticos para depressão maior, mas utilizando escalas de sintomas, a variação na prevalência na comunidade aumenta para 6,4 a 59,3%. Assertivas: I. Todos os sintomas presentes na depressão em adultos jovens são encontrados em idosos. De modo geral, a depressão em idosos apresenta menos humor depressivo e mais anedonia, mais sintomas somáticos do que \"psicológicos\", maior frequência de associação com doença física e/ou cerebral e presença maior de déficit cognitivo e disfunção executiva. II. A depressão geriátrica apresenta maior correlação familiar, menor prevalência de demência e menor prejuízo no desempenho dos testes neuropsicológicos. III. A síndrome depressiva com demência reversível (antiga pseudodemência) é uma depressão associada ao déficit cognitivo que melhora com o tratamento da depressão. Pode evoluir para demência em 3 anos, podendo a depressão ser apenas uma manifestação precoce da demência.", "opts": ["Apenas I e II.", "Apenas II e III.", "Apenas I e III.", "I, II e III."], "correct": 2, "fixed": true, "note": null}, {"id": "p10-2", "topic": "Depressão", "prova": "T28 · 1ª VA", "sort": [28, 1], "n": 2, "ctx": null, "stem": "Assinale a alternativa que apresenta características do transtorno depressivo em idosos.", "opts": ["Há apresentação clínica com maior frequência de sintomas atípicos, estando altamente relacionado às alterações neurovegetativas.", "O tratamento da depressão no idoso visa melhorar a qualidade de vida e não necessariamente a remissão completa de sintomas como no adulto.", "Medicamentos devem ser utilizados da mesma forma que no adulto jovem, uma vez que a tendência a eventos adversos é a mesma.", "A amitriptilina é a opção medicamentosa de primeira escolha nessa população com boa resposta em melhorar sono, apetite e redução de dor."], "correct": 0, "fixed": false, "note": null}, {"id": "p12-21", "topic": "Depressão", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 21, "ctx": "Idoso, sexo masculino, contador aposentado, 72 anos, vem à consulta com relato de viuvez há 8 meses. Refere que mesmo antes da esposa falecer já apresentava desinteresse por atividades de que antes gostava como leitura e jogo de tênis. Inclusive, deixou de realizá-las completamente nos últimos dois meses, quando os sintomas agravaram: falta de energia, exaustão ao iniciar as atividades não conseguindo completar, redução do apetite com perda ponderal de 5kg, insônia, Mais lento ao deambular, prejuízo da memória e dificuldade de concentração. Refere ser coronariopata em uso irregular de medicação. Ao exame: Ele encontra-se emagrecido (IMC 18), consciente, corado, hidratado. AR: MV sem RA. ACV: RCR 2T sem sopro. PA: 120X80 mmHg, abdome sem alterações, membros sem edema e presença de artrose em joelhos. Circunferência da panturrilha: 28 cm Velocidade de marcha 6m 0,7m/s, força de pressão manual 25kg (reduzida), Escalas geriátricas: GDS 12/30, MEEM 30, TDR 5, Katz 6, Lawton 27.", "stem": "Sobre as afirmativas abaixo, marque a assertiva CORRETA:", "opts": ["Para evitar iatrogenia medicamentosa, seria uma boa conduta médica: fazer o inventário medicamentoso, não utilizar medicações inapropriadas para idosos, fazer os ajustes de doses necessários e explicar adequadamente a prescrição.", "A fluoxetina seria uma boa opção terapêutica para o paciente, pois é uma medicação segura para idosos.", "Ao prescrever o tratamento para insônia deste paciente, o diazepam seria uma boa escolha, pois no envelhecimento há redução de gordura corporal total e redução do tempo de meia vida desta droga.", "O tratamento adequado para a coronariopatia e o tratamento adequado do transtorno depressivo apresentado pelo paciente não são alvos do plano terapêutico deste paciente, e sim apenas a suplementação nutricional e atividade física."], "correct": 0, "fixed": false, "note": null}, {"id": "p01-4", "topic": "Delirium", "prova": "T32 · 1ª VA", "sort": [32, 1], "n": 4, "ctx": null, "stem": "Um médico de família realiza uma visita domiciliar a um homem de 64 anos que está acamado e em tratamento para mal de Parkinson e hipertensão arterial. Durante a consulta, a filha do paciente relata que seu pai apresenta alterações de comportamento há 4 dias, estando mais prostrado e lentificado, com episódios de agitação noturna, com alucinações visuais e discurso incoerente. Ao exame físico, notam-se estertores crepitantes em terço médio à direita, sem alteração percebida na ausculta cardíaca. Paciente sarcopênico, bradicinético, com roda denteada em membros e tremor de repouso assimétrico em membros superiores. Apresenta pressão arterial de 90 x 50 mmHg, frequência cardíaca de 116 batimentos por minuto, frequência respiratória de 33 incursões respiratórias por minuto, disposição de oxigênio de 90% em ar ambiente e temperatura de 36,1 °C. Podemos afirmar que o paciente apresenta:", "opts": ["Demência rapidamente progressiva.", "Demência por corpos de Lewy.", "Demência na doença de Parkinson.", "Delirium"], "correct": 3, "fixed": false, "note": null}, {"id": "p03-15", "topic": "Delirium", "prova": "T31 · 1ª VA", "sort": [31, 1], "n": 15, "ctx": null, "stem": "Mulher de 88 anos de idade, sem morbidades prévias, há uma semana apresenta-se confusa, agitada durante à noite e, às vezes, sonolenta de dia, razão pela qual chega a ficar bastante tempo sem se alimentar. Acha que está na praia e pede para voltar para casa. Ao exame clínico, encontra-se desatenta, desorientada temporoespacialmente, corada, desidratada 1+/4, eupneica, afebril, frequência cardíaca de 88 bpm, pressão arterial de 110x70 mmHg. Ausculta cardíaca e pulmonar normais, abdome com dor à palpação em hipogástrio e Giordano positivo.", "opts": ["Delirium", "Síndrome demencial", "Depressão psicótica", "Acidente vascular cerebral"], "correct": 0, "fixed": false, "note": null}, {"id": "p05-13", "topic": "Delirium", "prova": "T30 · 1ª VA", "sort": [30, 1], "n": 13, "ctx": null, "stem": "Paciente do sexo masculino, de 85 anos, com função cognitiva prévia normal, foi atendido no pronto-socorro com história de que há 48 horas apresentava inversão do padrão do sono, alterações da função mental com períodos de agitação psicomotora alternando-se com letargia. Ao exame, apresentava-se agitado, desorientado no tempo e no espaço, falando coisas desconexas e sem conseguir focar a atenção para que o médico realizasse a anamnese.", "opts": ["Inversão do padrão do sono e fala desconexa.", "Alteração da atenção e início agudo com curso flutuante.", "Flutuações no nível de consciência e agitação psicomotora.", "Agitação psicomotora e inversão do padrão do sono."], "correct": 1, "fixed": false, "note": null}, {"id": "p08-1", "topic": "Delirium", "prova": "T26 · 1ª VA", "sort": [26, 1], "n": 1, "ctx": "Umbelino, sexo masculino, 91 anos, é portador e DPOC por tabagismo e faz uso de broncodilatador inalatório há 2 anos (formoterol). Há 5 dias vem apresentando quadro de aumento da expectoração, da tosse e da dispnéia. Há 1 dia iniciou quadro de alterações do sono com inversão do ciclo sono vigília, fala desconexa, desatento e agressivo. Foi levado à emergência pelos familiares. Na admissão, foi detectado o seguinte exame físico: apresenta-se afebril, consciente, desorientado, com sibilos expiratórios e roncos difusos; a frequência cardíaca é de 102 bpm; a frequência respiratória é de 36 irpm e a pressão arterial é de 130/80 mmHg.", "stem": "Qual é a melhor hipótese para o quadro clínico de Umbelino?", "opts": ["Depressão.", "Acidente vascular encefálico.", "Síndrome demencial.", "Delirium."], "correct": 3, "fixed": false, "note": null}, {"id": "p08-2", "topic": "Delirium", "prova": "T26 · 1ª VA", "sort": [26, 1], "n": 2, "ctx": "Umbelino, sexo masculino, 91 anos, é portador e DPOC por tabagismo e faz uso de broncodilatador inalatório há 2 anos (formoterol). Há 5 dias vem apresentando quadro de aumento da expectoração, da tosse e da dispnéia. Há 1 dia iniciou quadro de alterações do sono com inversão do ciclo sono vigília, fala desconexa, desatento e agressivo. Foi levado à emergência pelos familiares. Na admissão, foi detectado o seguinte exame físico: apresenta-se afebril, consciente, desorientado, com sibilos expiratórios e roncos difusos; a frequência cardíaca é de 102 bpm; a frequência respiratória é de 36 irpm e a pressão arterial é de 130/80 mmHg.", "stem": "Considerando o quadro de acima, podemos afirmar que se trata de fator precipitante:", "opts": ["Sexo masculino.", "DPOC descompensado.", "Idade", "Formoterol."], "correct": 1, "fixed": false, "note": null}, {"id": "p10-3", "topic": "Delirium", "prova": "T28 · 1ª VA", "sort": [28, 1], "n": 3, "ctx": null, "stem": "Você recebe uma ligação dos familiares de seu paciente de 76 anos, que tem diagnóstico estabelecido de Demência na Doença de Alzheimer em fase moderada e já está em uso de Donepezila 10 mg/dia e Memantina 20mg/dia. Nesta ligação, eles relatam que o paciente estava estável até 3 dias atrás, quando, subitamente, começou a ficar muito agitado, agressivo, sem dormir a \"noite toda\" e aparentemente com alucinações visuais. Sua principal hipótese diagnóstica deve ser:", "opts": ["Evolução da demência para fase avançada.", "Acidente vascular encefálico.", "Delirium.", "Depressão psicótica."], "correct": 2, "fixed": false, "note": null}, {"id": "p12-18", "topic": "Delirium", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 18, "ctx": "Após dois anos da consulta diagnóstica de Demência de Alzheimer, uma paciente, sexo feminino, 85 anos, caiu e fraturou o quadril, não conseguindo deambular novamente. Desde então, ela necessita de uso contínuo de fraldas por dupla incontinência e apresenta anquilose progressiva de joelhos e punhos. Atualmente a
