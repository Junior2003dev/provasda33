ó físico.<\/li><li>É uma triagem rápida e <b>não substitui<\/b> a avaliação geriátrica ampla (AGA).<\/li><li>Diferente do modelo fenotípico de Fried (robusto, pré-frágil, frágil), que usa categorias.<\/li><\/ul>"}]}, {"topic": "Epidemiologia do envelhecimento", "intro": "Só 1 questão. Provas anteriores sugerem atenção aos conceitos de transição demográfica e epidemiológica.", "subs": [{"t": "Transição demográfica e epidemiológica no Brasil", "h": "<ul><li><b>Transição demográfica:<\/b> queda da mortalidade e, principalmente, da fecundidade (iniciada por volta da década de 1960 no Brasil), com aumento da proporção de idosos. A queda da fecundidade é o evento principal para o envelhecimento da população.<\/li><li>No Brasil foi <b>rápida<\/b>, ao contrário da Europa (processo lento, séculos de adaptação). Isso limitou a adaptação dos sistemas de saúde e previdência.<\/li><li><b>Feminização do envelhecimento:<\/b> as mulheres vivem mais por causa da sobremortalidade masculina na vida adulta (violência, acidentes, doenças cardiovasculares), então predominam entre os idosos mais velhos.<\/li><li><b>Transição epidemiológica:<\/b> no Brasil não houve substituição total e imediata das doenças infecciosas pelas crônicas; há sobreposição (tripla carga: infecciosas, crônicas e causas externas).<\/li><li>Idoso no Brasil: pessoa com 60 anos ou mais.<\/li><\/ul>"}]}]}</script>
<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var Q = P.data, TOPICS = P.topics, PROVAS = P.provas, GUIDE = P.guide;
  var L = 'ABCDEFG';
  var root = document.documentElement, btn = document.getElementById('themeBtn');

  /* ---------- tema ---------- */
  function sysDark(){ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
  function currentTheme(){ return root.getAttribute('data-theme') || (sysDark() ? 'dark' : 'light'); }
  function paintBtn(){ btn.textContent = currentTheme()==='dark' ? '☀️' : '🌙'; }
  try { var saved = localStorage.getItem('qb-theme'); if(saved==='dark'||saved==='light') root.setAttribute('data-theme', saved); } catch(e){}
  btn.addEventListener('click', function(){
    var t = currentTheme()==='dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', t);
    try { localStorage.setItem('qb-theme', t); } catch(e){}
    paintBtn();
  });
  paintBtn();

  /* ---------- dados ---------- */
  function byTopic(t){ return Q.filter(function(q){return q.topic===t}).sort(function(a,b){
    return a.sort[0]-b.sort[0] || a.sort[1]-b.sort[1] || a.n-b.n; }); }
  function byProva(p){ return Q.filter(function(q){return q.prova===p}).sort(function(a,b){ return a.n-b.n; }); }
  var mode = 'topic', group = TOPICS[0];
  var state = {}; // chave "modo|grupo" -> {order:{id:[idx]}, ans:{id:idx}}

  function shuffle(arr){ for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }
  function newOrder(q){
    var idx = q.opts.map(function(_,i){return i});
    return q.fixed ? idx : shuffle(idx);
  }
  function key(){ return mode+'|'+group; }
  function groupQs(){ return mode==='topic' ? byTopic(group) : byProva(group); }
  function ensureState(){
    var k = key();
    if(!state[k]){
      var s = {order:{}, ans:{}};
      groupQs().forEach(function(q){ s.order[q.id] = newOrder(q); });
      state[k] = s;
    }
    return state[k];
  }
  function resetGroup(){
    var s = {order:{}, ans:{}};
    groupQs().forEach(function(q){ s.order[q.id] = newOrder(q); });
    state[key()] = s;
  }

  /* ---------- UI ---------- */
  function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  function groups(){ return mode==='exam' ? PROVAS : TOPICS; }
  function countOf(g){ return mode==='exam' ? byProva(g).length : byTopic(g).length; }

  function renderTabs(){
    var box = document.getElementById('tabs'); box.innerHTML='';
    groups().forEach(function(g){
      var b = el('button',null,g); b.type='button'; b.setAttribute('role','tab');
      b.setAttribute('aria-selected', g===group ? 'true':'false');
      var c = el('span','cnt',String(countOf(g))); b.appendChild(c);
      b.addEventListener('click', function(){ group=g; render(); window.scrollTo({top:0}); });
      box.appendChild(b);
    });
  }

  function renderStats(qs, s){
    var done=0, hit=0;
    qs.forEach(function(q){ if(s.ans[q.id]!==undefined){ done++; if(s.ans[q.id]===q.correct) hit++; } });
    document.getElementById('stats').innerHTML = 'Respondidas <b>'+done+'/'+qs.length+'</b> · Acertos <b>'+hit+'</b>' + (done? ' ('+Math.round(100*hit/done)+'%)':'');
    document.getElementById('progFill').style.width = (qs.length? 100*done/qs.length : 0)+'%';
    document.getElementById('redo').textContent = mode==='topic' ? '↻ Refazer tópico' : '↻ Refazer prova';
    return {done:done, hit:hit};
  }

  function renderResult(qs, st){
    var old = document.getElementById('result'); if(old) old.remove();
    if(!qs.length || st.done<qs.length) return;
    var r = el('div','result'); r.id='result';
    r.appendChild(el('div','big', st.hit+' / '+qs.length));
    r.appendChild(el('div',null,'acertos ('+Math.round(100*st.hit/qs.length)+'%) — use "Refazer" para sortear uma nova ordem das alternativas.'));
    document.getElementById('list').appendChild(r);
  }

  function buildCard(q, i, s){
    var card = el('article','card'); card.id='q-'+q.id;
    var head = el('div','qhead');
    var num = mode==='topic' ? (i+1) : q.n;
    head.appendChild(el('span','qnum','Questão '+num));
    if(mode==='topic'){
      head.appendChild(el('span','chip', q.prova));
      head.appendChild(el('span','chip alt','orig. Q'+q.n));
    } else {
      head.appendChild(el('span','chip', q.topic));
    }
    card.appendChild(head);
    if(q.ctx){ var c=el('div','ctx'); c.appendChild(el('b',null,'Caso clínico')); c.appendChild(document.createTextNode(q.ctx)); card.appendChild(c); }
    card.appendChild(el('p','stem',q.stem));
    var opts = el('div','opts'); card.appendChild(opts);
    var order = s.order[q.id];
    var fb = el('div'); card.appendChild(fb);

    function paint(){
      var chosen = s.ans[q.id];
      opts.innerHTML=''; fb.innerHTML='';
      order.forEach(function(orig, pos){
        var o = el('button','opt'); o.type='button';
        o.appendChild(el('span','l',L[pos]+')'));
        o.appendChild(el('span','t',q.opts[orig]));
        if(chosen!==undefined){
          o.disabled = true;
          if(orig===q.correct) o.classList.add('ok');
          else if(orig===chosen) o.classList.add('bad');
          else o.classList.add('dim');
        } else {
          o.addEventListener('click', function(){
            s.ans[q.id]=orig; paint(); var st=renderStats(groupQs(), s); renderResult(groupQs(), st);
          });
        }
        opts.appendChild(o);
      });
      if(chosen!==undefined){
        var right = chosen===q.correct;
        var f = el('div','fb '+(right?'ok':'bad'));
        if(right){ f.textContent='✔ Correto!'; }
        else { f.textContent='✘ Incorreto — a correta é '+L[order.indexOf(q.correct)]+') '+q.opts[q.correct]; }
        fb.appendChild(f);
        if(q.comment){ var g=el('div','gc'); g.appendChild(el('b',null,'Gabarito comentado')); g.appendChild(document.createTextNode(q.comment)); fb.appendChild(g); }
        if(q.note){ var n=el('div','note'); n.appendChild(el('b',null,'⚠️ Atenção')); n.appendChild(document.createTextNode(q.note)); fb.appendChild(n); }
      }
    }
    paint();
    return card;
  }

  function renderList(){
    var list = document.getElementById('list'); list.innerHTML='';
    var qs = groupQs(), s = ensureState();
    if(!qs.length){ list.appendChild(el('div','empty','Sem questões neste grupo.')); renderStats(qs,s); return; }
    qs.forEach(function(q,i){ list.appendChild(buildCard(q,i,s)); });
    renderResult(qs, renderStats(qs,s));
  }

  function renderGuide(){
    var list = document.getElementById('list'); list.innerHTML='';
    var g = GUIDE.filter(function(x){return x.topic===group})[0];
    if(!g) return;
    var intro = el('div','guide-intro'); intro.textContent = g.intro + ' (Guia montado a partir dos temas cobrados nas 14 provas anteriores; não é garantia do que cairá, então confirme com os slides da disciplina.)';
    list.appendChild(intro);
    g.subs.forEach(function(s,i){
      var d = el('details','sub'); if(i===0) d.open = true;
      d.appendChild(el('summary',null,s.t));
      var b = el('div','body'); b.innerHTML = s.h; d.appendChild(b);
      list.appendChild(d);
    });
    var go = el('button','gobtn','Treinar as '+countOf(group)+' questões de '+group+' →'); go.type='button';
    go.addEventListener('click', function(){ mode='topic'; render(); window.scrollTo({top:0}); });
    list.appendChild(go);
  }
  function render(){
    document.getElementById('modeTopic').setAttribute('aria-pressed', mode==='topic');
    document.getElementById('modeExam').setAttribute('aria-pressed', mode==='exam');
    document.getElementById('modeGuide').setAttribute('aria-pressed', mode==='guide');
    document.getElementById('bar').classList.toggle('hide', mode==='guide');
    renderTabs();
    if(mode==='guide') renderGuide(); else renderList();
  }

  document.getElementById('modeTopic').addEventListener('click', function(){ mode='topic'; if(TOPICS.indexOf(group)<0) group=TOPICS[0]; render(); window.scrollTo({top:0}); });
  document.getElementById('modeExam').addEventListener('click', function(){ mode='exam'; group=PROVAS[0]; render(); window.scrollTo({top:0}); });
  document.getElementById('modeGuide').addEventListener('click', function(){ mode='guide'; group=(mode==='guide' && TOPICS.indexOf(group)>-1)?group:TOPICS[0]; render(); window.scrollTo({top:0}); });
  document.getElementById('redo').addEventListener('click', function(){ resetGroup(); renderList(); window.scrollTo({top:0}); });

  document.getElementById('sub').textContent = Q.length+' questões de '+PROVAS.length+' provas (T25–T32) · alternativas embaralhadas a cada sessão/refazer';
  render();
})();
</script>
</body>
</html>
