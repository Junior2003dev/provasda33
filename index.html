<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco de Questões — Neuro, Abdome e Geriatria</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f4; --text:#1b1f27; --muted:#5b6472; --border:#d5d9e0;
  --accent:#2457d6; --accent-ink:#ffffff; --accent-soft:#e3ebff;
  --ok-bg:#dff5e6; --ok-border:#2e9d57; --ok-ink:#12522c;
  --bad-bg:#fde3e3; --bad-border:#d34545; --bad-ink:#7a1b1b;
  --warn-bg:#fff3d6; --warn-border:#d99a1a; --warn-ink:#6a4700;
  --ctx-bg:#eef3fb; --ctx-border:#b9c8e6;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#101319; --surface:#181c24; --surface-2:#222833; --text:#e6e9ef; --muted:#9aa4b4; --border:#2e3644;
    --accent:#7aa2ff; --accent-ink:#0d1220; --accent-soft:#1f2b49;
    --ok-bg:#12331f; --ok-border:#3fbf74; --ok-ink:#a8ebc3;
    --bad-bg:#3a1819; --bad-border:#ef6a6a; --bad-ink:#ffc2c2;
    --warn-bg:#35290e; --warn-border:#e0a82e; --warn-ink:#ffe2a3;
    --ctx-bg:#1a2233; --ctx-border:#33425f;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#101319; --surface:#181c24; --surface-2:#222833; --text:#e6e9ef; --muted:#9aa4b4; --border:#2e3644;
  --accent:#7aa2ff; --accent-ink:#0d1220; --accent-soft:#1f2b49;
  --ok-bg:#12331f; --ok-border:#3fbf74; --ok-ink:#a8ebc3;
  --bad-bg:#3a1819; --bad-border:#ef6a6a; --bad-ink:#ffc2c2;
  --warn-bg:#35290e; --warn-border:#e0a82e; --warn-ink:#ffe2a3;
  --ctx-bg:#1a2233; --ctx-border:#33425f;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:1.25rem;margin:4px 56px 2px 0;line-height:1.25}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
#themeBtn{position:fixed;top:10px;right:10px;z-index:50;width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:1.2rem;cursor:pointer;box-shadow:var(--shadow)}
.modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;margin-bottom:12px}
.modes button{border:0;background:transparent;color:var(--muted);padding:9px 4px;font-size:.88rem;line-height:1.25;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}
.tabs button{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:7px 12px;border-radius:999px;font:inherit;font-size:.88rem;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tabs .cnt{opacity:.75;font-size:.8em;margin-left:4px}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--border);margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stats{font-size:.9rem;color:var(--muted);flex:1 1 auto}
.stats b{color:var(--text)}
.redo{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:7px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.redo:hover{border-color:var(--accent)}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 14px 12px;margin-bottom:14px;box-shadow:var(--shadow)}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.qnum{font-weight:700}
.chip{font-size:.74rem;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:2px 9px;border-radius:999px}
.chip.alt{background:var(--surface-2);color:var(--muted)}
.ctx{background:var(--ctx-bg);border:1px solid var(--ctx-border);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:.93rem}
.ctx b{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.stem{margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;transition:background .12s,border-color .12s,opacity .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:0 0 auto;font-weight:700;min-width:1.4em;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok-ink)}
.opt.ok .l{color:var(--ok-ink)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-border);color:var(--bad-ink)}
.opt.bad .l{color:var(--bad-ink)}
.opt.dim{opacity:.45}
.fb{margin-top:10px;font-weight:600;font-size:.93rem}
.fb.ok{color:var(--ok-ink)} .fb.bad{color:var(--bad-ink)}
.gc{margin-top:10px;background:var(--ctx-bg);border:1px solid var(--ctx-border);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:.92rem}
.gc b{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin-bottom:2px}
.note{margin-top:10px;background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:.9rem}
.note b{display:block;margin-bottom:2px}
.result{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:16px;text-align:center;margin:8px 0 20px}
.result .big{font-size:1.6rem;font-weight:800}
.empty{color:var(--muted);text-align:center;padding:30px 0}
@media (max-width:480px){ .wrap{padding:12px 10px 70px} .card{padding:12px 11px} h1{font-size:1.12rem} }
.guide-intro{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.93rem}
details.sub{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;box-shadow:var(--shadow)}
details.sub>summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary::before{content:'▸';display:inline-block;margin-right:8px;color:var(--accent);transition:transform .15s}
details.sub[open]>summary::before{transform:rotate(90deg)}
details.sub .body{padding:0 14px 12px;font-size:.93rem}
details.sub .body ul{margin:6px 0;padding-left:20px}
details.sub .body li{margin-bottom:5px}
.tw{overflow-x:auto;margin:8px 0}
.tw table{border-collapse:collapse;width:100%;font-size:.86rem}
.tw th,.tw td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
.tw th{background:var(--surface-2)}
.gobtn{display:inline-block;margin:6px 0 20px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.bar.hide{display:none}
</style>
</head>

<script id="payload" type="application/json">{"data": [{"id": "p02-7", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 7, "ctx": null, "stem": "Paciente de 32 anos chega ao ambulatório de neurologia com quadro de paralisia facial à esquerda. Ao examinar o paciente, observa-se dificuldade para levantar a sobrancelha esquerda, dificuldade para fechar o olho esquerdo, desvio de rima labial para direita e apagamento do sulco nasolabial à esquerda. Conclui-se tratar de:", "opts": ["Lesão central do VII nervo à esquerda.", "Lesão periférica do VII nervo à esquerda.", "Lesão central do VII nervo à direita.", "Lesão periférica do VII nervo à direita."], "correct": 1, "fixed": false, "note": null, "comment": "Paralisia facial periférica atinge toda a hemiface, inclusive a testa (dificuldade de levantar a sobrancelha) e o fechamento do olho; o desvio da rima labial é para o lado sadio. Sulco nasolabial apagado à esquerda indica lesão periférica do VII à esquerda. Na lesão central a fronte é poupada."}, {"id": "p02-8", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 8, "ctx": null, "stem": "Paciente de 78 anos, com quadro de bradicinesia, tremor de repouso à esquerda e sinal da roda denteada à esquerda. Trata-se de provável:", "opts": ["Síndrome cerebelar.", "Síndrome extrapiramidal do tipo hipercinética.", "Síndrome de segundo neurônio motor.", "Síndrome extrapiramidal do tipo hipocinética."], "correct": 3, "fixed": false, "note": null, "comment": "Bradicinesia, tremor de repouso e roda denteada formam a síndrome parkinsoniana, uma síndrome extrapiramidal hipocinética. A hipercinética cursa com movimentos involuntários (coreia, balismo, distonia)."}, {"id": "p02-9", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 9, "ctx": null, "stem": "Ao avaliar um paciente encontrado em via pública desacordado, você observa abertura ocular apenas com estímulo doloroso, emissão de sons incompreensíveis e resposta motora com localização de estímulo doloroso, sem obedecer comandos. Assinale a pontuação na Escala de Coma de Glasgow do referido paciente:", "opts": ["6", "7", "8", "9"], "correct": 3, "fixed": false, "note": null, "comment": "Glasgow = abertura ocular + resposta verbal + resposta motora. Abre os olhos à dor (2) + sons incompreensíveis (2) + localiza a dor (5) = 9."}, {"id": "p02-10", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 10, "ctx": null, "stem": "As provas de Mingazzini e Barré são provas que avaliam:", "opts": ["Sensibilidade tátil.", "Tônus muscular.", "Força muscular.", "Trofismo."], "correct": 2, "fixed": false, "note": null, "comment": "Mingazzini (membros inferiores) e Barré (inferiores, em decúbito ventral) são provas de déficit motor sutil: o membro que fraqueja cai. Avaliam força muscular, não tônus nem sensibilidade."}, {"id": "p02-11", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 11, "ctx": null, "stem": "Assinale a alternativa que corresponde aos achados semiológicos encontrados na surdez condutiva:", "opts": ["Teste de Rinne positivo e Teste de Weber com lateralização para ouvido de melhor audição.", "Teste de Rinne negativo e Teste de Weber com lateralização para ouvido de pior audição.", "Teste de Rinne positivo e Teste de Weber com lateralização para ouvido de pior audição.", "Teste de Rinne negativo e Teste de Weber com lateralização para ouvido de melhor audição."], "correct": 1, "fixed": false, "note": null, "comment": "Na surdez condutiva a via óssea supera a aérea (Rinne negativo) e o Weber lateraliza para o ouvido pior. Na neurossensorial, Rinne permanece positivo (diminuído) e o Weber lateraliza para o ouvido melhor."}, {"id": "p02-12", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 12, "ctx": null, "stem": "Paciente é atendido na emergência neurológica com quadro de cefaleia de forte intensidade, vômitos, febre e inapetência há cerca de 3 dias. Ao examinar o paciente, evidencia-se rigidez de nuca. Quais outros achados podem ser encontrados na síndrome neurológica informada?", "opts": ["Sinal de Babinski, clônus e sincinesia.", "Sinal da cortina de Vernet, reflexo do vômito abolido e disfonia.", "Fasciculações, hipotonia e arreflexia.", "Sinais de Kernig, Brudzinski e Lasègue positivos."], "correct": 3, "fixed": false, "note": null, "comment": "Cefaleia, febre, vômitos e rigidez de nuca formam a síndrome meníngea. Os sinais de irritação meníngea são Kernig, Brudzinski e Lasègue. Babinski e clônus são do 1º neurônio, e fasciculações do 2º."}, {"id": "p02-13", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 13, "ctx": null, "stem": "Ao avaliar a força motora de um paciente com suspeita de Guillain-Barré, observa-se incapacidade de vencer a gravidade com os membros inferiores na manobra de Mingazzini, mas possibilidade de realizar movimentos de lateralização com membros apoiados. Conclui-se que a força motora dos membros inferiores, de acordo com a escala MRC (Medical Research Council), é:", "opts": ["Grau 2.", "Grau 3.", "Grau 4.", "Grau 5."], "correct": 0, "fixed": false, "note": null, "comment": "Escala MRC: 0 sem contração; 1 contração sem movimento; 2 move com a gravidade eliminada (apoiado) mas não vence a gravidade; 3 vence a gravidade; 4 vence resistência parcial; 5 normal. Se não vence a gravidade mas move apoiado, é grau 2."}, {"id": "p02-14", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 14, "ctx": null, "stem": "São achados da síndrome cerebelar:", "opts": ["Hipotonia, fasciculações e arreflexia.", "Hipotonia, reflexo pendular e disdiadococinesia.", "Hipertonia, Babinski e hiperreflexia.", "Hipertonia, bradicinesia e tremor de repouso."], "correct": 1, "fixed": false, "note": null, "comment": "Síndrome cerebelar: hipotonia, reflexo pendular, disdiadococinesia, dismetria, ataxia de marcha e tremor de intenção. Hipertonia com Babinski é piramidal; bradicinesia com tremor de repouso é parkinsoniana."}, {"id": "p02-15", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 15, "ctx": null, "stem": "Paciente é atendido com queixa de dormência em face. Ao exame, apresenta desvio de mandíbula para direita, abolição do reflexo córneo-palpebral à direita e hipoestesia tátil em ramos oftálmico, maxilar e mandibular à direita. De acordo com os achados, trata-se de provável lesão do:", "opts": ["VII nervo à direita.", "VII nervo à esquerda.", "V nervo à esquerda.", "V nervo à direita."], "correct": 3, "fixed": false, "note": null, "comment": "Hipoestesia dos 3 ramos do V, abolição do reflexo córneo-palpebral (aferência pelo V) e desvio da mandíbula para o lado da lesão (pterigóideo fraco) apontam para o V nervo do mesmo lado: direito."}, {"id": "p02-16", "topic": "Neurologia", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 16, "ctx": null, "stem": "São achados da lesão do nervo oculomotor (III) à esquerda:", "opts": ["Ptose palpebral à esquerda, estrabismo convergente e pupila esquerda midriática.", "Ptose palpebral à esquerda, estrabismo divergente e pupila esquerda midriática.", "Ptose palpebral à direita, estrabismo convergente e pupila direita midriática.", "Ptose palpebral à direita, estrabismo divergente e pupila direita midriática."], "correct": 1, "fixed": false, "note": null, "comment": "Lesão do III esquerdo: ptose (levantador da pálpebra), olho desviado para fora e para baixo (estrabismo divergente, por ação do reto lateral e do oblíquo superior) e midríase (perde o parassimpático). Tudo no lado esquerdo."}, {"id": "p04-1", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 1, "ctx": null, "stem": "Em relação aos nervos cranianos, analise as seguintes alternativas: I- O segundo nervo craniano é o olfatório, puramente sensitivo. Ele é responsável pelo olfato. II- O terceiro nervo craniano é o oculomotor, puramente motor. Ele inerva os músculos reto superior, reto inferior, reto medial e oblíquo superior. III- O quinto nervo craniano é o trigêmeo. Sua porção sensitiva é responsável pela sensibilidade da face e sua porção motora inerva os músculos da mastigação. IV- O sétimo nervo craniano é o facial. Ele é responsável pela gustação dos 2/3 anteriores da língua e pela mímica facial.", "opts": ["I, II, III e IV", "II, III e IV", "III e IV", "IV"], "correct": 2, "fixed": false, "note": null, "comment": "I falsa: o II par é o óptico (o olfatório é o I). II falsa: o oculomotor inerva reto superior, inferior, medial e oblíquo inferior; o oblíquo superior é do IV. III e IV verdadeiras (V: sensibilidade da face e mastigação; VII: mímica e gustação dos 2/3 anteriores)."}, {"id": "p04-2", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 2, "ctx": null, "stem": "Na inspeção de paciente com lesão do sexto nervo craniano à esquerda (abducente), espera-se encontrar:", "opts": ["Ptose à esquerda", "Estrabismo divergente", "Midríase à esquerda", "Estrabismo convergente"], "correct": 3, "fixed": false, "note": null, "comment": "O VI inerva o reto lateral (abdução). Se está lesado à esquerda, o olho esquerdo não abduz e fica desviado medialmente: estrabismo convergente, com diplopia horizontal. Ptose e midríase são do III."}, {"id": "p04-3", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 3, "ctx": null, "stem": "Durante avaliação de um paciente, observa-se desvio de mandíbula para esquerda, hipoestesia tátil e dolorosa à esquerda e reflexo córneo-palpebral abolido à esquerda. Trata-se de provável lesão do:", "opts": ["III nervo à esquerda", "IV nervo à esquerda", "V nervo à esquerda", "VII nervo à esquerda"], "correct": 2, "fixed": false, "note": null, "comment": "Desvio da mandíbula para o lado lesado, hipoestesia facial e reflexo córneo-palpebral abolido (via aferente V) apontam para o V nervo esquerdo."}, {"id": "p04-4", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 4, "ctx": null, "stem": "Paciente apresenta reflexos pendulares, marcha ebriosa, disdiadococinesia e dismetria. Trata-se de provável:", "opts": ["Síndrome do primeiro neurônio motor", "Síndrome do segundo neurônio motor", "Síndrome extra-piramidal hipocinética", "Síndrome cerebelar"], "correct": 3, "fixed": false, "note": null, "comment": "Reflexos pendulares, marcha ebriosa, disdiadococinesia e dismetria compõem a síndrome cerebelar."}, {"id": "p04-5", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 5, "ctx": null, "stem": "Paciente não consegue realizar movimentos alternados rápidos e não acerta o alvo ao tocar o nariz. Isso corresponde a:", "opts": ["Ataxia e anosmia", "Dismetria e hipoestesia", "Disdiadococinesia e dismetria", "Hipertonia e atrofia"], "correct": 2, "fixed": false, "note": null, "comment": "Não conseguir movimentos alternados rápidos é disdiadococinesia; errar o alvo no teste índex-nariz é dismetria. Ambas são cerebelares."}, {"id": "p04-6", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 6, "ctx": null, "stem": "Paciente vence a gravidade, porém não consegue vencer a resistência imposta pelo examinador. Segundo a escala MRC, força muscular:", "opts": ["Grau I", "Grau II", "Grau III", "Grau IV"], "correct": 2, "fixed": false, "note": null, "comment": "Vence a gravidade mas não vence a resistência do examinador: MRC grau 3 (o texto escreve 'Grau III')."}, {"id": "p04-7", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 7, "ctx": null, "stem": "Reflexos profundos aumentados, hipertonia elástica, clônus e Babinski são achados de:", "opts": ["Síndrome do primeiro neurônio motor", "Síndrome do segundo neurônio motor", "Síndrome extra-piramidal", "Síndrome cerebelar"], "correct": 0, "fixed": false, "note": null, "comment": "Síndrome do 1º neurônio motor (piramidal): hiperreflexia, hipertonia elástica (canivete), clônus e sinal de Babinski. No 2º neurônio há hipotonia, atrofia e fasciculações."}, {"id": "p04-8", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 8, "ctx": null, "stem": "Paciente em decúbito dorsal apresenta flexão dos joelhos à flexão passiva do pescoço. Este sinal é:", "opts": ["Brudzinski", "Kerning", "Lasègue", "Babinski"], "correct": 0, "fixed": false, "note": null, "comment": "Flexão dos joelhos à flexão passiva do pescoço é o sinal de Brudzinski. Kernig é a resistência à extensão do joelho com o quadril fletido; Lasègue pesquisa dor ciática à elevação da perna; Babinski é reflexo plantar."}, {"id": "p04-9", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 9, "ctx": null, "stem": "Assinale a manobra que avalia irritação meníngea:", "opts": ["Mingazzini", "Kerning", "Prova dos braços estendidos", "Manobra de Barré"], "correct": 1, "fixed": false, "note": null, "comment": "Kernig é manobra de irritação meníngea. Mingazzini, Barré e prova dos braços estendidos avaliam força."}, {"id": "p04-10", "topic": "Neurologia", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 10, "ctx": null, "stem": "Homem encontrado desacordado: não abre olhos, não verbaliza e localiza dor. A pontuação de Glasgow é:", "opts": ["6", "7", "8", "9"], "correct": 1, "fixed": false, "note": null, "comment": "Não abre os olhos (1) + não verbaliza (1) + localiza a dor (5) = 7."}, {"id": "p06-1", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 1, "ctx": null, "stem": "São provas para avaliar a coordenação motora:", "opts": ["Diadococinesia, prova índice-nariz e Romberg.", "Lasègue, Kernig e prova índice-nariz.", "Barré, Mingazzini e manobra dos braços estendidos.", "Avaliação da marcha, Babinski e Lasègue."], "correct": 0, "fixed": false, "note": null, "comment": "Coordenação: diadococinesia, índex-nariz, calcanhar-joelho, Romberg e marcha. Lasègue e Kernig são meníngeos; Barré e Mingazzini avaliam força; Babinski é reflexo."}, {"id": "p06-2", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 2, "ctx": null, "stem": "Sobre o nível de consciência na semiologia neurológica, assinale a alternativa CORRETA:", "opts": ["A consciência corporal refere-se primariamente à capacidade de auto- supervisionar a execução de um ato motor.", "O nível de consciência é definido como o grau de alerta, que pode variar de vigília a coma, sendo a Escala de Coma de Glasgow uma ferramenta padronizada para sua avaliação.", "A avaliação do nível de consciência é realizada exclusivamente pela pesquisa dos reflexos relacionados às estruturas do tronco encefálico, como o reflexo vestíbulo-oculo-cefálico.", "O conteúdo da consciência refere-se apenas à motricidade ocular extrínseca e aos reflexos pupilares."], "correct": 1, "fixed": false, "note": null, "comment": "Nível de consciência é o grau de alerta (vigília), que vai da lucidez ao coma. O conteúdo da consciência é a cognição. A escala de Glasgow é um instrumento do nível, mas a avaliação não se resume a ela."}, {"id": "p06-3", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 3, "ctx": null, "stem": "Um paciente chega ao pronto-socorro após um acidente. Na avaliação inicial, o médico verifica que o paciente abre os olhos apenas quando é chamado pelo nome em voz alta. Quando questionado, emite apenas sons incompreensíveis. Ao aplicar um estímulo doloroso no leito ungueal, o paciente realiza um movimento de retirada (flexão normal) do membro. Com base na Escala de Coma de Glasgow, qual é a pontuação total deste paciente?", "opts": ["7 pontos.", "9 pontos.", "11 pontos.", "13 pontos."], "correct": 1, "fixed": false, "note": null, "comment": "Abre os olhos ao chamado (3) + sons incompreensíveis (2) + retirada normal ao estímulo doloroso (4) = 9."}, {"id": "p06-4", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 4, "ctx": null, "stem": "A avaliação clínica do nervo óptico (NC II) inclui a pesquisa de todos os aspectos a seguir, EXCETO:", "opts": ["Campimetria visual.", "Reflexo córneo-palpebral.", "Acuidade visual.", "Distinção de cores."], "correct": 1, "fixed": false, "note": null, "comment": "O exame do II par inclui acuidade visual, campimetria, visão de cores, fundo de olho e reflexo fotomotor. O reflexo córneo-palpebral é do V (aferência) e do VII (eferência)."}, {"id": "p06-5", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 5, "ctx": null, "stem": "Ao realizar o exame neurológico de um paciente com suspeita de lesão do nervo acessório (NC XI) do lado direito, o médico procede à avaliação da força dos músculos inervados por este nervo. Assinale a alternativa que descreve um potencial e esperado achado na avaliação da motricidade do pescoço neste cenário.", "opts": ["Dificuldade para girar a cabeça para o lado direito contra resistência, devido à fraqueza do músculo esternocleidomastóideo esquerdo.", "Dificuldade para elevar o ombro esquerdo contra resistência, devido à fraqueza do músculo trapézio esquerdo.", "Dificuldade para girar a cabeça para o lado esquerdo contra resistência, devido à fraqueza do músculo esternocleidomastóideo direito.", "Atrofia visível do músculo trapézio esquerdo e desvio da cabeça para o lado esquerdo em repouso."], "correct": 3, "fixed": false, "note": "O gabarito oficial é D, mas a descrição não se sustenta: numa lesão do NC XI à direita, o músculo atingido é o trapézio/esternocleidomastóideo direito (atrofia do trapézio direito; dificuldade de girar a cabeça para a esquerda — alternativa C). Mantive o gabarito oficial.", "comment": "Raciocínio fisiológico: lesão do XI à direita enfraquece o esternocleidomastóideo direito (dificuldade de girar a cabeça para a esquerda, alternativa C) e o trapézio direito (atrofia e queda do ombro direito). O gabarito oficial é D, que descreve o lado esquerdo, o que parece incorreto. Mantive o oficial por regra."}, {"id": "p06-6", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 6, "ctx": null, "stem": "Durante a avaliação no ambulatório de neurologia, o médico assistente solicita ao paciente que bata palma toda vez que escutar a letra \"A\", soletrando em seguida uma sequência de letras diversas, contendo a letra \"A\" dentre outras letras repetidas vezes. Qual domínio cognitivo é o principal foco de avaliação com este teste?", "opts": ["Memória.", "Orientação temporal.", "Atenção.", "Fluência verbal."], "correct": 2, "fixed": false, "note": null, "comment": "Bater palma ao ouvir a letra 'A' em uma sequência é o teste de vigilância, que avalia atenção sustentada. Memória usa evocação de palavras, orientação usa data e local, e fluência usa listas de animais."}, {"id": "p06-7", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 7, "ctx": null, "stem": "Durante avaliação de paciente com suspeita de AVC, observa-se força grau 3 em membro superior direito. De acordo com a MRC (escala de avaliação de força muscular), o paciente em questão:", "opts": ["Consegue vencer a gravidade e fazer força contra a resistência do examinador.", "Consegue vencer a gravidade, mas não consegue fazer força contra a resistência do examinador.", "Não consegue vencer a gravidade e nem fazer força contra a resistência do examinador, mas consegue fazer movimento de lateralização do membro.", "Tem apenas contração muscular visível."], "correct": 1, "fixed": false, "note": null, "comment": "Grau 3 na escala MRC: vence a gravidade, mas não vence a resistência do examinador."}, {"id": "p06-8", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 8, "ctx": null, "stem": "A hipotonia, atrofia muscular e hiperreflexia são achados da:", "opts": ["Síndrome de primeiro neurônio motor.", "Síndrome de segundo neurônio motor.", "Síndrome extra-piramidal.", "Síndrome meníngea."], "correct": 1, "fixed": false, "note": "O enunciado cita 'hiperreflexia', mas na síndrome do 2º neurônio motor os reflexos estão diminuídos (hiporreflexia); hiperreflexia é do 1º neurônio. O gabarito oficial (B) é coerente com hipotonia + atrofia — provável erro de redação do enunciado.", "comment": "Hipotonia e atrofia muscular são do 2º neurônio motor, que é a resposta oficial B. Cuidado: o enunciado cita 'hiperreflexia', mas no 2º neurônio os reflexos estão diminuídos ou abolidos; a hiperreflexia é do 1º neurônio. Provável erro de redação."}, {"id": "p06-9", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 9, "ctx": null, "stem": "São achados de uma síndrome parkinsoniana:", "opts": ["Hipertonia, hiperreflexia e sinal de Babinski.", "Hipotonia, hiperreflexia e sinal da roda denteada.", "Hipertonia, bradicinesia e tremor de repouso.", "Hipotonia, hiperreflexia e fasciculações."], "correct": 2, "fixed": false, "note": null, "comment": "Síndrome parkinsoniana: hipertonia plástica (roda denteada), bradicinesia, tremor de repouso e instabilidade postural. Reflexos normais."}, {"id": "p06-10", "topic": "Neurologia", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 10, "ctx": null, "stem": "As fasciculações, vistas na síndrome de segundo neurônio motor, consistem em:", "opts": ["Movimento em espelho do membro parético.", "Redução do tônus muscular nos membros inferiores.", "Aumento do tônus muscular visto nos membros superiores.", "Contrações musculares visíveis e involuntárias de um grupo muscular."], "correct": 3, "fixed": false, "note": null, "comment": "Fasciculações são contrações musculares visíveis e involuntárias de uma unidade motora, típicas da lesão do 2º neurônio motor, junto com hipotonia, atrofia e hiporreflexia."}, {"id": "p12-8", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 8, "ctx": null, "stem": "Ao avaliar um paciente com sequela de AVC isquêmico, você nota que o mesmo apresenta um déficit motor à direita. Ele não consegue vencer a gravidade com o membro superior direito (MSD), mas consegue fazer movimentos de lateralização. Já com o membro inferior direito (MID), ele consegue vencer a gravidade, porém, não consegue fazer força contra a resistência do examinador. De acordo com a graduação de força (MRC-Medical Research Council), ele apresenta:", "opts": ["Grau I no MSD e grau II no MID", "Grau II no MSD e grau III no MID", "Grau III no MSD e grau IV no MID", "Grau IV no MSD e grau V no MID"], "correct": 1, "fixed": false, "note": null, "comment": "MSD: não vence a gravidade, mas lateraliza, é grau 2. MID: vence a gravidade, mas não a resistência, é grau 3. Resposta: grau 2 no MSD e grau 3 no MID."}, {"id": "p12-9", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 9, "ctx": null, "stem": "“Durante a marcha, o paciente mantém o olhar fixo no chão, levanta abruptamente o membro inferior e ao ser recolocado, os calcanhares tocam o solo pesadamente.” A descrição feita é referente a qual marcha patológica?", "opts": ["Ceifante", "Escarvante", "Tabética", "Parkinsoniana"], "correct": 2, "fixed": false, "note": null, "comment": "Marcha tabética (por perda da propriocepção): olhar fixo no chão, pé levantado bruscamente e calcanhar batendo pesadamente. A ceifante é de hemiparesia espástica, a escarvante é do pé caído e a parkinsoniana é de passos curtos."}, {"id": "p12-10", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 10, "ctx": null, "stem": "O exame da motricidade engloba a avaliação do tônus muscular, no qual pode ser descrito como a resistência sentida quando uma parte do corpo é movida passivamente. Assinale a alternativa que contempla as síndromes neurológicas que aumentam o tônus muscular:", "opts": ["Síndrome do segundo neurônio motor e síndrome cerebelar", "Síndrome cerebelar e síndrome meníngea", "Síndrome extrapiramidal (hipocinética) e síndrome do primeiro neurônio motor", "Síndrome extrapiramidal e síndrome do segundo neurônio motor"], "correct": 2, "fixed": false, "note": null, "comment": "O tônus aumenta nas síndromes piramidal (elástica) e extrapiramidal hipocinética (plástica). Diminui na síndrome do 2º neurônio e na cerebelar."}, {"id": "p12-11", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 11, "ctx": null, "stem": "A manobra de Barré avalia:", "opts": ["Sensibilidade", "Coordenação motora", "Força motora", "Tônus muscular"], "correct": 2, "fixed": false, "note": null, "comment": "A manobra de Barré avalia força motora (déficit leve dos membros inferiores em decúbito ventral)."}, {"id": "p12-12", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 12, "ctx": null, "stem": "Os reflexos profundos estão reduzidos ou abolidos em qual síndrome neurológica?", "opts": ["Síndrome do primeiro neurônio motor", "Síndrome do segundo neurônio motor", "Síndrome meníngea", "Síndrome extrapiramida"], "correct": 1, "fixed": false, "note": null, "comment": "Reflexos profundos diminuídos ou abolidos são do 2º neurônio motor (arco reflexo interrompido). No 1º neurônio estão exaltados."}, {"id": "p12-13", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 13, "ctx": null, "stem": "São consideradas etapas do exame clínico do nervo óptico, EXCETO:", "opts": ["Campimetria visual por confrontação", "Teste de acuidade visual por tabela de Snellen", "Pesquisa do reflexo córneo-palpebral.", "Teste de discriminação de cores."], "correct": 2, "fixed": false, "note": null, "comment": "O exame do nervo óptico inclui campimetria por confrontação, acuidade (Snellen) e discriminação de cores. O reflexo córneo-palpebral é do V e do VII."}, {"id": "p12-14", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 14, "ctx": null, "stem": "A pesquisa do reflexo pupilar (fotomotor) é uma importante etapa do exame físico neurológico. Se, durante sua execução, observa-se o seguinte conjunto de respostas: - Olho esquerdo: reflexo fotomotor direto ausente / reflexo fotomotor indireto (consensual) normal. - Olho direito: reflexo fotomotor direto normal / reflexo fotomotor indireto (consensual) ausente. A disfunção, responsável pelas alterações observadas mais provavelmente encontra-se na:", "opts": ["Eferência do reflexo, no lado esquerdo.", "Aferência do reflexo, no lado esquerdo.", "Eferência do reflexo, no lado direito.", "Aferência do reflexo, no lado direito."], "correct": 1, "fixed": false, "note": null, "comment": "Luz no olho esquerdo: nenhuma pupila responde. Luz no olho direito: ambas respondem. Se a pupila esquerda responde quando se ilumina o direito, a eferência esquerda está íntegra. Logo, o defeito está na aferência esquerda (nervo óptico esquerdo)."}, {"id": "p12-15", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 15, "ctx": null, "stem": "Durante a avaliação da mobilidade da língua, testa-se a função do nervo:", "opts": ["Glossofaríngeo.", "Acessório.", "Vago.", "Hipoglosso."], "correct": 3, "fixed": false, "note": null, "comment": "A mobilidade da língua é função do nervo hipoglosso (XII); sua lesão desvia a língua para o lado lesado."}, {"id": "p12-16", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 16, "ctx": null, "stem": "Durante a avaliação da escala de coma de Glasgow foram obtidos os seguintes padrões de resposta: - Abertura ocular: Espontânea. - Resposta verbal: Sem resposta (ausente). - Resposta motora: Localiza a dor. A pontuação registrada pela escala de coma de Glasgow é de:", "opts": ["8", "9", "10", "11"], "correct": 2, "fixed": false, "note": null, "comment": "Abertura espontânea (4) + sem resposta verbal (1) + localiza a dor (5) = 10."}, {"id": "p12-17", "topic": "Neurologia", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 17, "ctx": null, "stem": "Quanto às alterações relacionadas à linguagem, a disfunção do aparelho articulador (lábios, língua ou palato) decorrente de lesão neurológica denomina-se:", "opts": ["Dislalia.", "Disgrafia.", "Disartria.", "Disfonia."], "correct": 2, "fixed": false, "note": null, "comment": "Disartria é a alteração da articulação da fala por lesão neurológica (lábios, língua, palato). Dislalia é troca de fonemas, disfonia é alteração da voz e disgrafia é da escrita."}, {"id": "p13-1", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 1, "ctx": null, "stem": "São consideradas manobras que avaliam a força muscular, exceto:", "opts": ["Brudzinski", "Barré", "Manobra dos braços estendidos", "Mingazzini"], "correct": 0, "fixed": false, "note": null, "comment": "Barré, Mingazzini e braços estendidos avaliam força. Brudzinski é sinal de irritação meníngea."}, {"id": "p13-2", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 2, "ctx": null, "stem": "A avaliação da marcha é parte importante do exame neurológico, pois através dela podemos detectar achados característicos de doenças neurológicas. A cerca desse assunto, complete a seguinte afirmação: \"A marcha pode ocorrer em pacientes com alteração da propriocepção. Nela, o paciente olha fixamente para o chão, os pés são levantados abruptamente e explosivamente tocados no chão.\"", "opts": ["Escarvante", "Tabética", "Ceifante", "Dribosa"], "correct": 1, "fixed": false, "note": null, "comment": "Marcha tabética: pés levantados bruscamente e batendo no chão com o olhar fixo, por déficit proprioceptivo. A escarvante arrasta a ponta do pé, e a ceifante circunduz o membro espástico."}, {"id": "p13-3", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 3, "ctx": null, "stem": "Ao avaliar um paciente vítima de acidente vascular cerebral (AVC), o médico observa que ele apresenta perda de força em membro superior e inferior esquerdos. Durante avaliação do membro inferior esquerdo, paciente consegue vencer a gravidade com a perna direita, porém, não consegue fazer força contra a resistência imposta pelo examinador. Durante avaliação do membro superior esquerdo, paciente não consegue vencer a gravidade, porém, consegue realizar movimentos de lateralização com o membro apoiado. De acordo com a escala de força do MRC (Medical Research Council), a força muscular no membro inferior e superior esquerdos são, respectivamente:", "opts": ["5 e 4", "2 e 1", "3 e 2", "4 e 3"], "correct": 2, "fixed": false, "note": "Pequena falha no enunciado: diz 'perna direita' ao descrever o membro inferior esquerdo; o contexto é o lado esquerdo.", "comment": "MI: vence a gravidade, mas não a resistência: 3. MS: não vence a gravidade, mas move apoiado: 2. Resposta: 3 e 2. Obs.: o enunciado cita 'perna direita', mas se refere ao membro esquerdo."}, {"id": "p13-4", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 4, "ctx": null, "stem": "Paciente comparece ao ambulatório com queixa de vertigem, vômitos e dificuldade para deambular. Durante avaliação, nota-se presença de disdiadococinesia à direita, prova index nariz com dismetria à direita e reflexo pendular à direita. Diante dos achados semiológicos, trata-se de provável:", "opts": ["Síndrome do segundo neurônio motor", "Síndrome extra piramidal", "Síndrome do primeiro neurônio motor", "Síndrome cerebelar"], "correct": 3, "fixed": false, "note": null, "comment": "Vertigem, vômitos, disdiadococinesia, dismetria e reflexo pendular indicam síndrome cerebelar, com sinais ipsilaterais à lesão (hemisfério direito)."}, {"id": "p13-5", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 5, "ctx": null, "stem": "São achados da síndrome piramidal (1º neurônio motor), exceto:", "opts": ["Sinal de Babinski", "Clônus", "Fasciculações", "Hipertonia elástica (sinal do canivete)"], "correct": 2, "fixed": false, "note": null, "comment": "Síndrome piramidal: Babinski, clônus, hiperreflexia e hipertonia elástica. Fasciculações são do 2º neurônio motor."}, {"id": "p13-6", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 6, "ctx": null, "stem": "Sobre a avaliação do nível de consciência através da Escala de Coma de Glasgow, julgue os itens a seguir: I. Inclui a avaliação da abertura ocular, resposta verbal e resposta motora a diferentes estímulos como o ambiente, estímulo de comando verbal e estímulo doloroso. II. Na situação de ausência completa de resposta verbal a pontuação final será menor ou igual a 11 pontos. Assinale a alternativa CORRETA:", "opts": ["Nenhum dos itens está correto.", "Apenas o item I está correto.", "Apenas o item II está correto.", "Ambos os itens estão corretos."], "correct": 3, "fixed": true, "note": null, "comment": "I verdadeiro: o Glasgow avalia abertura ocular, resposta verbal e motora. II verdadeiro: sem resposta verbal (1), o máximo é 4 + 1 + 6 = 11."}, {"id": "p13-7", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 7, "ctx": null, "stem": "Sobre a avaliação clínica cognitiva relacionada às agnosias, julgue os itens a seguir: I - Entende-se por agnosia a capacidade de auto-supervisionar a execução de um ato motor. II - A incapacidade de reconhecer objeto pelo tato, sem o auxílio de outra modalidade sensorial (visão, audição, etc.) denomina-se agrafestesia. Assinale a alternativa CORRETA:", "opts": ["Nenhum dos itens está correto.", "Apenas o item I está correto.", "Apenas o item II está correto.", "Ambos os itens estão corretos."], "correct": 0, "fixed": true, "note": null, "comment": "I descreve outra coisa: agnosia é a incapacidade de reconhecer estímulos apesar de sensação preservada. II falso: reconhecer objeto pelo tato é estereognosia; a incapacidade é astereognosia. Agrafestesia é a incapacidade de reconhecer números escritos na pele. Nenhum item correto."}, {"id": "p13-8", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 8, "ctx": null, "stem": "Sobre o Mini Exame do Estado Mental (Mini-mental / MEEM), julgue os itens a seguir: I - Constitui um conjunto de testes que avalia objetivamente sinais relativos ao comprometimento cognitivo diverso, dentre eles: memória, orientação, atenção, cálculo e linguagem. II - Inclui, na avaliação de memória, a apresentação de três palavras, que devem ser inicialmente repetidas pelo paciente, e posteriormente (após no mínimo 2 minutos) evocadas e ditas ao examinador. Assinale a alternativa CORRETA:", "opts": ["Nenhum dos itens está correto.", "Apenas o item I está correto.", "Apenas o item II está correto.", "Ambos os itens estão corretos."], "correct": 3, "fixed": true, "note": null, "comment": "O MEEM avalia orientação, memória imediata (3 palavras), atenção e cálculo, evocação, linguagem e praxia construtiva. As duas afirmativas estão corretas. É rastreio, não faz diagnóstico, e depende da escolaridade."}, {"id": "p13-9", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 9, "ctx": null, "stem": "A incapacidade de reconhecer visualmente rostos familiares, sem o auxílio de outra modalidade sensorial (tato, audição, etc.), denomina-se:", "opts": ["Prosopagnosia", "Simultagnosia", "Fonagnosia", "Astereognosia"], "correct": 0, "fixed": false, "note": null, "comment": "Prosopagnosia é a agnosia visual para rostos familiares. Astereognosia é tátil, e simultagnosia é a incapacidade de perceber a cena como um todo."}, {"id": "p13-10", "topic": "Neurologia", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 10, "ctx": null, "stem": "Durante a avaliação clínica de um paciente idoso, admitido em Unidade de Terapia Intensiva em decorrência de Infecção do Trato Urinário, o médico assistente solicitou ao paciente que \"batesse palma toda vez que escutasse a letra A!\" Em seguida, soletrou \"S-A-V-E-A-H-A-A-R- T\". Recebeu corretamente a resposta de aplauso do paciente em momento oportuno. Assinale a alternativa que relaciona o principal domínio cognitivo avaliado por meio do teste aplicado:", "opts": ["Memória", "Orientação temporal", "Atenção", "Fluência verbal"], "correct": 2, "fixed": false, "note": null, "comment": "Bater palma ao ouvir a letra 'A' avalia atenção. Num idoso internado por infecção, a desatenção é o sinal central de delirium."}, {"id": "p14-11", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 11, "ctx": null, "stem": "Sobre a avaliação de acuidade visual através do teste de Snellen, componente do exame clínico neurológico do NCII (n. óptico), julgue as alternativas a seguir e assinale a assertiva CORRETA:", "opts": ["A aplicação é realizada posicionando-se o paciente a 20 metros da tabela, solicitando-se que leia as letras apresentadas, a partir da primeira linha, em sequência, da esquerda para direita.", "Deve-se sempre avaliar a acuidade visual unilateralmente e individualizar a apresentação do resultado (direita e esquerda).", "A acuidade visual representada como 20/10 denota acuidade visual subnormal.", "Quando alterada acompanha simultaneamente a experimentação de diplopia pelo paciente."], "correct": 1, "fixed": false, "note": null, "comment": "A acuidade se testa em cada olho separadamente. A tabela de Snellen é lida a 6 m (20 pés), e 20/10 é acuidade melhor que a normal (supranormal). A baixa acuidade visual não causa diplopia, que é de paralisia dos nervos oculomotores."}, {"id": "p14-12", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 12, "ctx": null, "stem": "Sobre a avaliação pupilar relativa ao exame neurológico, considere a descrição a seguir: \"Pupilas anisocóricas, diâmetro da pupila direita maior que da pupila esquerda. Reflexo fotomotor direto: normal à esquerda e ausente à direita. Reflexo fotomotor consensual: normal à esquerda e ausente à direita.\" Assinale a alternativa que apresenta uma topografia do sistema nervoso cuja disfunção possibilita a observação das alterações descritas:", "opts": ["Nervo óptico ou forame óptico à direita.", "Quiasma óptico.", "Gânglio ciliar ou fibras eferentes secundárias do nervo oculomotor direito (NC III).", "Núcleo pré-tectal ou colículo superior à direita."], "correct": 2, "fixed": false, "note": null, "comment": "Pupila direita dilatada, sem reflexo direto e sem reflexo consensual à direita, com a esquerda normal, indica defeito de eferência à direita: gânglio ciliar ou fibras parassimpáticas do III direito. Na lesão do óptico haveria perda do reflexo direto à direita mas preservação do consensual."}, {"id": "p14-13", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 13, "ctx": null, "stem": "Sobre a avaliação da motricidade ocular extrínseca, na presença de disfunção isolada do nervo abducente (NC VI) à esquerda, o sintoma de diplopia experimentado pelo paciente torna-se mais evidente quando o seguimento do alvo (olhar conjugado) ocorre no sentido:", "opts": ["Horizontal para esquerda.", "Horizontal para direita.", "Vertical para baixo.", "Vertical para cima."], "correct": 0, "fixed": false, "note": null, "comment": "O VI esquerdo abduz o olho esquerdo. A diplopia é máxima quando se tenta olhar horizontalmente para a esquerda, onde o músculo afetado deveria agir."}, {"id": "p14-14", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 14, "ctx": null, "stem": "São considerados reflexos relacionados ao exame clínico do nervo trigêmeo (NC V), EXCETO:", "opts": ["Reflexo mandibular.", "Reflexo córneo-palpebral.", "Reflexo de espirro.", "Reflexo de vômito."], "correct": 3, "fixed": false, "note": null, "comment": "Reflexos do V: mandibular, córneo-palpebral e do espirro. O reflexo do vômito (nauseoso) é do IX e do X."}, {"id": "p14-15", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 15, "ctx": null, "stem": "Sobre o exame clínico do nervo facial (NC VII), suas correlações anatômicas e fisiopatológicas, assinale a assertiva CORRETA:", "opts": ["A presença de fraqueza ou paralisia dos músculos de toda a hemiface sugere a possibilidade de uma lesão do córtex do giro pré-central unilateralmente ou de suas projeções através da substância branca até a cápsula interna. A etiologia mais provável é um acidente vascular cerebral.", "A presença de fraqueza ou paralisia dos músculos da metade da face com manutenção do movimento da porção superior da face (sobrancelha e testa) bilateralmente sugere a possibilidade de uma lesão do nervo facial após sua origem aparente no sulco bulbo pontino.", "Inclui a avaliação do reflexo córneo-palpebral, relacionando-se à eferência da alça reflexa.", "Inclui a avaliação da força do músculo masseter."], "correct": 2, "fixed": false, "note": null, "comment": "Reflexo córneo-palpebral: aferência pelo V, eferência pelo VII. A: paralisia de toda a hemiface é periférica; a central poupa a fronte. B: está invertida. D: o masseter é inervado pelo V."}, {"id": "p14-16", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 16, "ctx": null, "stem": "Paciente 22 anos, previamente hígida, é atendida no pronto socorro com queixa de cefaleia de forte intensidade, vômitos, febre aferida (39ºC) e inapetência há cerca de 4 dias. Quais sinais semiológicos poderiam ajudar a chegar no diagnóstico sindrômico?", "opts": ["Sinal de Babinski, clônus e sinal do canivete.", "Sinal de Brudzinski, Kernig e Lasègue.", "Sinal da roda denteada, bradicinesia e instabilidade postural.", "Disdiadococinesia, dismetria na prova index nariz e reflexo pendular."], "correct": 1, "fixed": false, "note": null, "comment": "Cefaleia, febre e vômitos formam a síndrome meníngea: Brudzinski, Kernig e Lasègue. Babinski e canivete são do 1º neurônio, roda denteada é parkinsoniana e disdiadococinesia/dismetria são cerebelares."}, {"id": "p14-17", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 17, "ctx": null, "stem": "São provas que avaliam a coordenação motora:", "opts": ["Diadococinesia e Romberg", "Brudzinski e Kernig", "Lasègue e Lhermitte", "Barré e Mingazzini"], "correct": 0, "fixed": false, "note": null, "comment": "Coordenação motora: diadococinesia, Romberg, índex-nariz e marcha. Brudzinski e Kernig são meníngeos; Lasègue e Lhermitte são radiculares; Barré e Mingazzini avaliam força."}, {"id": "p14-18", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 18, "ctx": null, "stem": "Marcha decorrente da fraqueza dos músculos dorsiflexores do pé, fazendo com que o paciente levante a perna além do habitual e arraste a ponta dos pés no chão:", "opts": ["Tabética", "Ebriosa", "Escarvante", "Ceifante"], "correct": 2, "fixed": false, "note": null, "comment": "Marcha escarvante (ou do pé caído): fraqueza dos dorsiflexores, o paciente eleva demais o joelho e arrasta a ponta do pé."}, {"id": "p14-19", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 19, "ctx": null, "stem": "São achados da síndrome do segundo neurônio motor:", "opts": ["Hiporreflexia, atrofia, hipotonia", "Hiperreflexia, hipertrofia e hipertonia", "Normorreflexia, atrofia e hipertonia", "Reflexo pendular, hipertrofia e hipotonia"], "correct": 0, "fixed": false, "note": null, "comment": "Síndrome do 2º neurônio motor: hiporreflexia ou arreflexia, atrofia, hipotonia e fasciculações."}, {"id": "p14-20", "topic": "Neurologia", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 20, "ctx": null, "stem": "A avaliação do tônus muscular é de grande importância no exame neurológico. A hipertonia plástica, com o sinal clássico da \"roda denteada\", ou seja, resistência à movimentação passiva de forma contínua é vista em qual síndrome neurológica?", "opts": ["Extra piramidal", "Meningea", "Cerebelar", "Piramidal"], "correct": 0, "fixed": false, "note": null, "comment": "A hipertonia plástica com roda denteada é da síndrome extrapiramidal hipocinética (parkinsoniana). A piramidal causa hipertonia elástica (canivete)."}, {"id": "p01-11", "topic": "Abdome", "prova": "T32 · 1ª VA", "sort": [32, 1], "n": 11, "ctx": null, "stem": "Paciente de 25 anos apresenta dor abdominal iniciada em região periumbilical, migrando para fossa ilíaca direita, associada a náuseas, vômitos e febre. Ao exame físico: dor localizada em fossa ilíaca direita, defesa muscular e sinal de descompressão brusca positivo. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo obstrutivo", "Abdome agudo perfurativo.", "Abdome agudo inflamatório.", "Abdome agudo isquêmico."], "correct": 2, "fixed": false, "note": null, "comment": "Dor periumbilical que migra para a fossa ilíaca direita, com febre e Blumberg: apendicite aguda. Síndrome inflamatória: dor de instalação progressiva, localizada no órgão acometido, com febre e irritação peritoneal localizada (defesa, Blumberg, Murphy). Descartes: perfurativo (início súbito, abdome em tábua, Jobert), obstrutivo (cólica, distensão, parada de flatos), isquêmico (dor desproporcional ao exame, sem peritonite) e hemorrágico (choque, palidez, sem febre)."}, {"id": "p01-12", "topic": "Abdome", "prova": "T32 · 1ª VA", "sort": [32, 1], "n": 12, "ctx": null, "stem": "Paciente de 58 anos, com antecedente de cirurgia abdominal prévia, apresenta dor abdominal em cólica, distensão abdominal, vômitos fecais e parada de eliminação de fezes e flatos. Ao exame: abdome distendido, timpanismo difuso e ruídos hidroaéreos metálicos. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo inflamatório.", "Abdome agudo perfurativo.", "Abdome agudo obstrutivo.", "Abdome agudo hemorrágico."], "correct": 2, "fixed": false, "note": null, "comment": "Cirurgia abdominal prévia (bridas), vômitos fecais, parada de flatos e RHA metálicos. Síndrome obstrutiva: dor em cólica, distensão, vômitos (que podem ficar fecaloides) e parada de eliminação de fezes e flatos, com timpanismo e ruídos hidroaéreos aumentados e metálicos. Sem irritação peritoneal no início. Causas: bridas pós-cirúrgicas, hérnias encarceradas, tumores, volvo."}, {"id": "p01-13", "topic": "Abdome", "prova": "T32 · 1ª VA", "sort": [32, 1], "n": 13, "ctx": null, "stem": "Paciente de 72 anos, portador de fibrilação atrial crônica e hipertensão arterial, apresenta dor abdominal súbita, de forte intensidade (10/10), iniciada há cerca de 6 horas, difusa e contínua. Refere náuseas, sem vômitos e ausência de evacuação desde o início do quadro. Ao exame físico: paciente em estado geral regular, ansioso, PA 90x60 mmHg, FC 118 bpm, ritmo irregular, FR 24 irpm. O abdome encontra-se discretamente distendido, com dor difusa à palpação, porém sem defesa muscular ou sinais de irritação peritoneal. Ruídos hidroaéreos diminuídos. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo inflamatório", "Abdome agudo isquêmico.", "Abdome agudo obstrutivo.", "Abdome agudo perfurativo"], "correct": 1, "fixed": false, "note": null, "comment": "Fibrilação atrial, dor súbita 10/10 com abdome pouco doloroso e sem peritonite. Síndrome isquêmica (isquemia mesentérica aguda): dor súbita, intensa e desproporcional ao exame físico (abdome pouco doloroso, sem peritonite no início), em paciente com fonte embólica (fibrilação atrial/arritmia) ou aterosclerose, com RHA diminuídos e instabilidade hemodinâmica. Diferente do perfurativo, não há abdome em tábua nem Jobert."}, {"id": "p01-14", "topic": "Abdome", "prova": "T32 · 1ª VA", "sort": [32, 1], "n": 14, "ctx": null, "stem": "Mulher de 29 anos, previamente higida, com atraso menstrual de 6 semanas, apresenta dor abdominal súbita em hipogástrio, de forte intensidade, associada a rigidez, lipotimia e sensação de desmaio. Refere sangramento vaginal discreto. Ao exame físico: paciente pálida, sudorética, confusa, PA 70x40 mmHg, FC 130 bpm, FR 28 irpm. Abdome discretamente distendido, doloroso à palpação profunda em hipogástrio, sem sinais claros de rigidez peritoneal. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo inflamatório.", "Abdome agudo perfurativo.", "Abdome agudo hemorrágico.", "Abdome agudo obstrutivo"], "correct": 2, "fixed": false, "note": null, "comment": "Atraso menstrual, hipogástrio, lipotimia e PA 70x40: gravidez ectópica rota. Síndrome hemorrágica: choque hipovolêmico (hipotensão, taquicardia, palidez, lipotimia) com dor abdominal súbita e pouca ou nenhuma febre. Na mulher em idade fértil com atraso menstrual, pensar em gravidez ectópica rota. Os sinais de Cullen/Grey-Turner indicam sangue na parede abdominal/retroperitônio."}, {"id": "p01-15", "topic": "Abdome", "prova": "T32 · 1ª VA", "sort": [32, 1], "n": 15, "ctx": null, "stem": "Paciente de 50 anos, com histórico de uso crônico de anti-inflamatórios não esteroides, apresenta dor abdominal súbita, intensa, inicialmente em epígastro, evoluindo rapidamente para dor difusa. Refere náuseas e parada de eliminação de fezes e flatos. Ao exame físico: paciente em posição antálgica, sudorético, PA 90x60 mmHg, FC 118 bpm. Abdome em tábua, com dor difusa à palpação, descompressão brusca positiva e ausência de ruídos hidroaéreos. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo inflamatório.", "Abdome agudo isquêmico.", "Abdome agudo obstrutivo.", "Abdome agudo perfurativo"], "correct": 3, "fixed": false, "note": null, "comment": "Uso crônico de AINE, abdome em tábua, descompressão positiva e RHA ausentes. Síndrome perfurativa: dor súbita em 'facada' que se generaliza, abdome em tábua, descompressão brusca dolorosa difusa, RHA ausentes e perda da macicez hepática (sinal de Jobert, pneumoperitônio). Causas típicas: úlcera péptica (AINE, gastrite) e diverticulite perfurada."}, {"id": "p02-1", "topic": "Abdome", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 1, "ctx": null, "stem": "Mulher de 46 anos, obesa, refere dor em hipocôndrio direito iniciada há 24 horas, contínua, irradiada para região escapular direita, associada a náuseas, vômitos e febre. Relata piora após ingestão de alimentos gordurosos. Ao exame físico: paciente febril, dor à palpação em hipocôndrio direito, defesa localizada e sinal de Murphy positivo. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo hemorrágico.", "Abdome agudo inflamatório.", "Abdome agudo obstrutivo.", "Abdome agudo perfurativo."], "correct": 1, "fixed": false, "note": null, "comment": "Dor em hipocôndrio direito após alimento gorduroso, febre e Murphy positivo: colecistite aguda. Síndrome inflamatória: dor de instalação progressiva, localizada no órgão acometido, com febre e irritação peritoneal localizada (defesa, Blumberg, Murphy). Descartes: perfurativo (início súbito, abdome em tábua, Jobert), obstrutivo (cólica, distensão, parada de flatos), isquêmico (dor desproporcional ao exame, sem peritonite) e hemorrágico (choque, palidez, sem febre)."}, {"id": "p02-2", "topic": "Abdome", "prova": "T32 · 2ª VA", "sort": [32, 2], "n": 2, "ctx": null, "stem": "Paciente de 68 anos, com antecedente de doença diverticular dos cólons, apresenta dor abdominal súbita e intensa em fossa ilíaca esquerda, evoluindo rapidamente para dor difusa. Refere febre, náuseas e piora progressiva do estado geral. Ao exame físico: paciente taquicárdico, sudorético, com abdome rígido, em tábua, dor difusa à palpação e descompressão brusca positiva. Ruídos hidroaéreos abolidos. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo perfurativo.", "Abdome agudo hemorrágico.", "Abdome agudo inflamatório.", "Abdome agudo obstrutivo."], "correct": 0, "fixed": false, "note": null, "comment": "Doença diverticular, dor súbita em fossa ilíaca esquerda que se generaliza, abdome em tábua (diverticulite perfurada). Síndrome perfurativa: dor súbita em 'facada' que se generaliza, abdome em tábua, descompressão brusca dolorosa difusa, RHA ausentes e perda da macicez hepática (sinal de Jobert, pneumoperitônio). Causas típicas: úlcera péptica (AINE, gastrite) e diverticulite perfurada."}, {"id": "p03-1", "topic": "Abdome", "prova": "T31 · 1ª VA", "sort": [31, 1], "n": 1, "ctx": null, "stem": "Homem de 28 anos, previamente hígido, procura o pronto atendimento relatando dor abdominal iniciada há 24 horas, inicialmente em região periumbilical, que evoluiu e localizou-se na fossa ilíaca direita, tornando-se contínua e mais intensa. Refere náuseas e um episódio de vômito, além de perda do apetite. Ao exame físico, apresenta-se em bom estado geral, discretamente febril (37,8°C), com pressão arterial de 120x80 mmHg, frequência cardíaca de 96 bpm e frequência respiratória de 20 irpm. O abdome está plano, com dor localizada em fossa ilíaca direita, presença de defesa muscular e sinal de Blumberg positivo. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo inflamatório", "Abdome agudo perfurativo", "Abdome agudo obstrutivo", "Abdome agudo isquêmico"], "correct": 0, "fixed": false, "note": null, "comment": "Dor periumbilical que migra para a fossa ilíaca direita, anorexia e Blumberg: apendicite aguda. Síndrome inflamatória: dor de instalação progressiva, localizada no órgão acometido, com febre e irritação peritoneal localizada (defesa, Blumberg, Murphy). Descartes: perfurativo (início súbito, abdome em tábua, Jobert), obstrutivo (cólica, distensão, parada de flatos), isquêmico (dor desproporcional ao exame, sem peritonite) e hemorrágico (choque, palidez, sem febre)."}, {"id": "p03-2", "topic": "Abdome", "prova": "T31 · 1ª VA", "sort": [31, 1], "n": 2, "ctx": null, "stem": "Homem de 56 anos, com antecedente de duas cirurgias abdominais prévias (apendicectomia e colecistectomia), procura atendimento com dor abdominal tipo cólica há 48 horas, acompanhada de distensão abdominal progressiva, náuseas e múltiplos episódios de vômitos com conteúdo alimentar, evoluindo para aspecto fecaloide. Refere ausência de evacuações e eliminação de flatos há dois dias. Ao exame, apresenta-se desidratado (3+/4+), taquicárdico (FC 112 bpm), PA 100x70 mmHg, afebril. O abdome encontra-se distendido, com timpanismo difuso à percussão e ruídos hidroaéreos aumentados, metálicos. Não há sinais de irritação peritoneal. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo obstrutivo", "Abdome agudo isquêmico", "Abdome agudo perfurativo", "Abdome agudo inflamatório"], "correct": 0, "fixed": false, "note": null, "comment": "Duas cirurgias prévias, vômitos fecaloides, parada de flatos, RHA metálicos e sem irritação peritoneal. Síndrome obstrutiva: dor em cólica, distensão, vômitos (que podem ficar fecaloides) e parada de eliminação de fezes e flatos, com timpanismo e ruídos hidroaéreos aumentados e metálicos. Sem irritação peritoneal no início. Causas: bridas pós-cirúrgicas, hérnias encarceradas, tumores, volvo."}, {"id": "p03-3", "topic": "Abdome", "prova": "T31 · 1ª VA", "sort": [31, 1], "n": 3, "ctx": null, "stem": "Homem de 72 anos, portador de fibrilação atrial crônica, hipertensão arterial e tabagismo de longa data, procura o pronto atendimento com quadro de dor abdominal intensa, de início súbito, há cerca de 6 horas. Refere que a dor começou difusamente, sem localização específica, de forte intensidade (10/10), e não apresenta relação com alimentação. Relata náuseas, mas sem vômitos ou evacuação desde o início do quadro. Ao exame físico, o paciente encontra-se em mal estado geral, ansioso, pálido e sudorético. Pressão arterial 90x60 mmHg, frequência cardíaca 124 bpm (irregular), frequência respiratória 26 irpm, temperatura 37,2°C. O abdome é discretamente distendido, com dor difusa à palpação superficial e profunda, mas sem sinais de defesa ou irritação peritoneal evidentes. Os ruídos hidroaéreos estão diminuídos. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo isquêmico", "Abdome agudo perfurativo", "Abdome agudo inflamatório", "Abdome agudo obstrutivo"], "correct": 0, "fixed": false, "note": null, "comment": "Fibrilação atrial, dor súbita e intensa com exame abdominal pobre e hipotensão. Síndrome isquêmica (isquemia mesentérica aguda): dor súbita, intensa e desproporcional ao exame físico (abdome pouco doloroso, sem peritonite no início), em paciente com fonte embólica (fibrilação atrial/arritmia) ou aterosclerose, com RHA diminuídos e instabilidade hemodinâmica. Diferente do perfurativo, não há abdome em tábua nem Jobert."}, {"id": "p03-4", "topic": "Abdome", "prova": "T31 · 1ª VA", "sort": [31, 1], "n": 4, "ctx": null, "stem": "Mulher de 27 anos, previamente saudável, procura o pronto atendimento por dor abdominal intensa e súbita, iniciada há cerca de 2 horas, localizada em hipogástrio e acompanhada de tontura e sensação de desmaio. Refere atraso menstrual de 6 semanas e nega uso de métodos contraceptivos. Ao exame, apresenta-se em mal estado geral, pálida, sudorética, confusa, com PA 70x40 mmHg, FC 132 bpm, FR 28 irpm e temperatura 36,8°C. O abdome encontra-se discretamente distendido, doloroso à palpação profunda em hipogástrio, sem sinais de irritação peritoneal. Toque vaginal revela fundo de saco posterior abaulado e doloroso. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo hemorrágico", "Abdome agudo perfurativo", "Abdome agudo inflamatório", "Abdome agudo obstrutivo"], "correct": 0, "fixed": false, "note": null, "comment": "Atraso menstrual, choque e fundo de saco posterior abaulado e doloroso: gravidez ectópica rota. Síndrome hemorrágica: choque hipovolêmico (hipotensão, taquicardia, palidez, lipotimia) com dor abdominal súbita e pouca ou nenhuma febre. Na mulher em idade fértil com atraso menstrual, pensar em gravidez ectópica rota. Os sinais de Cullen/Grey-Turner indicam sangue na parede abdominal/retroperitônio."}, {"id": "p03-5", "topic": "Abdome", "prova": "T31 · 1ª VA", "sort": [31, 1], "n": 5, "ctx": null, "stem": "Homem de 48 anos, com histórico de gastrite crônica e uso recorrente de anti- inflamatórios não esteroides para dores articulares, procura o pronto atendimento com dor abdominal súbita e intensa há cerca de 3 horas. Refere que a dor iniciou em epigástrio, irradiando-se rapidamente para todo o abdome, de caráter contínuo e lancinante. Relata náuseas, ausência de evacuação e impossibilidade de se alimentar. Ao exame físico, encontra-se em mal estado geral, sudorético e ansioso. PA 90x60 mmHg, FC 118 bpm, FR 28 irpm, temperatura 37,5°C. O abdome está tenso, com dor difusa à palpação superficial e profunda, timpanismo generalizado à percussão e sinais de irritação peritoneal evidentes, com descompressão brusca dolorosa positiva em todos os quadrantes. Os ruídos hidroaéreos estão ausentes. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo perfurativo", "Abdome agudo isquêmico", "Abdome agudo inflamatório", "Abdome agudo hemorrágico"], "correct": 0, "fixed": false, "note": null, "comment": "Uso de AINE e gastrite, dor súbita epigástrica que se generaliza, abdome tenso e RHA ausentes. Síndrome perfurativa: dor súbita em 'facada' que se generaliza, abdome em tábua, descompressão brusca dolorosa difusa, RHA ausentes e perda da macicez hepática (sinal de Jobert, pneumoperitônio). Causas típicas: úlcera péptica (AINE, gastrite) e diverticulite perfurada."}, {"id": "p04-15", "topic": "Abdome", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 15, "ctx": null, "stem": "Homem de 45 anos, etilista, apresenta dor abdominal em epigástrio, após ingestão alcoólica. Abdome pouco distendido, dor em epigástrio, ruídos hidroaéreos diminuídos, e observa-se o sinal de Jobert positivo. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo obstrutivo", "Abdome agudo inflamatório", "Abdome agudo perfurativo", "Abdome agudo hemorrágico"], "correct": 2, "fixed": false, "note": null, "comment": "Dor epigástrica e sinal de Jobert positivo (perda da macicez hepática por pneumoperitônio). Síndrome perfurativa: dor súbita em 'facada' que se generaliza, abdome em tábua, descompressão brusca dolorosa difusa, RHA ausentes e perda da macicez hepática (sinal de Jobert, pneumoperitônio). Causas típicas: úlcera péptica (AINE, gastrite) e diverticulite perfurada."}, {"id": "p04-16", "topic": "Abdome", "prova": "T31 · 2ª VA", "sort": [31, 2], "n": 16, "ctx": null, "stem": "Mulher de 63 anos com hérnia inguinal encarcerada, distensão abdominal, vômitos biliosos e ausência de eliminação de flatos. Abdome distendido e timpanismo difuso. Qual o diagnóstico sindrômico?", "opts": ["Abdome agudo inflamatório", "Abdome agudo obstrutivo", "Abdome agudo isquêmico", "Abdome agudo perfurativo"], "correct": 1, "fixed": false, "note": null, "comment": "Hérnia inguinal encarcerada, vômitos biliosos e parada de flatos. Síndrome obstrutiva: dor em cólica, distensão, vômitos (que podem ficar fecaloides) e parada de eliminação de fezes e flatos, com timpanismo e ruídos hidroaéreos aumentados e metálicos. Sem irritação peritoneal no início. Causas: bridas pós-cirúrgicas, hérnias encarceradas, tumores, volvo."}, {"id": "p05-6", "topic": "Abdome", "prova": "T30 · 1ª VA", "sort": [30, 1], "n": 6, "ctx": null, "stem": "Paciente (19 anos), sexo feminino, chega ao pronto socorro relatando que após discutir com o seu namorado apresentou desmaio. Foi trazida pela equipe do SAMU que, ao passar o paciente para a equipe médica da Santa Casa, descreve que a vítima foi encontrada inconsciente, com sinais de hipotensão (PA=70/40mmHg), taquicardia, pulso fino e filiforme, sinal de Proust positivo.", "opts": ["Abdome agudo perfurativo/úlcera perfurada.", "Abdome agudo obstrutivo/bridas.", "Abdome agudo hemorrágico/colecistite aguda.", "Abdome agudo hemorrágico/gravidez tubária rota."], "correct": 3, "fixed": false, "note": null, "comment": "Jovem com síncope, hipotensão, pulso filiforme e sinal de Proust (fundo de saco abaulado): ectópica rota. Síndrome hemorrágica: choque hipovolêmico (hipotensão, taquicardia, palidez, lipotimia) com dor abdominal súbita e pouca ou nenhuma febre. Na mulher em idade fértil com atraso menstrual, pensar em gravidez ectópica rota. Os sinais de Cullen/Grey-Turner indicam sangue na parede abdominal/retroperitônio."}, {"id": "p05-7", "topic": "Abdome", "prova": "T30 · 1ª VA", "sort": [30, 1], "n": 7, "ctx": null, "stem": "Paciente de 10 anos, sexo masculino, leucoderma, procurou atendimento acompanhado de sua mãe apresentando como queixas principais: \"dor na barriga e vômitos\". Ao ser admitido no hospital universitário, apresentava quadro de dor que havia iniciado há três dias na região peri-umbilical, e no momento irradiava em direção à fossa ilíaca direita. Essa dor apresentava-se de forma contínua com característica de cólicas, com alívio em posição de cócoras e piora com movimentação e tosse.", "opts": ["Abdome agudo perfurativo/sinal de Oubler.", "Abdome agudo obstrutivo/sinal de Kussmaul.", "Abdome agudo inflamatório/sinal de Dumply.", "Abdome agudo inflamatório/sinal de Venanetér."], "correct": 2, "fixed": false, "note": null, "comment": "Criança com dor periumbilical que migra para a fossa ilíaca direita, piora com tosse e movimento: apendicite aguda. Síndrome inflamatória: dor de instalação progressiva, localizada no órgão acometido, com febre e irritação peritoneal localizada (defesa, Blumberg, Murphy). Descartes: perfurativo (início súbito, abdome em tábua, Jobert), obstrutivo (cólica, distensão, parada de flatos), isquêmico (dor desproporcional ao exame, sem peritonite) e hemorrágico (choque, palidez, sem febre)."}, {"id": "p05-8", "topic": "Abdome", "prova": "T30 · 1ª VA", "sort": [30, 1], "n": 8, "ctx": null, "stem": "Paciente do sexo masculino, 47 anos, tabagista (3 maços/dia), refere que há 12h iniciou com quadro de dor na barriga, localizada na boca do estômago, e posteriormente caminhou para todo o abdome, tornando-se contínua, sem fatores atenuantes, e que piora com a alimentação e a deambulação, acompanhada de vômitos amarelados, sudorese e mal-estar geral. Abdome com sinais de irritação peritoneal difusa com timpanismo difuso. HP: Artrose em coluna e faz uso rotineiro de medicações anti-inflamatórias, relata ainda gastrite. Os aparelhos cardiovasculares e respiratórios já foram examinados e estão normais.", "opts": ["Abdome agudo perfurativo/sinal de Obert/pancreatite aguda.", "Abdome agudo perfurativo/sinal de Obert/úlcera perfurada.", "Abdome agudo inflamatório/sinal de Dumply/colecistite aguda.", "Abdome agudo inflamatório/sinal de Venanetér/apendicite aguda."], "correct": 1, "fixed": false, "note": null, "comment": "AINE e gastrite, dor epigástrica que se generaliza, irritação peritoneal difusa (úlcera perfurada). Síndrome perfurativa: dor súbita em 'facada' que se generaliza, abdome em tábua, descompressão brusca dolorosa difusa, RHA ausentes e perda da macicez hepática (sinal de Jobert, pneumoperitônio). Causas típicas: úlcera péptica (AINE, gastrite) e diverticulite perfurada."}, {"id": "p05-9", "topic": "Abdome", "prova": "T30 · 1ª VA", "sort": [30, 1], "n": 9, "ctx": null, "stem": "Ao exame físico abdominal, auscultaram-se ruídos metálicos. Este sinal relaciona-se geralmente à:", "opts": ["Aumento da peristalse intestinal por uma diarreia.", "Diminuição da peristalse por apendicite.", "Sinais de irritação peritoneal.", "Obstrução intestinal."], "correct": 3, "fixed": false, "note": null, "comment": "Ruídos hidroaéreos metálicos (timbre de 'tinido') indicam aumento da peristalse contra obstáculo mecânico: obstrução intestinal. Na peritonite e no íleo adinâmico os ruídos diminuem ou desaparecem; na diarreia há aumento sem timbre metálico."}, {"id": "p05-10", "topic": "Abdome", "prova": "T30 · 1ª VA", "sort": [30, 1], "n": 10, "ctx": null, "stem": "A tríade de Charcot consiste em e é característica de .", "opts": ["Dor em hipocôndrio esquerdo, icterícia, febre com calafrios; pancreatite.", "Dor em hipocôndrio direito, icterícia, febre com calafrios; colecistite aguda.", "Dor em epigástrio, icterícia, febre com calafrios; pancreatite.", "Dor em hipocôndrio direito, icterícia, febre com calafrios; colangite."], "correct": 3, "fixed": false, "note": null, "comment": "Tríade de Charcot: dor em hipocôndrio direito, icterícia e febre com calafrios, típica de colangite aguda (obstrução biliar infectada). Com hipotensão e confusão forma-se a pêntade de Reynolds (colangite grave). Dor em hipocôndrio direito sem icterícia sugere colecistite; dor epigástrica em faixa sugere pancreatite."}, {"id": "p06-19", "topic": "Abdome", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 19, "ctx": null, "stem": "Paciente de 65 anos com fibrilação atrial e histórico de infarto agudo do miocárdio, apresenta dor abdominal difusa súbita há 10 horas, náuseas, vômitos e hipotensão (PA=80/40 mmHg).", "opts": ["Abdome agudo obstrutivo.", "Abdome agudo isquêmico.", "Abdome agudo inflamatório.", "Abdome agudo perfurativo."], "correct": 1, "fixed": false, "note": null, "comment": "Fibrilação atrial e infarto prévio, dor difusa súbita e hipotensão. Síndrome isquêmica (isquemia mesentérica aguda): dor súbita, intensa e desproporcional ao exame físico (abdome pouco doloroso, sem peritonite no início), em paciente com fonte embólica (fibrilação atrial/arritmia) ou aterosclerose, com RHA diminuídos e instabilidade hemodinâmica. Diferente do perfurativo, não há abdome em tábua nem Jobert."}, {"id": "p06-20", "topic": "Abdome", "prova": "T30 · 2ª VA", "sort": [30, 2], "n": 20, "ctx": null, "stem": "Paciente de 56 anos com hematêmese, melena, ascite, circulação colateral visível e esplenomegalia.", "opts": ["Hipertensão Portal.", "Varizes esofágicas.", "Hemorragia Digestiva Alta.", "Abdome agudo hemorrágico."], "correct": 3, "fixed": false, "note": "Gabarito oficial D (abdome agudo hemorrágico), mas o quadro (hematêmese, melena, ascite, circulação colateral, esplenomegalia) é o clássico de hipertensão portal/HDA varicosa — alternativa discutível. Mantive o gabarito oficial.", "comment": "O quadro de hematêmese, melena, ascite, circulação colateral e esplenomegalia é o de hipertensão portal com hemorragia digestiva alta por varizes esofágicas. O gabarito oficial é D (abdome agudo hemorrágico), mas as alternativas A, B e C descrevem melhor o quadro. Mantive o oficial por regra; no estudo, guarde: ascite + circulação colateral + esplenomegalia = hipertensão portal."}, {"id": "p07-2", "topic": "Abdome", "prova": "T25 · 1ª VA", "sort": [25, 1], "n": 2, "ctx": null, "stem": "Paciente 48 anos, sexo feminino, apresenta há 2 anos dor tipo cólica em hipocôndrio direito, com duração de 4 minutos, de ocorrência ao mensal, após ingestão de alimentos fritos. Há 12 horas iniciou novamente com o quadro de dor abdominal agora continua tipo cólica, localizada no hipocôndrio direito, com irradiação para região subescapular. Associado a dor apresentou vômitos (4 episódios) de característica amarelada e febre (38°C). G4P4A2. - Ao exame físico: Regular estado geral, fácies de dor, corada, anictérica, acianótica, desidratada 3+/4+. FC: 120 bpm, FR: 24 irpm; Tax=38°C, PA=120/70 mmHg. - ACV: RCR 2T, Bulhas normofonéticas, sem sopros. Frequência de Pulso: 120 bpm. - Ar: murmúrio vesicular fisiológico e simétrico sem ruídos adventícios. - Abdome globoso, peristalse ausente, macicez hepática preservada, doloroso à palpação em andar superior do abdômen, Sinal de Murphy presente. Os dados de anamnese e exame físico sugerem qual das síndromes abaixo?", "opts": ["Abdome agudo inflamatória.", "Abdome agudo isquêmico.", "Abdome agudo obstrutivo.", "Abdome agudo perfurativo."], "correct": 0, "fixed": false, "note": null, "comment": "Cólica em hipocôndrio direito após fritura, febre, Murphy: colecistite aguda. Síndrome inflamatória: dor de instalação progressiva, localizada no órgão acometido, com febre e irritação peritoneal localizada (defesa, Blumberg, Murphy). Descartes: perfurativo (início súbito, abdome em tábua, Jobert), obstrutivo (cólica, distensão, parada de flatos), isquêmico (dor desproporcional ao exame, sem peritonite) e hemorrágico (choque, palidez, sem febre)."}, {"id": "p07-3", "topic": "Abdome", "prova": "T25 · 1ª VA", "sort": [25, 1], "n": 3, "ctx": null, "stem": "Paciente 70 anos, sexo masculino, com quadro de dor abdominal intensa e de inicio súbito, com cerca de 06 horas de evolução. Refere uso recorrente de medicação do tipo anti-inflamatório para poliartralgia. - Ao exame físico: Mau estado geral, acianótico, anictérico, desidratado 3+/4+, FC: 130 bpm; FR: 26 irpm, Tax=37,5°C, PA=90/60 mmHg. - ACV: RCR 2T, Bulhas normofonéticas, sem sopros. Frequências de Pulso: 130 bpm. - AR: Tórax atípico, Murmúrio Vesicular presente sem Ruídos Adventícios. - Abdome tenso, peristalse ausente, ausência de cicatrizes visíveis, sinal de Jobert presente, doloroso a palpação difusamente, com sinais de descompressão brusca dolorosa nos quatro quadrantes. Os dados de anamnese e exame físico sugerem qual das síndromes abaixo?", "opts": ["Abdome agudo inflamatório.", "Abdome agudo perfurativo.", "Abdome agudo hemorrágico.", "Abdome agudo isquêmico."], "correct": 1, "fixed": false, "note": null, "comment": "Uso de anti-inflamatório, abdome tenso, Jobert e descompressão dolorosa nos 4 quadrantes. Síndrome perfurativa: dor súbita em 'facada' que se generaliza, abdome em tábua, descompressão brusca dolorosa difusa, RHA ausentes e perda da macicez hepática (sinal de Jobert, pneumoperitônio). Causas típicas: úlcera péptica (AINE, gastrite) e diverticulite perfurada."}, {"id": "p07-4", "topic": "Abdome", "prova": "T25 · 1ª VA", "sort": [25, 1], "n": 4, "ctx": null, "stem": "Paciente 75 anos, sexo masculino, com quadro clínico de dor abdominal com forte intensidade (10+/10+), difusa com início há 02 horas. Tabagista (10 cigarros/dia há 30 anos) e etilista. Cardiopata e hipertenso em uso irregular de antiarritmico. - Ao exame físico: Mau estado geral, fácies de dor, em posição antálgica, anictérico, acianótico. FC: 130 bpm; FR: 23 irpm; Tax=37,5°C, PA=50/30mmHg. - ACV: RCI Bulhas hipofonéticas, sem sopros. Frequências de Pulso: 60 bpm. - AR: Tórax em tonel, expansibilidade diminuída universalmente, amplitude diminuída, dispneico, sem tiragem; FTV diminuído globalmente, Murmúrio Vesicular presente sem Ruídos Adventícios. - Abdome globoso, peristalse ausente, timpanismo difuso, macicez hepática preservada, ausência de visceromegalias e ou massas palpáveis, abdome pouco doloroso á palpação, ausência de sinais de descompressão brusca dolorosos. Os dados de anamnese e exame físico sugerem qual das síndromes abaixo?", "opts": ["Abdome agudo hemorrágico.", "Abdome agudo perfurativo.", "Abdome agudo obstrutivo.", "Abdome agudo isquêmico."], "correct": 3, "fixed": false, "note": null, "comment": "Tabagista, dor 10/10 difusa, abdome pouco doloroso à palpação e sem descompressão dolorosa. Síndrome isquêmica (isquemia mesentérica aguda): dor súbita, intensa e desproporcional ao exame físico (abdome pouco doloroso, sem peritonite no início), em paciente com fonte embólica (fibrilação atrial/arritmia) ou ateros
