ed": false, "note": null, "comment": "Cólica em hipocôndrio direito após fritura, febre, Murphy: colecistite aguda. Síndrome inflamatória: dor de instalação progressiva, localizada no órgão acometido, com febre e irritação peritoneal localizada (defesa, Blumberg, Murphy). Descartes: perfurativo (início súbito, abdome em tábua, Jobert), obstrutivo (cólica, distensão, parada de flatos), isquêmico (dor desproporcional ao exame, sem peritonite) e hemorrágico (choque, palidez, sem febre)."}, {"id": "p11-3", "topic": "Abdome", "prova": "T29 · 1ª VA", "sort": [29, 1], "n": 3, "ctx": null, "stem": "José, sexo masculino, com quadro de dor abdominal intensa e de inicio súbito, com cerca de 06 horas de evolução. Refere uso recorrente de medicação do tipo anti-inflamatório para poliartralgia. Ao exame físico: Mau estado geral, acianótico, anictérico, desidratado 3+/4+, FC: 130 bpm; FR: 26 irpm; Tax=37,5°C, PA=90/60 mmHg. ACV: RCR 2T, Bulhas normofonéticas, sem sopros. Frequência de Pulso: 130 bpm. AR: Tórax atípico, Murmúrio Vesicular presente sem Ruídos Adventícios. Abdome tenso, peristalse ausente, ausência de cicatrizes visíveis, sinal de Jobert presente, doloroso à palpação difusamente, com sinais de descompressão brusca dolorosa nos quatro quadrantes. Os dados de anamnese e exame físico sugerem qual das síndromes abaixo?", "opts": ["Abdome agudo inflamatório", "Abdome agudo perfurativo", "Abdome agudo hemorrágico", "Abdome agudo isquêmico"], "correct": 1, "fixed": false, "note": null, "comment": "Uso de anti-inflamatório, abdome tenso, Jobert e descompressão dolorosa nos 4 quadrantes. Síndrome perfurativa: dor súbita em 'facada' que se generaliza, abdome em tábua, descompressão brusca dolorosa difusa, RHA ausentes e perda da macicez hepática (sinal de Jobert, pneumoperitônio). Causas típicas: úlcera péptica (AINE, gastrite) e diverticulite perfurada."}, {"id": "p11-4", "topic": "Abdome", "prova": "T29 · 1ª VA", "sort": [29, 1], "n": 4, "ctx": null, "stem": "Sebastião, sexo masculino, com quadro clínico de dor abdominal com forte intensidade (10+/10+), difusa, com início há 02 horas. Tabagista (10 cigarros/dia há 30 anos) e etilisita. Cardiopata e hipertenso em uso irregular de antiarrítmico Ao exame físico: Mau estado geral, fácies de dor, em posição antálgica, anictérico, acianótico. FC: 130 bpm; FR: 23 irpm; Tax=37,5°C, PA=50/30mmHg ACV: RCI Bulhas hipofonéticas, sem sopros. Frequência de Pulso: 60 bpm. AR: Tórax em tonel, expansibilidade diminuída universalmente, amplitude diminuída, dispneico, sem tiragem; FTV diminuído globalmente; Murmúrio Vesicular presente sem Ruídos Adventícios Abdome globoso, peristalse ausente, timpanismo difuso, macicez hepática preservada, ausência de visceromegalias e ou massas palpáveis, abdome pouco doloroso à palpação, ausência de sinais de descompressão brusca dolorosos. Os dados de anamnese e exame físico sugerem qual das síndromes abaixo?", "opts": ["Abdome agudo hemorrágico", "Abdome agudo perfurativo", "Abdome agudo obstrutivo", "Abdome agudo isquêmico"], "correct": 3, "fixed": false, "note": null, "comment": "Dor 10/10 difusa, abdome pouco doloroso e sem descompressão dolorosa. Síndrome isquêmica (isquemia mesentérica aguda): dor súbita, intensa e desproporcional ao exame físico (abdome pouco doloroso, sem peritonite no início), em paciente com fonte embólica (fibrilação atrial/arritmia) ou aterosclerose, com RHA diminuídos e instabilidade hemodinâmica. Diferente do perfurativo, não há abdome em tábua nem Jobert."}, {"id": "p11-5", "topic": "Abdome", "prova": "T29 · 1ª VA", "sort": [29, 1], "n": 5, "ctx": null, "stem": "Mariana 60 anos, sexo feminino, com quadro clínico de dor abdominal em cólica, distensão abdominal, vômitos fétidos, há quatro dias. Relata obstipação há dois dias. Tabagista (10 cigarros/dia há 30 anos). Cardiopata em uso irregular de anti hipertensivo. Ao exame físico: Regular estado geral, acianótica, anictérica, desidratada 3+/4+ FC: 100 bpm; FR: 19 irpm; Tax=37°C, PA= 120/70 mmHg ACV: RCR 3T, Bulhas normofonéticas, sem sopros. Frequência de Pulso: 96 bpm. AR: Tórax em tonel, expansibilidade diminuída universalmente, amplitude diminuída, dispneico, sem tiragem; FTV diminuído globalmente; Murmúrio Vesicular presente sem ruídos adventícios. Abdome distendido, lesão cicatricial em hipocôndrio direito, RHA aumentados (sons metálicos) em quadrante superior direito e peristalse ausente nos demais quadrantes, doloroso à palpação difusa, timpanismo difuso. Os dados de anamnese e exame físico sugerem qual das síndromes abaixo?", "opts": ["Abdome agudo obstrutivo", "Abdome agudo hemorrágico", "Abdome agudo inflamatório", "Abdome agudo perfurativo"], "correct": 0, "fixed": false, "note": null, "comment": "Cicatriz cirúrgica, vômitos fétidos, obstipação, distensão e RHA metálicos. Síndrome obstrutiva: dor em cólica, distensão, vômitos (que podem ficar fecaloides) e parada de eliminação de fezes e flatos, com timpanismo e ruídos hidroaéreos aumentados e metálicos. Sem irritação peritoneal no início. Causas: bridas pós-cirúrgicas, hérnias encarceradas, tumores, volvo."}, {"id": "p11-6", "topic": "Abdome", "prova": "T29 · 1ª VA", "sort": [29, 1], "n": 6, "ctx": null, "stem": "Marina de 33 anos, sexo feminino, admitida com quadro clínico de dor abdominal, de início há 3 horas, de localização em hipogastro, de intensidade moderada. Relata atraso menstrual de dois meses. Ao exame físico: Mau estado geral, sonolenta, hipocorada (3+/4+), anictérica, acianótica, desidratada 3+/4+. FC: 140 bpm; FR: 25 irpm; Tax=37°C, PA=60/20mmHg ACV: RCR 2T, Bulhas normofonéticas, sem sopros. Frequência de Pulso: 140 bpm. Ar: murmúrio vesicular fisiológico e simétrico sem ruídos adventícios Abdome pouco distendido, sinal de Grey-turner, peristalse ausente, macicez hepática preservada, doloroso a palpação de hipogastro Os dados de anamnese e exame físico sugerem qual das síndromes abaixo?", "opts": ["Abdome agudo inflamatório", "Abdome agudo isquêmico", "Abdome agudo hemorrágico", "Abdome agudo obstrutivo"], "correct": 1, "fixed": false, "note": "A mesma vinheta aparece na prova T25 (1ª VA) com gabarito C (hemorrágico). Aqui o gabarito oficial é B (isquêmico), mas o quadro (atraso menstrual, hipotensão grave, sinal de Grey-Turner) é de abdome agudo hemorrágico. Mantive o gabarito oficial.", "comment": "Pelo raciocínio clínico: atraso menstrual, dor em hipogástrio, hipotensão grave (60/20) e sinal de Grey-Turner indicam sangramento intra-abdominal, ou seja, abdome agudo hemorrágico (gravidez ectópica rota). Mesmo assim, o gabarito oficial desta prova é B (isquêmico); na prova T25 a mesma vinheta tem gabarito C. Mantive o oficial por regra, mas estude pela lógica clínica."}, {"id": "p12-1", "topic": "Abdome", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 1, "ctx": null, "stem": "Paciente 70 anos, sexo feminino, apresenta quadro de dor abdominal contínua tipo pontada, localizada na fossa ilíaca esquerda, há 12 horas. Associado à dor apresentou vômitos (2 episódios) com restos alimentares e febre. G4P4A2. Ao exame físico: Regular estado geral, fácies de dor, corada, anictérica, acianótica, desidratada 3+/4+. FC: 120 bpm, FR: 24 irpm, Tax=39°C, PA=120/70 mmHg. ACV: RCR 2T, Bulhas normofonéticas, sem sopros. Frequencia de Pulso: 120 bpm. AR: murmúrio vesicular fisiológico e simétrico sem ruídos adventícios. Abdome globoso, peristalse ausente, maciez hepática preservada, doloroso à palpação profunda e descompressão brusca dolorosa da fossa ilíaca esquerda. Os dados de anamnese e exame físico sugerem qual das síndromes abaixo?", "opts": ["Abdome agudo hemorrágico", "Abdome agudo isquêmico", "Abdome agudo perfurativo", "Abdome agudo inflamatório"], "correct": 3, "fixed": false, "note": null, "comment": "Dor em fossa ilíaca esquerda com febre e descompressão dolorosa localizada: diverticulite aguda. Síndrome inflamatória: dor de instalação progressiva, localizada no órgão acometido, com febre e irritação peritoneal localizada (defesa, Blumberg, Murphy). Descartes: perfurativo (início súbito, abdome em tábua, Jobert), obstrutivo (cólica, distensão, parada de flatos), isquêmico (dor desproporcional ao exame, sem peritonite) e hemorrágico (choque, palidez, sem febre)."}, {"id": "p12-2", "topic": "Abdome", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 2, "ctx": null, "stem": "Paciente 75 anos, sexo masculino, com quadro clínico de dor abdominal súbita há 02 horas, difusa, com início há 02 horas. Tabagista (10 cigarros/dia há 30 anos) e etilista. Cardiopata e hipertenso Ao exame físico: Mau estado geral, sonolento, anictérico, acianótico. FC: 130 bpm; FR: 23 irpm; Tax=37,5°C, PA=50/30mmHg. ACV: RCR Bulhas hipofonéticas, sem sopros. Frequências de Pulso: 130 bpm. AR: Tiragem em tonel, expansibilidade diminuída universalmente, amplitude diminuída, dispneico, sem tiragem, FTV diminuído globalmente; Murmúrio Vesicular presente sem Ruídos Adventícios. Abdome globoso, peristalse ausente, timpanismo difuso, maciez hepática preservada, massa pulsátil em hipogastro, abdome pouco doloroso à palpação, ausência de sinais de descompressão brusca dolorosos Os dados de anamnese e exame físico sugerem qual das síndromes abaixo?", "opts": ["Abdome agudo hemorrágico", "Abdome agudo perfurativo", "Abdome agudo obstrutivo", "Abdome agudo Isquêmico"], "correct": 0, "fixed": false, "note": null, "comment": "Massa pulsátil em hipogástrio em idoso tabagista: aneurisma de aorta abdominal roto. Síndrome hemorrágica: choque hipovolêmico (hipotensão, taquicardia, palidez, lipotimia) com dor abdominal súbita e pouca ou nenhuma febre. Na mulher em idade fértil com atraso menstrual, pensar em gravidez ectópica rota. Os sinais de Cullen/Grey-Turner indicam sangue na parede abdominal/retroperitônio."}, {"id": "p13-17", "topic": "Abdome", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 17, "ctx": null, "stem": "Paciente de 28 anos, previamente hígido, chega ao pronto-socorro queixando de intensa dor abdominal. Refere início de dor contínua na região epigástrica e hipocôndrio direito há 8 horas, que aumentou de intensidade (neste momento 7/10), acompanhada de vômitos alimentares e parada da eliminação de gases e fezes. Você constata que há moderada distensão abdominal, rigidez acentuada da parede abdominal; dor à palpação profunda de todo o abdômen com descompressão brusca dolorosa presente, além da presença de timpanismo à percussão em todo o abdômen, incluindo o hipocôndrio direito. RHA ausentes. Qual a síndrome mais provável neste caso?", "opts": ["abdome agudo perfurativo", "abdome agudo inflamatório", "abdome agudo obstrutivo", "abdome agudo isquêmico"], "correct": 0, "fixed": false, "note": null, "comment": "Dor epigástrica que se intensifica, rigidez acentuada, descompressão dolorosa e timpanismo até o hipocôndrio direito. Síndrome perfurativa: dor súbita em 'facada' que se generaliza, abdome em tábua, descompressão brusca dolorosa difusa, RHA ausentes e perda da macicez hepática (sinal de Jobert, pneumoperitônio). Causas típicas: úlcera péptica (AINE, gastrite) e diverticulite perfurada."}, {"id": "p13-19", "topic": "Abdome", "prova": "T27 · 2ª VA", "sort": [27, 2], "n": 19, "ctx": null, "stem": "Paciente do sexo feminino, 38 anos, com história de “pedra na vesícula”. Procurou o Pronto Socorro com dor abdominal de forte intensidade em região epigástrica, início há 10 horas, em faixa, associada a vômitos incoercíveis, equimose em região lombar e distensão abdominal. Quais os diagnósticos sindrômicos, nosológicos e etiológicos, respectivamente?", "opts": ["síndromes de abdome agudo inflamatório e obstrutivo, colecistite aguda, coledocolitíase", "síndromes de abdome agudo obstrutivo e isquêmico, obstrução intestinal, tumor de cólon", "síndromes de abdome agudo perfurativo e hemorrágico, úlcera péptica perfurada, colecistolitíase", "síndromes de abdome agudo inflamatório e hemorrágico, pancreatite aguda grave, colecistolitíase"], "correct": 3, "fixed": false, "note": null, "comment": "Dor epigástrica em faixa, vômitos incoercíveis, litíase biliar prévia e equimose lombar (sinal de Grey-Turner) indicam pancreatite aguda biliar grave. Combina componente inflamatório (pancreatite) e hemorrágico (necro-hemorrágica, com sangue no retroperitônio). Etiologia: cálculo biliar."}, {"id": "p14-5", "topic": "Abdome", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 5, "ctx": null, "stem": "Paciente de 90 anos, com antecedentes de Fibrilação Atrial e Acidente Vascular Encefálico prévio dá entrada em unidade de emergência, com dor abdominal de início agudo, em forte intensidade, há cerca de três horas. Ao exame físico, apresenta ausculta cardíaca sugerindo ritmo cardíaco irregular, abdome levemente doloroso à palpação, sem sinais de irritação peritoneal, sinal de Jobert negativo, RHA diminuídos. Qual a hipótese diagnóstica mais provável?", "opts": ["Abdome agudo inflamatório", "Abdome agudo isquêmico", "Abdome agudo perfurativo", "Abdome agudo obstrutivo"], "correct": 1, "fixed": false, "note": null, "comment": "Fibrilação atrial e AVE prévio, dor intensa de início agudo, Jobert negativo e sem irritação peritoneal. Síndrome isquêmica (isquemia mesentérica aguda): dor súbita, intensa e desproporcional ao exame físico (abdome pouco doloroso, sem peritonite no início), em paciente com fonte embólica (fibrilação atrial/arritmia) ou aterosclerose, com RHA diminuídos e instabilidade hemodinâmica. Diferente do perfurativo, não há abdome em tábua nem Jobert."}, {"id": "p14-6", "topic": "Abdome", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 6, "ctx": null, "stem": "Mulher de 28 anos dá entrada em unidade de pronto-atendimento com quadro de dor abdominal de início súbito e lancinante há 30 minutos, inicialmente em hipogastro irradiando- se para todo o abdome. Refere diagnóstico de síndrome do \"ovário policístico\" e endometriose. Não sabe relatar a data da última menstruação. Ao exame clínico, o médico verifica taquicardia, taquipneia, hipotensão arterial e confusão mental. Palidez cutânea mucosa e abdome doloroso à palpação profunda, sinal de Jobert negativo, ausência de ruídos hidroaéreos auscultáveis. Qual a hipótese diagnóstica mais provável?", "opts": ["Abdome agudo perfurativo", "Abdome agudo obstrutivo", "Abdome agudo isquêmico", "Abdome agudo hemorrágico"], "correct": 3, "fixed": false, "note": null, "comment": "Mulher com dor súbita em hipogástrio, hipotensão, confusão e palidez: choque hipovolêmico. Síndrome hemorrágica: choque hipovolêmico (hipotensão, taquicardia, palidez, lipotimia) com dor abdominal súbita e pouca ou nenhuma febre. Na mulher em idade fértil com atraso menstrual, pensar em gravidez ectópica rota. Os sinais de Cullen/Grey-Turner indicam sangue na parede abdominal/retroperitônio."}, {"id": "p01-3", "topic": "Demência", "prova": "T32 · 1ª VA", "sort": [32, 1], "n": 3, "ctx": null, "stem": "Você é o médico da ESF em cidade do interior e foi chamado para realizar uma consulta domiciliar de um idoso de 78 anos de idade, com história de queda da própria altura há 3 dias. Ao chegar à casa do paciente, a filha informa que ele vem apresentando quedas frequentes, devido à tontura tipo desequilíbrio, tendo percebido que o mesmo estava \"mais lento do que o normal\" e com dificuldade para caminhar há aproximadamente 8 meses após o início de uma síndrome demencial. Refere também que o pai está muito agitado durante o sono, com gritos e pesadelos, apresentando sombras diurnas, além de estar mais desatento, apático, deprimido e com alucinações visuais, as quais não melhoraram após introdução da quetiapina há 3 meses. Qual o diagnóstico mais provável?", "opts": ["Demência por corpos de Lewy.", "Demência de Alzheimer.", "Demência vascular.", "Demência na doença de Parkinson."], "correct": 0, "fixed": false, "note": null, "comment": "Demência por corpos de Lewy: demência com flutuação, alucinações visuais, distúrbio comportamental do sono REM (pesadelos, gritos), parkinsonismo (lentidão, quedas) e sensibilidade a neurolépticos. Na DDP o parkinsonismo precede a demência por mais de 1 ano."}, {"id": "p03-13", "topic": "Demência", "prova": "T31 · 1ª VA", "sort": [31, 1], "n": 13, "ctx": null, "stem": "Paciente de 60 anos apresenta déficit da memória e alteração da atenção e concentração, comprovados por testes cognitivos de rastreio. A característica que está presente no transtorno cognitivo leve e que diferencia essa condição de um quadro de demência é a:", "opts": ["ausência de resposta ao uso de anticolinesterásicos.", "presença de incapacidade na escala de avaliação das atividades básicas de vida diária.", "presença de atrofia do hipocampo na ressonância magnética.", "manutenção da capacidade de o indivíduo desempenhar suas atividades instrumentais de vida diária."], "correct": 3, "fixed": false, "note": null, "comment": "No TCL a cognição está alterada, mas as atividades instrumentais de vida diária (finanças, remédios, compras) são mantidas. Na demência há perda de independência funcional."}, {"id": "p03-14", "topic": "Demência", "prova": "T31 · 1ª VA", "sort": [31, 1], "n": 14, "ctx": null, "stem": "Paciente de 88 anos, portador de insuficiência cardíaca, apresentou quadro de alteração da memória, orientação, afasia de Broca e alteração da função executiva associada à hemiplegia à direita, após quadro de acidente vascular cerebral isquêmico (AVCi) há um ano, mas recuperando parte da sua funcionalidade após reabilitação motora. Apresentou novo quadro de AVCi há 2 meses, evoluindo com dependência para atividades básicas e instrumentais de vida diária e piora cognitiva significativa em múltiplas funções.", "opts": ["Demência com Corpos de Lewy", "Demência Vascular", "Demência de Alzheimer", "Demência Fronto-Temporal"], "correct": 1, "fixed": false, "note": null, "comment": "Demência vascular: dois AVCs isquêmicos (afasia de Broca, hemiplegia), deterioração em degraus, déficits focais e fatores de risco vasculares, com piora cognitiva multidomínio após o novo AVC."}, {"id": "p05-11", "topic": "Demência", "prova": "T30 · 1ª VA", "sort": [30, 1], "n": 11, "ctx": null, "stem": "Enfermeira aposentada, de 81 anos, queixa-se de deficiência de memória, dificuldades para fazer compras e manusear dinheiro. Obteve as seguintes pontuações nas escalas de avaliação funcional e cognitiva: Questionário de Lawton para Atividades Instrumentais da Vida Diária (AIVD): 9 pontos, Índice de Katz para as Atividades Básicas da Vida Diária (ABVD): 6 pontos (independente). Mini-exame do Estado Mental (MEEM): 16 pontos.", "opts": ["Síndrome demencial.", "Doença de Alzheimer.", "Comprometimento cognitivo leve.", "Envelhecimento cerebral normal."], "correct": 0, "fixed": false, "note": null, "comment": "Déficit cognitivo (MEEM 16) com prejuízo nas atividades instrumentais (Lawton 9) e ABVD preservadas (Katz 6) caracteriza síndrome demencial. O diagnóstico etiológico (Alzheimer) exige mais dados, e o CCL tem funcionalidade preservada."}, {"id": "p05-12", "topic": "Demência", "prova": "T30 · 1ª VA", "sort": [30, 1], "n": 12, "ctx": null, "stem": "Paciente do sexo masculino, de 69 anos, oito anos de escolaridade, foi levado à consulta pela filha, que relatou ser o pai uma pessoa tímida e reservada, porém há oito meses estava evoluindo com muita apatia, alternando períodos de agressividade, alterações do juízo crítico como falar alto, dizer inconveniências, andar nu pela casa e comer em demasia. Obteve 24 pontos no MEEM. Nega doenças prévias e uso regular de medicamentos. Exame físico sem achados anormais. Foram solicitados exames bioquímicos e ressonância magnética do crânio, sendo que os primeiros vieram sem alterações e no segundo foi encontrado atrofia frontal bilateral significativa.", "opts": ["Demência vascular.", "Doença de Alzheimer.", "Demência por corpos de Lewy.", "Demência frontotemporal."], "correct": 3, "fixed": false, "note": null, "comment": "Demência frontotemporal (variante comportamental): apatia, agressividade, perda de juízo crítico, desinibição e hiperfagia, com memória relativamente preservada (MEEM 24) e atrofia frontal à RM."}, {"id": "p07-18", "topic": "Demência", "prova": "T25 · 1ª VA", "sort": [25, 1], "n": 18, "ctx": "Cornélia, 83 anos, sexo feminino, escolaridade de 8 anos, viúva, cozinheira aposentada, residente de uma instituição de longa permanência há 1 ano. Neste período na instituição, observou-se que a residente apresentava esquecimentos para fatos recentes e cotidianos, discurso repetitivo e desorientação no tempo e alguns episódios de desorientação espacial. Fazia confusão com as medicações, não conseguia mais preparar refeições e apresentava negligência com o autocuidado (descuido com higiene). A equipe de enfermagem noturna sempre reclamava da mesma apresentar perambulação noturna e atrapalhar o sono de outros residentes por apresentar alucinações visuais de antepassados. Não apresenta alteração ao exame físico.", "stem": "Podemos afirmar que:", "opts": ["Cornélia apresenta limitação para atividades instrumentais de vida diária.", "A escala para avaliar funcionalidade relacionada ao autocuidado é a escala de Lawton.", "A perambulação noturna e alucinações visuais são sintomas de delirium.", "A escala de depressão geriátrica (GDS) é fundamental para a conclusão diagnóstica."], "correct": 0, "fixed": false, "note": null, "comment": "A correta: esquecimentos, confusão com remédios e incapacidade de cozinhar são prejuízo em AIVD (Lawton). B errada (o autocuidado é Katz). C errada: o curso é de 1 ano e insidioso, o que é demência e não delirium. D errada: o GDS não é fundamental."}, {"id": "p07-19", "topic": "Demência", "prova": "T25 · 1ª VA", "sort": [25, 1], "n": 19, "ctx": "Cornélia, 83 anos, sexo feminino, escolaridade de 8 anos, viúva, cozinheira aposentada, residente de uma instituição de longa permanência há 1 ano. Neste período na instituição, observou-se que a residente apresentava esquecimentos para fatos recentes e cotidianos, discurso repetitivo e desorientação no tempo e alguns episódios de desorientação espacial. Fazia confusão com as medicações, não conseguia mais preparar refeições e apresentava negligência com o autocuidado (descuido com higiene). A equipe de enfermagem noturna sempre reclamava da mesma apresentar perambulação noturna e atrapalhar o sono de outros residentes por apresentar alucinações visuais de antepassados. Não apresenta alteração ao exame físico.", "stem": "Alguns testes foram aplicados a Cornélia: MEEM: 8/30; Fluência verbal 5 animais; Teste o desenho do relógio: 1/5. Alguns exames laboratoriais (hemograma, glicemia, b12, eletrólitos, vdrl, função renal, função hepática e função tireoidiana) e RNM crânio realizados foram normais. Diante do quadro clínico, dos resultados dos testes e dos exames realizados, podemos levantar como principal hipótese diagnóstica para Cornélia:", "opts": ["Demência de Alzheimer.", "Demência por corpos de Lewy.", "Demência vascular.", "Demência fronto-temporal."], "correct": 0, "fixed": false, "note": null, "comment": "MEEM 8/30, fluência verbal 5 animais, relógio 1/5, exames normais e curso insidioso e progressivo de 1 ano: demência de Alzheimer (gabarito oficial). Alucinações visuais e perambulação noturna poderiam sugerir Lewy, mas faltam flutuação e parkinsonismo e predomina a amnésia."}, {"id": "p08-3", "topic": "Demência", "prova": "T26 · 1ª VA", "sort": [26, 1], "n": 3, "ctx": "Genésio, engenheiro por profissão, aposentou-se aos 65 anos de idade. À época, já apresentava algumas atitudes que fugiam de seu comportamento habitual: jocosidades inapropriadas, hipersexualismo, agressividade frequente, gasto excessivo de dinheiro e alteração da linguagem com perseverações de frases e ideias. Nos últimos dois anos, evoluiu com progressiva dificuldade para falar, com redução da produção verbal e dificuldade para realização de tarefas diárias, tais como: esquecimento de torneiras abertas e chama de fogão acesa, perda da habilidade de lidar com as próprias finanças e dificuldade para fazer compras adequadas. Foi ao geriatra, que fez uma série de testes e pediu alguns exames. No miniexame do Estado Mental (MEEM). ele obteve 13 de 30 pontos. Os exames laboratoriais foram normais e a imagem cerebral demonstrou atrofia dos lobos frontais e das porções anteriores dos lobos temporais. Foram iniciados tratamentos medicamentoso e não medicamentoso. Passados alguns meses. o paciente apresentou um quadro de confusão mental, inversão do ciclo sono-vigília, agressividade, incontinência urinária, não reconhecimento de familiares e alucinações visuais. Foi levado ao pronto-socorro. Administraram diazepan endovenoso e realizaram uma série de exames. Ele recebeu alta para casa com receita de diazepan e um antibiótico.", "stem": "Considerando esse caso clínico e os conhecimentos médicos correlatos, marque a assertiva verdadeira:", "opts": ["O diagnóstico clínico mais provável para a síndrome demencial do paciente é demência por corpos de Lewy.", "A melhor droga para retardar a progressão do quadro demencial do paciente é um (anticolinesterásico).", "No início do quadro, o geriatra realizou alguns testes. A avaliação da capacidade de cuidar das finanças faz parte da escala de Katz.", "Na avaliação do MEEM é possível inferir que o paciente apresenta declínio cognitivo."], "correct": 3, "fixed": false, "note": null, "comment": "MEEM 13/30 indica declínio cognitivo importante (D). A: é frontotemporal (comportamento, linguagem, atrofia frontotemporal). B: anticolinesterásicos não retardam a FTD. C: finanças pertence à escala de Lawton (AIVD), não ao Katz."}, {"id": "p09-16", "topic": "Demência", "prova": "T27 · 1ª VA", "sort": [27, 1], "n": 16, "ctx": "C.B.O., sexo masculino, 83 anos, foi levado ao neurologista pela filha devido a quadro de esquecimento progressivo com prejuízo para cuidar das finanças e fazendo confusão com medicação. Refere que ele evoluiu com hemiparesia a direita após AVC isquêmico há 3 meses. Além disso, ele vem apresentando agitação psicomotora, insônia e alucinação. O neurologista fez avaliação cognitiva, funcional comportamental do paciente por meio de escala e solicitou alguns exames para avaliação na hipótese de síndrome demencial. O paciente retornou com os exames solicitados, sendo feito o diagnóstico apropriado. Ao longo do acompanhamento, o paciente passou a fazer uso das seguintes medicações: Donepezila 10mg/noite, Citalopran 20 mg/ dia, Risperidona 2mg/ noite e Memantina 10mg 2x ao dia.", "stem": "Sobre as escalas para avaliação cognitiva, funcional e comportamental, podemos afirmar:", "opts": ["As dependências funcionais relacionadas a prejuízo para cuidar das finanças e confusão com medicação podem ser avaliadas pela escala de Lawton.", "O Mini exame do estado mental faz diagnóstico de síndrome demencial.", "Os distúrbios de comportamento são melhor avaliados pelo método de avaliação confusional (CAM).", "A escala de Katz relaciona-se às atividades instrumentais de vida diária."], "correct": 0, "fixed": false, "note": null, "comment": "A escala de Lawton avalia AIVD (finanças, medicação). B: o MEEM é rastreio e não fecha diagnóstico. C: o CAM rastreia delirium e o NPI avalia comportamento. D: o Katz avalia ABVD."}, {"id": "p09-17", "topic": "Demência", "prova": "T27 · 1ª VA", "sort": [27, 1], "n": 17, "ctx": "C.B.O., sexo masculino, 83 anos, foi levado ao neurologista pela filha devido a quadro de esquecimento progressivo com prejuízo para cuidar das finanças e fazendo confusão com medicação. Refere que ele evoluiu com hemiparesia a direita após AVC isquêmico há 3 meses. Além disso, ele vem apresentando agitação psicomotora, insônia e alucinação. O neurologista fez avaliação cognitiva, funcional comportamental do paciente por meio de escala e solicitou alguns exames para avaliação na hipótese de síndrome demencial. O paciente retornou com os exames solicitados, sendo feito o diagnóstico apropriado. Ao longo do acompanhamento, o paciente passou a fazer uso das seguintes medicações: Donepezila 10mg/noite, Citalopran 20 mg/ dia, Risperidona 2mg/ noite e Memantina 10mg 2x ao dia.", "stem": "Sobre os exames solicitados como rastreio diagnóstico de síndrome demencial, podemos afirmar que são fundamentais:", "opts": ["Dosagen de beta amilóide no liquor, TC de crânio.", "Dosagem de VDRL, RNM crânio.", "Dosagem de vitamina B1, eletroencefalograma.", "Dosagem de anti HIV, spect cerebral."], "correct": 1, "fixed": false, "note": null, "comment": "No rastreio de demência pedem-se exames laboratoriais (B12, TSH, hemograma, glicemia, cálcio, função renal e hepática, VDRL/HIV conforme o caso) e neuroimagem (RM). Biomarcadores liquóricos, SPECT e EEG não são rotina."}, {"id": "p09-18", "topic": "Demência", "prova": "T27 · 1ª VA", "sort": [27, 1], "n": 18, "ctx": "C.B.O., sexo masculino, 83 anos, foi levado ao neurologista pela filha devido a quadro de esquecimento progressivo com prejuízo para cuidar das finanças e fazendo confusão com medicação. Refere que ele evoluiu com hemiparesia a direita após AVC isquêmico há 3 meses. Além disso, ele vem apresentando agitação psicomotora, insônia e alucinação. O neurologista fez avaliação cognitiva, funcional comportamental do paciente por meio de escala e solicitou alguns exames para avaliação na hipótese de síndrome demencial. O paciente retornou com os exames solicitados, sendo feito o diagnóstico apropriado. Ao longo do acompanhamento, o paciente passou a fazer uso das seguintes medicações: Donepezila 10mg/noite, Citalopran 20 mg/ dia, Risperidona 2mg/ noite e Memantina 10mg 2x ao dia.", "stem": "Sobre o diagnóstico clínico apropriado para a síndrome demencial do paciente, podem afirmar que a melhor hipótese é:", "opts": ["Demência por corpos de Lewy.", "Demência de Alzheimer.", "Demência frototemporal.", "Demência vascular."], "correct": 3, "fixed": false, "note": null, "comment": "Demência vascular: declínio após AVC isquêmico com hemiparesia e fatores de risco. As alucinações e a agitação podem aparecer, mas o gatilho temporal é o AVC."}, {"id": "p09-19", "topic": "Demência", "prova": "T27 · 1ª VA", "sort": [27, 1], "n": 19, "ctx": "C.B.O., sexo masculino, 83 anos, foi levado ao neurologista pela filha devido a quadro de esquecimento progressivo com prejuízo para cuidar das finanças e fazendo confusão com medicação. Refere que ele evoluiu com hemiparesia a direita após AVC isquêmico há 3 meses. Além disso, ele vem apresentando agitação psicomotora, insônia e alucinação. O neurologista fez avaliação cognitiva, funcional comportamental do paciente por meio de escala e solicitou alguns exames para avaliação na hipótese de síndrome demencial. O paciente retornou com os exames solicitados, sendo feito o diagnóstico apropriado. Ao longo do acompanhamento, o paciente passou a fazer uso das seguintes medicações: Donepezila 10mg/noite, Citalopran 20 mg/ dia, Risperidona 2mg/ noite e Memantina 10mg 2x ao dia.", "stem": "Sobre as medicações em uso pelo paciente atualmente, podemos afirmar que quantas estão relacionadas à retardo na progressão da síndrome demencial?", "opts": ["1", "2", "3", "4"], "correct": 1, "fixed": true, "note": null, "comment": "Só donepezila (anticolinesterásico) e memantina (antagonista NMDA) são modificadoras sintomáticas da progressão. Citalopram e risperidona tratam sintomas comportamentais e não retardam a doença. Total: 2."}, {"id": "p10-4", "topic": "Demência", "prova": "T28 · 1ª VA", "sort": [28, 1], "n": 4, "ctx": "Olaf, 74 anos de idade, do sexo masculino, médico aposentado, sem problemas de saúde, sem uso de nenhum tipo de medicação realizava tarefas cotidianas sem dificuldade. Há cerca de 6 meses, começou a se perder nos arredores da casa onde mora com sua esposa há mais de 30 anos, não conseguindo realizar compras pequenas no mercado perto de casa. Ele continua comunicando-se adequadamente e realizando sua higiene pessoal de forma autônoma. Contudo, vem apresentando distúrbio de sono. A esposa informa que ele ora comporta-se normalmente, ora apresenta confusão mental. Não apresenta agressividade, nem alterações de personalidade, mas tem alucinações visuais. Mantém o controle dos esfíncteres. Ela tem percebido que o esposo está um pouco mais lento e com quedas recorrentes nos últimos 3 meses, embora consiga deslocar e fazer transferência sozinho. O exame físico geral mostrou-se sem alterações. Ao exame neurológico apresentou bradicinesia e rigidez em roda denteada nos 4 membros, sem outras anormalidades. O exame Mini do estado mental (mini mental) teve resultado de 24. A tomografia de crânio revelou atrofia cortical geral sem outras alterações. Exames bioquímicos pertinentes ao caso estavam normais.", "stem": "Das informações acima, conclui-se que o paciente apresenta", "opts": ["Demência vascular.", "Demência de Alzheimer.", "Demência frontotemporal", "Demência dos corpos de Lewy."], "correct": 3, "fixed": false, "note": null, "comment": "Demência com corpos de Lewy: flutuação, alucinações visuais, parkinsonismo (bradicinesia, roda denteada), quedas e MEEM relativamente preservado (24)."}, {"id": "p10-5", "topic": "Demência", "prova": "T28 · 1ª VA", "sort": [28, 1], "n": 5, "ctx": "Olaf, 74 anos de idade, do sexo masculino, médico aposentado, sem problemas de saúde, sem uso de nenhum tipo de medicação realizava tarefas cotidianas sem dificuldade. Há cerca de 6 meses, começou a se perder nos arredores da casa onde mora com sua esposa há mais de 30 anos, não conseguindo realizar compras pequenas no mercado perto de casa. Ele continua comunicando-se adequadamente e realizando sua higiene pessoal de forma autônoma. Contudo, vem apresentando distúrbio de sono. A esposa informa que ele ora comporta-se normalmente, ora apresenta confusão mental. Não apresenta agressividade, nem alterações de personalidade, mas tem alucinações visuais. Mantém o controle dos esfíncteres. Ela tem percebido que o esposo está um pouco mais lento e com quedas recorrentes nos últimos 3 meses, embora consiga deslocar e fazer transferência sozinho. O exame físico geral mostrou-se sem alterações. Ao exame neurológico apresentou bradicinesia e rigidez em roda denteada nos 4 membros, sem outras anormalidades. O exame Mini do estado mental (mini mental) teve resultado de 24. A tomografia de crânio revelou atrofia cortical geral sem outras alterações. Exames bioquímicos pertinentes ao caso estavam normais.", "stem": "Sobre a funcionalidade sugerida pelo texto, Olaf apresenta:", "opts": ["Dependência na escala de Lawton e na escala de Katz.", "Independência na escala de Lawton e na escala de Katz.", "Dependência na escala de Lawton e independência na escala de Katz.", "Independência na escala de Lawton e dependência na escala de Katz."], "correct": 2, "fixed": false, "note": null, "comment": "Lawton (AIVD): dependente, pois se perde e não consegue fazer compras. Katz (ABVD): independente, pois mantém higiene, continência e transferências."}, {"id": "p11-17", "topic": "Demência", "prova": "T29 · 1ª VA", "sort": [29, 1], "n": 17, "ctx": "Maria, 62 anos de idade, comparece à consulta acompanhada de sua filha, que informa perceber, nos últimos 12 meses, que a mãe vem apresentando alterações no comportamento - está sendo indiscreta em suas observações sobre terceiros e, quando dizem a ela o que fez, nega; passou a ser menos sensível ao sentimento de outras pessoas, está comendo de forma compulsiva e está menos ativa. Percebe alteração de memória, mas não tão acentuada. O que deixou a filha mais preocupada foi que a mãe, quando, ao tentar fazer café, ficou com o pó de café em uma mão, a panela na outra e não sabia o que fazer. Quando perguntada, diz que os sintomas começaram mais sutis, e que vêm evoluindo nos últimos seis meses. A paciente não apresenta antecedentes patológicos relevantes, não utiliza medicação de uso contínuo e não apresenta alterações no exame físico.", "stem": "Para avaliação cognitiva de Dona Maria, a melhor escolha é:", "opts": ["CAM", "GDS", "KATZ", "MEEM"], "correct": 3, "fixed": false, "note": null, "comment": "Para cognição, o MEEM. CAM rastreia delirium, GDS rastreia depressão e Katz mede ABVD."}, {"id": "p11-18", "topic": "Demência", "prova": "T29 · 1ª VA", "sort": [29, 1], "n": 18, "ctx": "Maria, 62 anos de idade, comparece à consulta acompanhada de sua filha, que informa perceber, nos últimos 12 meses, que a mãe vem apresentando alterações no comportamento - está sendo indiscreta em suas observações sobre terceiros e, quando dizem a ela o que fez, nega; passou a ser menos sensível ao sentimento de outras pessoas, está comendo de forma compulsiva e está menos ativa. Percebe alteração de memória, mas não tão acentuada. O que deixou a filha mais preocupada foi que a mãe, quando, ao tentar fazer café, ficou com o pó de café em uma mão, a panela na outra e não sabia o que fazer. Quando perguntada, diz que os sintomas começaram mais sutis, e que vêm evoluindo nos últimos seis meses. A paciente não apresenta antecedentes patológicos relevantes, não utiliza medicação de uso contínuo e não apresenta alterações no exame físico.", "stem": "Dona Maria não cuida mais das atividades domésticas devido a pequenos acidentes relacionados a dificuldade de execução, não sai mais sozinha de casa pelo risco de se perder, assim também não faz compras nem cuida mais das finanças. Já teve um episódio de ir à emergência por intoxicação medicamentosa, desde então a cuidadora lhe dá a medicação. Em relação ao telefone, atende ligações de familiares por curto tempo devido à agitação psicomotora. Sobre os relatos acima, podemos afirmar que Dona Maria é:", "opts": ["dependente para atividades básicas de vida diária", "independente para atividades básicas de vida diária", "dependente para atividades instrumentais de vida diária", "independente para atividades instrumentais de vida diária"], "correct": 2, "fixed": false, "note": null, "comment": "Dependente para AIVD (tarefas domésticas, sair sozinha, compras, finanças, medicação e telefone). Nada no relato indica perda de ABVD básicas."}, {"id": "p11-19", "topic": "Demência", "prova": "T29 · 1ª VA", "sort": [29, 1], "n": 19, "ctx": "Maria, 62 anos de idade, comparece à consulta acompanhada de sua filha, que informa perceber, nos últimos 12 meses, que a mãe vem apresentando alterações no comportamento - está sendo indiscreta em suas observações sobre terceiros e, quando dizem a ela o que fez, nega; passou a ser menos sensível ao sentimento de outras pessoas, está comendo de forma compulsiva e está menos ativa. Percebe alteração de memória, mas não tão acentuada. O que deixou a filha mais preocupada foi que a mãe, quando, ao tentar fazer café, ficou com o pó de café em uma mão, a panela na outra e não sabia o que fazer. Quando perguntada, diz que os sintomas começaram mais sutis, e que vêm evoluindo nos últimos seis meses. A paciente não apresenta antecedentes patológicos relevantes, não utiliza medicação de uso contínuo e não apresenta alterações no exame físico.", "stem": "Qual a principal suspeita diagnóstica para Dona Maria?", "opts": ["Demência por corpos de Lewy", "Demência frontotemporal", "Demência de Alzheimer", "Demência vascular"], "correct": 1, "fixed": false, "note": null, "comment": "Demência frontotemporal: início pré-senil (62 anos), mudança de comportamento (indiscrição, perda de empatia, hiperfagia compulsiva), apatia e memória relativamente poupada."}, {"id": "p11-20", "topic": "Demência", "prova": "T29 · 1ª VA", "sort": [29, 1], "n": 20, "ctx": "Maria, 62 anos de idade, comparece à consulta acompanhada de sua filha, que informa perceber, nos últimos 12 meses, que a mãe vem apresentando alterações no comportamento - está sendo indiscreta em suas observações sobre terceiros e, quando dizem a ela o que fez, nega; passou a ser menos sensível ao sentimento de outras pessoas, está comendo de forma compulsiva e está menos ativa. Percebe alteração de memória, mas não tão acentuada. O que deixou a filha mais preocupada foi que a mãe, quando, ao tentar fazer café, ficou com o pó de café em uma mão, a panela na outra e não sabia o que fazer. Quando perguntada, diz que os sintomas começaram mais sutis, e que vêm evoluindo nos últimos seis meses. A paciente não apresenta antecedentes patológicos relevantes, não utiliza medicação de uso contínuo e não apresenta alterações no exame físico.", "stem": "Pensando no tratamento farmacológico de Dona Maria, a melhor opção medicamentosa para retardar a progressão de sua doença é:", "opts": ["Donepezila", "Gingko biloba", "Melatonina", "Nenhuma das opções"], "correct": 3, "fixed": true, "note": null, "comment": "Não há fármaco que retarde a progressão da demência frontotemporal. Anticolinesterásicos (donepezila) não ajudam e podem piorar o comportamento; ginkgo e melatonina não alteram a evolução."}, {"id": "p14-3", "topic": "Demência", "prova": "T28 · 2ª VA", "sort": [28, 2], "n": 3, "ctx": null, "stem": "Celeno, sexo masculino, 83 anos, tem diagnóstico de Demência de Alzheimer há 5 anos, já cursando com incontinência urinária há 1 ano e uso contínuo de fraldas geriátricas. Há um mês foi levado ao médico devido a piora da agitação psicomotora, insônia e alucinação. Retorna com o cuidador a consulta médica. O cuidador relata que o comportamento do paciente melhorou, entretanto houve piora em algumas situações: lentidão de marcha, duas quedas no período, disfagia para líquidos, tremor de repouso em membros superiores assimetricamente e obstipação. As medicações em uso são: Donepezila 10mg/noite, Citalopram 20 mg/dia, Risperidona 2mg/ noite e Memantina 10mg 2x ao dia. Considerando que no envelhecimento, mudanças na quantidade e ativação de receptores podem ocorrer, justificando maior risco de iatrogenia com psicofármacos. Qual droga deve ter sua indicação reavaliada devido aos efeitos colaterais apresentados pelo paciente?", "opts": ["Donepezila.", "Citalopram.", "Risperidona.", "Memantina."], "correct": 2, "fixed": false, "note": null, "comment": "A risperidona, antipsicótico, causa parkinsonismo medicamentoso (lentificação, tremor de repouso, quedas, disfagia) e aumenta mortalidade e AVC em demência. Por isso é a droga a reavaliar (reduzir ou suspender)."}, {"id": "p05-14", "topic": "Depressão", "prova": "T30 · 1ª VA", "sort": [30, 1], "n": 14, "ctx": null, "stem": "Os transtornos depressivos apresentam significativa prevalência entre indivíduos idosos da comunidade. Quando os estudos de prevalência se referem a idosos hospitalizados ou institucionalizados, os resultados são ainda maiores, alcançando, aproximadamente, 22%. Nos estudos que avaliam sintomas depressivos clinicamente significantes, sem levar em consideração os critérios diagnósticos para depressão maior, mas utilizando escalas de sintomas, a variação na prevalência na comunidade aumenta para 6,4 a 59,3%. Assertivas: I. Todos os sintomas presentes na depressão em adultos jovens são encontrados em idosos. De modo geral, a depressão em idosos apresenta menos humor depressivo e mais anedonia, mais sintomas somáticos do que \"psicológicos\", maior frequência de associação com doença física e/ou cerebral e presença maior de déficit cognitivo e disfunção executiva. II. A depressão geriátrica apresenta maior correlação familiar, menor prevalência de demência e menor prejuízo no desempenho dos testes neuropsicológicos. III. A síndrome depressiva com demência reversível (antiga pseudodemência) é uma depressão associada ao déficit cognitivo que melhora com o tratamento da depressão. Pode evoluir para demência em 3 anos, podendo a depressão ser apenas uma manifestação precoce da demência.", "opts": ["Apenas I e II.", "Apenas II e III.", "Apenas I e III.", "I, II e III."], "correct": 2, "fixed": true, "note": null, "comment": "I correta (menos humor deprimido, mais anedonia e sintomas somáticos, mais déficit executivo). II errada: a depressão geriátrica tem MAIOR prevalência de demência e MAIOR prejuízo cognitivo, e menor correlação familiar. III correta (depressão com demência reversível)."}, {"id": "p10-2", "topic": "Depressão", "prova": "T28 · 1ª VA", "sort": [28, 1], "n": 2, "ctx": null, "stem": "Assinale a alternativa que apresenta características do transtorno depressivo em idosos.", "opts": ["Há apresentação clínica com maior frequência de sintomas atípicos, estando altamente relacionado às alterações neurovegetativas.", "O tratamento da depressão no idoso visa melhorar a qualidade de vida e não necessariamente a remissão completa de sintomas como no adulto.", "Medicamentos devem ser utilizados da mesma forma que no adulto jovem, uma vez que a tendência a eventos adversos é a mesma.", "A amitriptilina é a opção medicamentosa de primeira escolha nessa população com boa resposta em melhorar sono, apetite e redução de dor."], "correct": 0, "fixed": false, "note": null, "comment": "Gabarito oficial A: na depressão do idoso predominam sintomas atípicos e neurovegetativos (insônia, perda de apetite e de peso, queixas somáticas). C: errada (doses baixas, progressão lenta). D: errada (amitriptilina é evitada pelos Critérios de Beers)."}, {"id": "p12-21", "topic": "Depressão", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 21, "ctx": "Idoso, sexo masculino, contador aposentado, 72 anos, vem à consulta com relato de viuvez há 8 meses. Refere que mesmo antes da esposa falecer já apresentava desinteresse por atividades de que antes gostava como leitura e jogo de tênis. Inclusive, deixou de realizá-las completamente nos últimos dois meses, quando os sintomas agravaram: falta de energia, exaustão ao iniciar as atividades não conseguindo completar, redução do apetite com perda ponderal de 5kg, insônia, Mais lento ao deambular, prejuízo da memória e dificuldade de concentração. Refere ser coronariopata em uso irregular de medicação. Ao exame: Ele encontra-se emagrecido (IMC 18), consciente, corado, hidratado. AR: MV sem RA. ACV: RCR 2T sem sopro. PA: 120X80 mmHg, abdome sem alterações, membros sem edema e presença de artrose em joelhos. Circunferência da panturrilha: 28 cm Velocidade de marcha 6m 0,7m/s, força de pressão manual 25kg (reduzida), Escalas geriátricas: GDS 12/30, MEEM 30, TDR 5, Katz 6, Lawton 27.", "stem": "Sobre as afirmativas abaixo, marque a assertiva CORRETA:", "opts": ["Para evitar iatrogenia medicamentosa, seria uma boa conduta médica: fazer o inventário medicamentoso, não utilizar medicações inapropriadas para idosos, fazer os ajustes de doses necessários e explicar adequadamente a prescrição.", "A fluoxetina seria uma boa opção terapêutica para o paciente, pois é uma medicação segura para idosos.", "Ao prescrever o tratamento para insônia deste paciente, o diazepam seria uma boa escolha, pois no envelhecimento há redução de gordura corporal total e redução do tempo de meia vida desta droga.", "O tratamento adequado para a coronariopatia e o tratamento adequado do transtorno depressivo apresentado pelo paciente não são alvos do plano terapêutico deste paciente, e sim apenas a suplementação nutricional e atividade física."], "correct": 0, "fixed": false, "note": null, "comment": "A correta (inventário de medicamentos, evitar inapropriados, ajustar doses). B: errada, pois a fluoxetina tem meia-vida longa e interações (CYP2D6), então prefere-se sertralina ou escitalopram. C: errada, pois o diazepam é benzodiazepínico de meia-vida longa que se acumula no idoso. D: errada, pois depressão e coronariopatia devem ser tratadas."}, {"id": "p01-4", "topic": "Delirium", "prova": "T32 · 1ª VA", "sort": [32, 1], "n": 4, "ctx": null, "stem": "Um médico de família realiza uma visita domiciliar a um homem de 64 anos que está acamado e em tratamento para mal de Parkinson e hipertensão arterial. Durante a consulta, a filha do paciente relata que seu pai apresenta alterações de comportamento há 4 dias, estando mais prostrado e lentificado, com episódios de agitação noturna, com alucinações visuais e discurso incoerente. Ao exame físico, notam-se estertores crepitantes em terço médio à direita, sem alteração percebida na ausculta cardíaca. Paciente sarcopênico, bradicinético, com roda denteada em membros e tremor de repouso assimétrico em membros superiores. Apresenta pressão arterial de 90 x 50 mmHg, frequência cardíaca de 116 batimentos por minuto, frequência respiratória de 33 incursões respiratórias por minuto, disposição de oxigênio de 90% em ar ambiente e temperatura de 36,1 °C. Podemos afirmar que o paciente apresenta:", "opts": ["Demência rapidamente progressiva.", "Demência por corpos de Lewy.", "Demência na doença de Parkinson.", "Delirium"], "correct": 3, "fixed": false, "note": null, "comment": "Delirium: início agudo (4 dias), flutuação, desatenção, alucinações visuais e discurso incoerente num paciente com pneumonia (estertores, taquipneia, hipoxemia). O Parkinson é fator predisponente. Demências evoluem em meses a anos."}, {"id": "p03-15", "topic": "Delirium", "prova": "T31 · 1ª VA", "sort": [31, 1], "n": 15, "ctx": null, "stem": "Mulher de 88 anos de idade, sem morbidades prévias, há uma semana apresenta-se confusa, agitada durante à noite e, às vezes, sonolenta de dia, razão pela qual chega a ficar bastante tempo sem se alimentar. Acha que está na praia e pede para voltar para casa. Ao exame clínico, encontra-se desatenta, desorientada temporoespacialmente, corada, desidratada 1+/4, eupneica, afebril, frequência cardíaca de 88 bpm, pressão arterial de 110x70 mmHg. Ausculta cardíaca e pulmonar normais, abdome com dor à palpação em hipogástrio e Giordano positivo.", "opts": ["Delirium", "Síndrome demencial", "Depressão psicótica", "Acidente vascular cerebral"], "correct": 0, "fixed": false, "note": null, "comment": "Delirium: início agudo (1 semana), flutuação (agitada à noite, sonolenta de dia), desatenção, desorientação e ITU (Giordano positivo, dor em hipogástrio) como fator precipitante, em idosa sem demência prévia."}, {"id": "p05-13", "topic": "Delirium", "prova": "T30 · 1ª VA", "sort": [30, 1], "n": 13, "ctx": null, "stem": "Paciente do sexo masculino, de 85 anos, com função cognitiva prévia normal, foi atendido no pronto-socorro com história de que há 48 horas apresentava inversão do padrão do sono, alterações da função mental com períodos de agitação psicomotora alternando-se com letargia. Ao exame, apresentava-se agitado, desorientado no tempo e no espaço, falando coisas desconexas e sem conseguir focar a atenção para que o médico realizasse a anamnese.", "opts": ["Inversão do padrão do sono e fala desconexa.", "Alteração da atenção e início agudo com curso flutuante.", "Flutuações no nível de consciência e agitação psicomotora.", "Agitação psicomotora e inversão do padrão do sono."], "correct": 1, "fixed": false, "note": null, "comment": "Critérios CAM: (1) início agudo com curso flutuante e (2) desatenção, mais (3) pensamento desorganizado ou (4) alteração do nível de consciência. Os dois primeiros são obrigatórios; o item B reúne os essenciais."}, {"id": "p08-1", "topic": "Delirium", "prova": "T26 · 1ª VA", "sort": [26, 1], "n": 1, "ctx": "Umbelino, sexo masculino, 91 anos, é portador e DPOC por tabagismo e faz uso de broncodilatador inalatório há 2 anos (formoterol). Há 5 dias vem apresentando quadro de aumento da expectoração, da tosse e da dispnéia. Há 1 dia iniciou quadro de alterações do sono com inversão do ciclo sono vigília, fala desconexa, desatento e agressivo. Foi levado à emergência pelos familiares. Na admissão, foi detectado o seguinte exame físico: apresenta-se afebril, consciente, desorientado, com sibilos expiratórios e roncos difusos; a frequência cardíaca é de 102 bpm; a frequência respiratória é de 36 irpm e a pressão arterial é de 130/80 mmHg.", "stem": "Qual é a melhor hipótese para o quadro clínico de Umbelino?", "opts": ["Depressão.", "Acidente vascular encefálico.", "Síndrome demencial.", "Delirium."], "correct": 3, "fixed": false, "note": null, "comment": "Delirium: início em 1 dia, inversão do ciclo sono-vigília, fala desconexa, desatenção e agressividade, num idoso com DPOC exacerbado (infecção respiratória)."}, {"id": "p08-2", "topic": "Delirium", "prova": "T26 · 1ª VA", "sort": [26, 1], "n": 2, "ctx": "Umbelino, sexo masculino, 91 anos, é portador e DPOC por tabagismo e faz uso de broncodilatador inalatório há 2 anos (formoterol). Há 5 dias vem apresentando quadro de aumento da expectoração, da tosse e da dispnéia. Há 1 dia iniciou quadro de alterações do sono com inversão do ciclo sono vigília, fala desconexa, desatento e agressivo. Foi levado à emergência pelos familiares. Na admissão, foi detectado o seguinte exame físico: apresenta-se afebril, consciente, desorientado, com sibilos expiratórios e roncos difusos; a frequência cardíaca é de 102 bpm; a frequência respiratória é de 36 irpm e a pressão arterial é de 130/80 mmHg.", "stem": "Considerando o quadro de acima, podemos afirmar que se trata de fator precipitante:", "opts": ["Sexo masculino.", "DPOC descompensado.", "Idade", "Formoterol."], "correct": 1, "fixed": false, "note": null, "comment": "Fator precipitante é a agressão aguda que desencadeia o delirium: DPOC descompensado (infecção, hipoxemia). Idade e sexo são predisponentes, e o formoterol, de uso crônico, não é o gatilho."}, {"id": "p10-3", "topic": "Delirium", "prova": "T28 · 1ª VA", "sort": [28, 1], "n": 3, "ctx": null, "stem": "Você recebe uma ligação dos familiares de seu paciente de 76 anos, que tem diagnóstico estabelecido de Demência na Doença de Alzheimer em fase moderada e já está em uso de Donepezila 10 mg/dia e Memantina 20mg/dia. Nesta ligação, eles relatam que o paciente estava estável até 3 dias atrás, quando, subitamente, começou a ficar muito agitado, agressivo, sem dormir a \"noite toda\" e aparentemente com alucinações visuais. Sua principal hipótese diagnóstica deve ser:", "opts": ["Evolução da demência para fase avançada.", "Acidente vascular encefálico.", "Delirium.", "Depressão psicótica."], "correct": 2, "fixed": false, "note": null, "comment": "Idoso com Alzheimer que, de forma aguda, fica agitado, sem dormir e com alucinações, sugere delirium sobreposto (investigar infecção, medicamentos, retenção urinária), e não progressão da demência."}, {"id": "p12-18", "topic": "Delirium", "prova": "T25 · 2ª VA", "sort": [25, 2], "n": 18, "ctx": "Após dois anos da consulta diagnóstica de Demência de Alzheimer, uma paciente, sexo feminino, 85 anos, caiu e fraturou o quadril, não conseguindo deambular novamente. Desde então, ela necessita de uso contínuo de fraldas por dupla incontinência e apresenta anquilose progressiva de joelhos e punhos. Atualmente a paciente encontra-se hospitalizada com um quadro de irritabilidade, piora abrupta e flutuante da cognição com grande déficit de atenção, com alteração do ciclo sono e vigília e com fácies de dor à palpação abdominal. Durante a internação, a equipe de enfermagem observou que a paciente apresenta hiperemia mantida, mesmo após retirada da pressão, em pele íntegra localizada sobre proeminência sacral. Sobre a evolução dessa paciente, considera-se que:", "stem": "Sobre as afirmativas abaixo, marque a assertiva INCORRETA:", "opts": ["Queda constitui uma síndrome geriátrica comum, geralmente de etiologia multifatorial, caracterizando-se pelo deslocamento não intencional do corpo para um nível inferior à posição inicial, com incapacidade de correção em tempo hábil, comprometendo a estabilidade.", "A Demência de Alzheimer dessa paciente pode ser considerado um fator intrínseco para queda por diminuição de processamento do sistema nervoso central relacionado à síndrome demencial.", "A paciente apresenta um quadro clínico de delirium na hospitalização. Pensando de forma geral, delirium configura fator de risco para quedas.", "Não há critérios suficientes para se fechar o diagnóstico de síndrome de imobilidade para essa paciente."], "correct": 3, "fixed": false, "note": null, "comment": "A incorreta é D: a paciente tem demência grave (déficit cognitivo grave) e contraturas/anquilose (critérios maiores), além de dupla incontinência e lesão de pressão (menores), então há sim critérios de síndrome de imobilidade. As demais estão corretas, e delirium é fator de risco para quedas."}, {"id": "p01-2", "topic": "10-TaGA", "prova": "T32 · 1ª VA", "sort": [32, 1], "n": 2, "ctx": null, "stem": "O 10-minute Targeted Geriatric Assessment (10-TaGA) é uma ferramenta multidimensional breve desenvolvida para avaliar o risco de desfechos adversos em idosos, especialmente naqueles atendidos em cenários de ritmo acelerado (fast-paced settings), como prontos-socorros e hospitais-dia. Sobre as características, os domínios e a interpretação clínica do 10-TaGA, assinale a alternativa correta:", "opts": ["O instrumento avalia exclusivamente parâmetros físicos, como a velocidade da marcha e a circunferência da panturrilha, excluindo o rastreio cognitivo por demandar tempo incompatível com o ambiente de pronto-atendimento.", "A ferramenta fundamenta-se na teoria do acúmulo de déficits, avaliando diversos domínios clínicos e gerando um índice de fragilidade contínuo (de 0 a 1), em que pontuações mais altas se correlacionam com maior risco de mortalidade em 1 ano.", "O 10-TaGA atua como um substituto definitivo da Avaliação Geriátrica Ampla (AGA) em idosos com múltiplas comorbidades crônicas descompensadas no ambiente ambulatorial.", "A pontuação final da ferramenta é baseada estritamente no modelo fenotipico de Fried, classificando o idoso em três categorias fixas e imutáveis: robusto, pré- frágil e frágil."], "correct": 1, "fixed": false, "note": null, "comment": "O 10-TaGA se baseia na teoria do acúmulo de déficits e gera um índice de fragilidade contínuo (0 a 1); valores maiores se relacionam a mais risco de mortalidade. Inclui cognição, não é exclusivamente físico, não substitui a AGA e não é o modelo fenotípico de Fried."}, {"id": "p01-1", "topic": "Epidemiologia do envelhecimento", "prova": "T32 · 1ª VA", "sort": [32, 1], "n": 1, "ctx": null, "stem": "Sobre a transição demográfica e a epidemiologia do envelhecimento no Brasil, assinale a alternativa correta:", "opts": ["A sobremortalidade masculina durante a vida adulta desencadeou um processo que culmina na feminização do envelhecimento.", "A transição demográfica brasileira vem ocorrendo de forma lenta e progressiva, em um período semelhante ao de países europeus, permitindo adaptação estrutural adequada dos sistemas de saúde.", "O conceito de transição epidemiológica no país caracteriza-se pela substituição total e imediata da carga de doenças infectocontagiosas por doenças crônico-degenerativas.", "A queda da taxa de mortalidade na população idosa foi o evento primário mais importante, inclusive sobrepõe a queda da taxa de fecundidade, que desencadeou o início da transição demográfica no país na década 60."], "correct": 0, "fixed": false, "note": null, "comment": "A: correta, pois a sobremortalidade masculina leva à feminização do envelhecimento. B: errada, pois a transição brasileira foi rápida e não deu tempo de adaptar o sistema de saúde, ao contrário da europeia. C: errada, pois a transição epidemiológica é de sobreposição (tripla carga), não substituição total e imediata. D: errada, pois o evento primário foi a queda da fecundidade."}], "provas": ["T25 · 1ª VA", "T25 · 2ª VA", "T26 · 1ª VA", "T27 · 1ª VA", "T27 · 2ª VA", "T28 · 1ª VA", "T28 · 2ª VA", "T29 · 1ª VA", "T30 · 1ª VA", "T30 · 2ª VA", "T31 · 1ª VA", "T31 · 2ª VA", "T32 · 1ª VA", "T32 · 2ª VA"], "topics": ["Neurologia", "Abdome", "Demência", "Depressão", "Delirium", "10-TaGA", "Epidemiologia do envelhecimento"], "guide": [{"topic": "Neurologia", "intro": "É o tema mais cobrado (60 questões nas 14 provas). Quase tudo é semiologia: saber reconhecer a síndrome pelos achados e o nervo/lado da lesão.", "subs": [{"t": "Nível de consciência e Escala de Coma de Glasgow", "h": "<p><b>Nível<\/b> de consciência = grau de alerta (vigília). <b>Conteúdo<\/b> = cognição (atenção, orientação, memória). Estados: lúcido, sonolento, torporoso, coma.<\/p><div class=\"tw\"><table><thead><tr><th>Item<\/th><th>Pontuação<\/th><\/tr><\/thead><tbody><tr><td>Abertura ocular<\/td><td>4 espontânea · 3 ao chamado · 2 à dor · 1 nenhuma<\/td><\/tr><tr><td>Resposta verbal<\/td><td>5 orientada · 4 confusa · 3 palavras soltas/inapropriadas · 2 sons incompreensíveis · 1 nenhuma<\/td><\/tr><tr><td>Resposta motora<\/td><td>6 obedece comandos · 5 localiza a dor · 4 retirada · 3 flexão anormal (decorticação) · 2 extensão anormal (descerebração) · 1 nenhuma<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Total de 3 a 15. Glasgow ≤ 8 = gravidade (considerar via aérea avançada).<\/li><li>Sem resposta verbal, o máximo é 11 (4 + 1 + 6).<\/li><li>Cuidado: a questão costuma dar a descrição em palavras, e você soma cada item.<\/li><\/ul>"}, {"t": "Nervos cranianos (I a XII)", "h": "<div class=\"tw\"><table><thead><tr><th>Par<\/th><th>Função e exame<\/th><th>Lesão típica<\/th><\/tr><\/thead><tbody><tr><td>I olfatório<\/td><td>Olfato<\/td><td>Anosmia<\/td><\/tr><tr><td>II óptico<\/td><td>Acuidade (Snellen, cada olho separado, tabela a 6 m), campimetria por confrontação, visão de cores, fundoscopia. Aferência do reflexo fotomotor<\/td><td>Perda visual, defeito de campo<\/td><\/tr><tr><td>III oculomotor<\/td><td>Reto superior, inferior, medial, oblíquo inferior, elevador da pálpebra e parassimpático da pupila<\/td><td>Ptose, olho desviado para fora e para baixo (estrabismo divergente), midríase<\/td><\/tr><tr><td>IV troclear<\/td><td>Oblíquo superior<\/td><td>Diplopia ao olhar para baixo/dentro (descer escada)<\/td><\/tr><tr><td>V trigêmeo<\/td><td>Sensitivo: V1 oftálmico, V2 maxilar, V3 mandibular. Motor: mastigação (masseter, temporal, pterigóideos). Reflexos: córneo-palpebral (aferência V, eferência VII), mandibular, espirro<\/td><td>Hipoestesia facial, desvio da mandíbula para o lado lesado, reflexo córneo-palpebral abolido<\/td><\/tr><tr><td>VI abducente<\/td><td>Reto lateral (abdução)<\/td><td>Estrabismo convergente; diplopia horizontal, máxima ao olhar para o lado da lesão<\/td><\/tr><tr><td>VII facial<\/td><td>Mímica, gustação dos 2/3 anteriores da língua, lacrimejamento. Eferência do córneo-palpebral<\/td><td>Paralisia facial (ver abaixo)<\/td><\/tr><tr><td>VIII vestibulococlear<\/td><td>Audição (Rinne, Weber) e equilíbrio<\/td><td>Surdez, vertigem, nistagmo<\/td><\/tr><tr><td>IX e X<\/td><td>Véu palatino, úvula, reflexo do vômito (nauseoso), voz<\/td><td>Úvula desviada para o lado são; disfagia, disfonia<\/td><\/tr><tr><td>XI acessório<\/td><td>Esternocleidomastóideo (gira a cabeça para o lado oposto) e trapézio (eleva o ombro)<\/td><td>Fraqueza e atrofia desses músculos do mesmo lado da lesão<\/td><\/tr><tr><td>XII hipoglosso<\/td><td>Mobilidade da língua<\/td><td>Língua desvia para o lado lesado; atrofia, fasciculações<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "Paralisia facial: central x periférica", "h": "<div class=\"tw\"><table><thead><tr><th><\/th><th>Periférica (lesão do nervo/núcleo)<\/th><th>Central (lesão supranuclear, ex.: AVC)<\/th><\/tr><\/thead><tbody><tr><td>Face acometida<\/td><td>Hemiface inteira, incluindo testa e olho (não fecha o olho, não levanta sobrancelha)<\/td><td>Só a metade inferior; poupa a testa<\/td><\/tr><tr><td>Lado<\/td><td>Mesmo lado da lesão<\/td><td>Lado oposto à lesão<\/td><\/tr><tr><td>Sinais<\/td><td>Apagamento do sulco nasolabial, desvio da rima labial para o lado sadio, sinal de Bell<\/td><td>Acompanha déficit motor ou sensitivo do corpo (AVC)<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "Audição: testes de Rinne e Weber", "h": "<div class=\"tw\"><table><thead><tr><th><\/th><th>Surdez condutiva<\/th><th>Surdez neurossensorial<\/th><\/tr><\/thead><tbody><tr><td>Rinne<\/td><td>Negativo (via óssea melhor que a aérea)<\/td><td>Positivo (via aérea melhor, ambas diminuídas)<\/td><\/tr><tr><td>Weber<\/td><td>Lateraliza para o ouvido PIOR<\/td><td>Lateraliza para o ouvido MELHOR<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "Reflexos pupilares", "h": "<ul><li><b>Via:<\/b> aferência pelo II (óptico), eferência pelo III (parassimpático, via gânglio ciliar).<\/li><li><b>Defeito aferente (óptico):<\/b> iluminando o olho doente, NENHUMA pupila responde; iluminando o outro olho, ambas respondem.<\/li><li><b>Defeito eferente (III/gânglio ciliar):<\/b> pupila dilatada que não reage nem ao reflexo direto nem ao consensual naquele olho; o outro olho reage normalmente.<\/li><li>Midríase com ptose e olho desviado para fora = lesão do III.<\/li><\/ul>"}, {"t": "Motricidade: força, tônus, trofismo e reflexos", "h": "<div class=\"tw\"><table><thead><tr><th>Grau MRC<\/th><th>Significado<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>Sem contração<\/td><\/tr><tr><td>1<\/td><td>Contração visível sem movimento<\/td><\/tr><tr><td>2<\/td><td>Move com a gravidade eliminada (apoiado), não vence a gravidade<\/td><\/tr><tr><td>3<\/td><td>Vence a gravidade, mas não a resistência do examinador<\/td><\/tr><tr><td>4<\/td><td>Vence resistência parcial<\/td><\/tr><tr><td>5<\/td><td>Força normal<\/td><\/tr><\/tbody><\/table><\/div><ul><li><b>Manobras que avaliam força (déficit sutil):<\/b> Barré (membros inferiores, decúbito ventral, joelhos fletidos), Mingazzini (decúbito dorsal, quadris e joelhos a 90°) e prova dos braços estendidos. O membro parético cai.<\/li><li><b>Tônus:<\/b> hipertonia elástica (canivete) = piramidal; hipertonia plástica (roda denteada) = extrapiramidal; hipotonia = 2º neurônio e cerebelar.<\/li><li><b>Reflexos profundos:<\/b> aumentados no 1º neurônio (com clônus e Babinski); diminuídos ou abolidos no 2º neurônio.<\/li><li><b>Fasciculações:<\/b> contrações visíveis e involuntárias de um grupo muscular, do 2º neurônio.<\/li><\/ul>"}, {"t": "Síndromes neurológicas (tabela comparativa)", "h": "<div class=\"tw\"><table><thead><tr><th>Síndrome<\/th><th>Força<\/th><th>Tônus<\/th><th>Reflexos<\/th><th>Outros achados<\/th><\/tr><\/thead><tbody><tr><td>1º neurônio motor (piramidal)<\/td><td>↓ (paresia/plegia)<\/td><td>↑ elástico (canivete)<\/td><td>↑ , clônus<\/td><td>Babinski +, sem atrofia importante<\/td><\/tr><tr><td>2º neurônio motor<\/td><td>↓<\/td><td>↓<\/td><td>↓ ou abolidos<\/td><td>Atrofia, fasciculações<\/td><\/tr><tr><td>Extrapiramidal hipocinética (parkinsoniana)<\/td><td>Normal<\/td><td>↑ plástico (roda denteada)<\/td><td>Normais<\/td><td>Bradicinesia, tremor de repouso, instabilidade postural<\/td><\/tr><tr><td>Extrapiramidal hipercinética<\/td><td>Normal<\/td><td>Variável<\/td><td>Normais<\/td><td>Movimentos involuntários (coreia, atetose, balismo, distonia)<\/td><\/tr><tr><td>Cerebelar<\/td><td>Normal<\/td><td>↓<\/td><td>Pendulares<\/td><td>Dismetria, disdiadococinesia, ataxia, marcha ebriosa, tremor de intenção; sinais do mesmo lado da lesão<\/td><\/tr><tr><td>Meníngea<\/td><td>Normal<\/td><td>Rigidez de nuca<\/td><td>Normais<\/td><td>Cefaleia, febre, vômitos; sinais de Kernig, Brudzinski e Lasègue<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "Coordenação, equilíbrio e marcha", "h": "<ul><li><b>Coordenação:<\/b> diadococinesia, índex-nariz, calcanhar-joelho; Romberg avalia equilíbrio estático e propriocepção.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Marcha<\/th><th>Característica / causa<\/th><\/tr><\/thead><tbody><tr><td>Ceifante<\/td><td>Hemiparesia espástica; o membro faz um semicírculo<\/td><\/tr><tr><td>Parkinsoniana<\/td><td>Passos curtos, arrastados, tronco fletido<\/td><\/tr><tr><td>Tabética<\/td><td>Perda da propriocepção; olhar no chão, pé levantado bruscamente e calcanhar batendo forte<\/td><\/tr><tr><td>Escarvante (steppage)<\/td><td>Fraqueza dos dorsiflexores; eleva a perna e arrasta a ponta do pé (pé caído)<\/td><\/tr><tr><td>Ebriosa (cerebelar)<\/td><td>Base alargada, cambaleante<\/td><\/tr><tr><td>Anserina<\/td><td>Miopatia; \"andar de pato\"<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "Cognição e linguagem na avaliação neurológica", "h": "<ul><li><b>Atenção:<\/b> teste do \"A\" (bater palma a cada letra A), subtração seriada, dígitos. Desatenção é o núcleo do delirium.<\/li><li><b>Afasias:<\/b> Broca (fala não fluente, compreensão relativamente preservada), Wernicke (fala fluente, compreensão ruim), de condução (repetição alterada).<\/li><li><b>Disartria<\/b> = defeito da articulação (lábios, língua, palato) por lesão neurológica. <b>Disfonia<\/b> = voz. <b>Dislalia<\/b> = troca de fonemas.<\/li><li><b>Agnosias:<\/b> reconhecer estímulo com sensação preservada. Prosopagnosia (rostos), astereognosia (objetos pelo tato), agrafestesia (números escritos na pele).<\/li><li><b>Apraxia:<\/b> incapacidade de executar ato motor aprendido, com força preservada.<\/li><li><b>MEEM<\/b> avalia orientação, registro de 3 palavras, atenção/cálculo, evocação, linguagem e praxia construtiva; depende da escolaridade.<\/li><\/ul>"}]}, {"topic": "Abdome", "intro": "Segundo tema mais cobrado (52 questões). O padrão é sempre: ler a vinheta e dar o diagnóstico sindrômico entre cinco tipos de abdome agudo.", "subs": [{"t": "As 5 síndromes de abdome agudo", "h": "<div class=\"tw\"><table><thead><tr><th>Síndrome<\/th><th>Como é a dor / achados<\/th><th>Causas clássicas<\/th><\/tr><\/thead><tbody><tr><td>Inflamatório<\/td><td>Início progressivo, localizada, febre, defesa, Blumberg ou Murphy<\/td><td>Apendicite, colecistite, colangite, diverticulite, pancreatite<\/td><\/tr><tr><td>Obstrutivo<\/td><td>Cólica, distensão, vômitos (fecaloides), parada de flatos e fezes, RHA aumentados e metálicos, timpanismo<\/td><td>Bridas (cirurgia prévia), hérnia encarcerada, tumor, volvo<\/td><\/tr><tr><td>Perfurativo<\/td><td>Início súbito em \"facada\", abdome em tábua, descompressão dolorosa difusa, RHA ausentes, sinal de Jobert (perda da macicez hepática)<\/td><td>Úlcera péptica perfurada (AINE, gastrite), diverticulite perfurada<\/td><\/tr><tr><td>Isquêmico<\/td><td>Dor súbita, desproporcional ao exame físico (abdome pouco doloroso, sem peritonite no início), RHA diminuídos, hipotensão<\/td><td>Embolia mesentérica (fibrilação atrial, arritmias), trombose, aterosclerose<\/td><\/tr><tr><td>Hemorrágico<\/td><td>Choque (hipotensão, taquicardia, palidez, lipotimia), pouca febre, dor súbita; Cullen/Grey-Turner<\/td><td>Gravidez ectópica rota (atraso menstrual), aneurisma de aorta roto (massa pulsátil), ruptura de baço/fígado<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "Sinais semiológicos", "h": "<div class=\"tw\"><table><thead><tr><th>Sinal<\/th><th>O que indica<\/th><\/tr><\/thead><tbody><tr><td>Blumberg (descompressão brusca dolorosa)<\/td><td>Irritação peritoneal<\/td><\/tr><tr><td>Murphy (interrupção da inspiração à palpação sob o rebordo costal direito)<\/td><td>Colecistite<\/td><\/tr><tr><td>Jobert<\/td><td>Pneumoperitônio (perda da macicez hepática): perfuração de víscera oca<\/td><\/tr><tr><td>Cullen (equimose periumbilical) e Grey-Turner (equimose em flancos)<\/td><td>Sangue no retroperitônio: pancreatite necro-hemorrágica, hemoperitônio<\/td><\/tr><tr><td>Proust (abaulamento e dor do fundo de saco de Douglas ao toque)<\/td><td>Sangue ou pus na pelve: ectópica rota<\/td><\/tr><tr><td>Tríade de Charcot (dor em HCD, icterícia, febre com calafrios)<\/td><td>Colangite aguda; com hipotensão e confusão = pêntade de Reynolds<\/td><\/tr><tr><td>RHA metálicos<\/td><td>Obstrução mecânica<\/td><\/tr><tr><td>RHA ausentes / abdome em tábua<\/td><td>Peritonite (perfuração)<\/td><\/tr><tr><td>Abdome pouco doloroso com RHA diminuídos e dor intensa<\/td><td>Isquemia mesentérica<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "Quadros clássicos", "h": "<ul><li><b>Apendicite:<\/b> dor periumbilical que migra para a fossa ilíaca direita, anorexia, náuseas, febre baixa, Blumberg.<\/li><li><b>Colecistite:<\/b> cólica em hipocôndrio direito após alimentos gordurosos, irradiação para a escápula, febre, Murphy.<\/li><li><b>Pancreatite aguda:<\/b> dor epigástrica em faixa, vômitos, litíase biliar ou álcool; forma grave com Grey-Turner e Cullen.<\/li><li><b>Diverticulite:<\/b> dor e febre em fossa ilíaca esquerda; perfurada = abdome em tábua.<\/li><li><b>Úlcera perfurada:<\/b> uso de AINE, dor epigástrica súbita que se generaliza.<\/li><li><b>Obstrução por bridas:<\/b> cirurgia abdominal prévia, vômitos fecaloides, parada de eliminação.<\/li><li><b>Isquemia mesentérica:<\/b> fibrilação atrial ou arritmia, dor desproporcional.<\/li><li><b>Ectópica rota:<\/b> mulher em idade fértil, atraso menstrual, choque, fundo de saco abaulado.<\/li><li><b>Aneurisma de aorta roto:<\/b> idoso, massa pulsátil, hipotensão.<\/li><\/ul>"}]}, {"topic": "Demência", "intro": "19 questões nas provas anteriores. O foco é diferenciar o tipo de demência pelo caso clínico e conhecer escalas e tratamento.", "subs": [{"t": "Conceitos: envelhecimento normal, TCL e demência", "h": "<ul><li><b>Síndrome demencial:<\/b> declínio cognitivo em memória e outro domínio, com prejuízo da funcionalidade, sem delirium.<\/li><li><b>TCL (comprometimento cognitivo leve):<\/b> déficit cognitivo objetivo com atividades instrumentais preservadas (é o que o diferencia da demência).<\/li><li><b>Diagnóstico sindrômico<\/b> (síndrome demencial) vem antes do <b>etiológico<\/b> (Alzheimer, vascular...).<\/li><\/ul>"}, {"t": "Escalas de avaliação", "h": "<div class=\"tw\"><table><thead><tr><th>Escala<\/th><th>O que avalia<\/th><\/tr><\/thead><tbody><tr><td>MEEM<\/td><td>Cognição global (30 pontos); rastreio, não faz diagnóstico; ponto de corte depende da escolaridade<\/td><\/tr><tr><td>Teste do relógio, fluência verbal (animais)<\/td><td>Funções executivas e visuoespaciais, linguagem<\/td><\/tr><tr><td>Katz<\/td><td>Atividades BÁSICAS de vida diária (banho, vestir, higiene, transferência, continência, alimentação)<\/td><\/tr><tr><td>Lawton<\/td><td>Atividades INSTRUMENTAIS (telefone, compras, refeições, tarefas domésticas, medicação, finanças, transporte)<\/td><\/tr><tr><td>Pfeffer<\/td><td>Funcionalidade informada pelo acompanhante<\/td><\/tr><tr><td>NPI<\/td><td>Sintomas neuropsiquiátricos e comportamento<\/td><\/tr><tr><td>CAM<\/td><td>Delirium (não é escala cognitiva geral)<\/td><\/tr><tr><td>GDS<\/td><td>Depressão geriátrica<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "Tipos de demência", "h": "<div class=\"tw\"><table><thead><tr><th>Tipo<\/th><th>Pistas do caso clínico<\/th><\/tr><\/thead><tbody><tr><td>Alzheimer<\/td><td>Início insidioso, amnésia de fixação, progressão lenta; depois afasia, apraxia, agnosia; atrofia hipocampal<\/td><\/tr><tr><td>Vascular<\/td><td>Relação temporal com AVC, deterioração em degraus, déficits focais, fatores de risco vasculares<\/td><\/tr><tr><td>Corpos de Lewy<\/td><td>Flutuação cognitiva, alucinações visuais bem formadas, parkinsonismo, distúrbio do sono REM, quedas, sensibilidade a neurolépticos. Demência antes ou até 1 ano do parkinsonismo<\/td><\/tr><tr><td>Demência na doença de Parkinson<\/td><td>Parkinsonismo estabelecido por mais de 1 ano antes da demência<\/td><\/tr><tr><td>Frontotemporal (variante comportamental)<\/td><td>Início antes dos 65, apatia, desinibição, perda de juízo crítico, hiperfagia, estereotipias; memória relativamente preservada; atrofia frontal/temporal anterior<\/td><\/tr><tr><td>Causas reversíveis<\/td><td>Déficit de B12, hipotireoidismo, neurossífilis, hidrocefalia de pressão normal, depressão, medicamentos<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "Investigação e tratamento", "h": "<ul><li><b>Exames de rotina:<\/b> hemograma, glicemia, função renal e hepática, TSH, B12, cálcio, VDRL (HIV conforme o caso) e neuroimagem (RM preferencial).<\/li><li><b>Inibidores da colinesterase<\/b> (donepezila, rivastigmina, galantamina): leve a moderada (Alzheimer, Lewy, demência do Parkinson). <b>Memantina:<\/b> moderada a grave.<\/li><li><b>Frontotemporal:<\/b> nenhum fármaco retarda a doença; anticolinesterásicos não ajudam.<\/li><li><b>Sintomas comportamentais:<\/b> primeiro medidas não farmacológicas e tratar causas (dor, infecção). Antipsicóticos só se necessário, com cautela (risco de AVC e mortalidade; causam parkinsonismo, devem ser evitados em Lewy). Evitar benzodiazepínicos.<\/li><li>Citalopram, risperidona e outros tratam sintomas e não retardam a progressão.<\/li><\/ul>"}]}, {"topic": "Delirium", "intro": "7 questões. Cai muito a distinção delirium x demência e os critérios do CAM.", "subs": [{"t": "Definição e diagnóstico (CAM)", "h": "<ul><li>Síndrome confusional aguda: início em horas a dias, curso flutuante, desatenção e alteração cognitiva ou do nível de consciência, causada por condição médica.<\/li><li><b>CAM:<\/b> (1) início agudo e curso flutuante + (2) desatenção + (3) pensamento desorganizado OU (4) alteração do nível de consciência. Os itens 1 e 2 são obrigatórios.<\/li><li><b>Subtipos:<\/b> hiperativo (agitação, alucinações), hipoativo (letargia; o mais comum e o mais perdido) e misto.<\/li><\/ul>"}, {"t": "Fatores predisponentes e precipitantes", "h": "<div class=\"tw\"><table><thead><tr><th>Predisponentes (vulnerabilidade)<\/th><th>Precipitantes (gatilho agudo)<\/th><\/tr><\/thead><tbody><tr><td>Idade avançada, demência, fragilidade, comorbidades, déficit visual e auditivo, polifarmácia<\/td><td>Infecção (ITU, pneumonia), medicamentos (anticolinérgicos, benzodiazepínicos, opioides), desidratação, distúrbios hidroeletrolíticos, hipóxia, dor, retenção urinária, fecaloma, cirurgia, internação<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "Delirium x demência x depressão", "h": "<div class=\"tw\"><table><thead><tr><th><\/th><th>Delirium<\/th><th>Demência<\/th><th>Depressão<\/th><\/tr><\/thead><tbody><tr><td>Início<\/td><td>Agudo (horas a dias)<\/td><td>Insidioso (meses a anos)<\/td><td>Semanas a meses<\/td><\/tr><tr><td>Curso<\/td><td>Flutuante<\/td><td>Estável e progressivo<\/td><td>Persistente<\/td><\/tr><tr><td>Atenção e vigília<\/td><td>Atenção prejudicada<\/td><td>Preservada até fases tardias<\/td><td>Pode ter pouca concentração<\/td><\/tr><\/tbody><\/table><\/div>"}, {"t": "Manejo", "h": "<ul><li>Procurar e tratar a causa (infecção, medicamentos, desidratação, retenção urinária).<\/li><li>Medidas não farmacológicas: reorientação, sono preservado, óculos e aparelho auditivo, mobilização, hidratação, evitar contenção.<\/li><li>Antipsicótico em dose baixa só para agitação grave ou risco; evitar benzodiazepínicos (exceto abstinência alcoólica).<\/li><\/ul>"}]}, {"topic": "Depressão", "intro": "3 questões, mas o tema é recorrente em geriatria.", "subs": [{"t": "Características no idoso", "h": "<ul><li>Menos humor depressivo e mais anedonia, queixas somáticas e neurovegetativas, irritabilidade, déficit cognitivo e disfunção executiva.<\/li><li>Associada a doença física e cerebral, luto, isolamento e dor. Maior prevalência em idosos hospitalizados e institucionalizados.<\/li><li>Rastreio com a Escala de Depressão Geriátrica (GDS).<\/li><li><b>Síndrome depressiva com demência reversível (pseudodemência):<\/b> déficit cognitivo que melhora com o tratamento da depressão; pode ser pródromo de demência.<\/li><\/ul>"}, {"t": "Tratamento", "h": "<ul><li>ISRS são a primeira linha (sertralina, escitalopram; citalopram em dose máxima menor por risco de QT). Começar com dose baixa e subir devagar.<\/li><li>Evitar amitriptilina e outros tricíclicos (anticolinérgicos, Critérios de Beers). Fluoxetina tem meia-vida longa e interações.<\/li><li>Evitar benzodiazepínicos para insônia (acúmulo, quedas, delirium). Atenção à hiponatremia com ISRS.<\/li><li>Objetivo: remissão completa e qualidade de vida. Tratar também as comorbidades (por exemplo, coronariopatia) e fazer inventário de medicamentos.<\/li><\/ul>"}]}, {"topic": "10-TaGA", "intro": "Só 1 questão, mas bem objetiva. Confirme os domínios exatos nos slides da disciplina.", "subs": [{"t": "10-minute Targeted Geriatric Assessment", "h": "<ul><li>Ferramenta multidimensional <b>breve<\/b> para estimar risco de desfechos adversos em idosos de cenários de ritmo acelerado (pronto-socorro, hospital-dia).<\/li><li>Baseia-se na <b>teoria do acúmulo de déficits<\/b> e gera um <b>índice de fragilidade contínuo (0 a 1)<\/b>: quanto maior, maior o risco, inclusive de mortalidade em 1 ano.<\/li><li>Inclui o rastreio cognitivo; não é s
